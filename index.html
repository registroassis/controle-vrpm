<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231F3B63'/%3E%3Ctext x='32' y='42' font-family='Georgia' font-size='26' fill='%23fff' text-anchor='middle'%3EVR%3C/text%3E%3C/svg%3E">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>/* Controle VRPM — versão site (GitHub Pages + Firebase).
   Faz o papel do ambiente do Claude: login (Firebase Authentication, e-mail e senha), banco (Cloud Firestore),
   downloads e usuário. O app em si é o mesmo do artefato. Configuração em config.js. */
(function () {
  const CFG = window.VRPM_FIREBASE_CONFIG;
  const DONO = String(window.VRPM_DONO || '').trim().toLowerCase();
  const css = `
  #vw-login{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg,#F3F4F6);font-family:Manrope,system-ui,sans-serif}
  #vw-login .box{width:100%;max-width:380px;background:var(--panel,#fff);border:1px solid var(--line,#E3E6EB);border-radius:14px;padding:26px 22px;box-shadow:0 10px 30px rgba(15,23,42,.08)}
  #vw-login h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:1.6rem;margin:0 0 2px;color:var(--ink,#111827)}
  #vw-login p{margin:0 0 16px;color:var(--mute,#6B7280);font-size:.9rem}
  #vw-login label{display:block;font-size:.8rem;font-weight:600;margin:12px 0 4px;color:var(--ink,#111827)}
  #vw-login input{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid var(--line,#D1D5DB);border-radius:9px;font:inherit;font-size:1rem;background:var(--panel,#fff);color:var(--ink,#111827)}
  #vw-login button{font:inherit;cursor:pointer}
  #vw-login .pri{width:100%;margin-top:16px;padding:12px;border:0;border-radius:9px;background:var(--accent,#1F3B63);color:#fff;font-weight:700;font-size:1rem}
  #vw-login .pri[disabled]{opacity:.6;cursor:progress}
  #vw-login .lnk{background:none;border:0;color:var(--accent,#1F3B63);font-weight:600;padding:6px 0;font-size:.88rem}
  #vw-login .row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:10px}
  #vw-login .msg{margin-top:12px;font-size:.88rem;padding:10px 12px;border-radius:9px;display:none}
  #vw-login .msg.err{display:block;background:#FDECEC;color:#9B1C1C}
  #vw-login .msg.ok{display:block;background:#E8F5EE;color:#1E6B45}
  #vw-users{position:fixed;inset:0;z-index:9998;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:16px;font-family:Manrope,system-ui,sans-serif}
  #vw-users .box{width:100%;max-width:460px;background:var(--panel,#fff);color:var(--ink,#111827);border-radius:14px;padding:20px;max-height:90vh;overflow:auto}
  #vw-users li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line,#E5E7EB);word-break:break-all}
  #vw-users ul{list-style:none;margin:10px 0;padding:0}
  #vw-users input{flex:1;padding:10px;border:1px solid var(--line,#D1D5DB);border-radius:8px;font:inherit}
  #vw-users button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line,#D1D5DB);background:var(--panel,#fff);padding:8px 12px;color:inherit}
  #vw-users .pri{background:var(--accent,#1F3B63);color:#fff;border:0}`;
  const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);

  let resolveCaps; const capsReady = new Promise(r => { resolveCaps = r; });
  window.claude = { use: async (nome) => (await capsReady)[nome] || null };

  if (!CFG || !CFG.apiKey || /COLE_AQUI/.test(CFG.apiKey)) {
    document.addEventListener('DOMContentLoaded', () => tela(`<h1>Controle VRPM</h1><p>Falta configurar o Firebase: edite o arquivo <b>config.js</b> com os dados do projeto.</p>`));
    return;
  }
  firebase.initializeApp(CFG);
  const auth = firebase.auth();
  const db = firebase.firestore();
  db.settings({ ignoreUndefinedProperties: true, merge: true });
  window.VRPM_DB = db; // usado pela tarefa agendada do Meu Anfitrião (pelo navegador já logado)

  function tela(html) {
    let el = document.getElementById('vw-login');
    if (!el) { el = document.createElement('div'); el.id = 'vw-login'; document.body.appendChild(el); }
    el.innerHTML = `<div class="box">${html}</div>`; return el;
  }
  const fecharTela = () => document.getElementById('vw-login')?.remove();
  const msg = (t, ok) => { const m = document.querySelector('#vw-login .msg'); if (m) { m.className = 'msg ' + (ok ? 'ok' : 'err'); m.textContent = t; } };
  const erroPt = (e) => ({
    'auth/invalid-email': 'E-mail inválido.', 'auth/user-not-found': 'E-mail ou senha incorretos.', 'auth/wrong-password': 'E-mail ou senha incorretos.',
    'auth/invalid-credential': 'E-mail ou senha incorretos.', 'auth/invalid-login-credentials': 'E-mail ou senha incorretos.',
    'auth/email-already-in-use': 'Este e-mail já tem cadastro. Use "Entrar" ou "Esqueci a senha".', 'auth/weak-password': 'A senha precisa ter pelo menos 6 caracteres.',
    'auth/too-many-requests': 'Muitas tentativas. Aguarde alguns minutos e tente de novo.', 'auth/network-request-failed': 'Sem conexão com a internet.',
  })[e?.code] || ('Não foi possível concluir: ' + (e?.message || e));

  function telaEntrar(modo = 'entrar') {
    const criar = modo === 'criar';
    tela(`<h1>Controle VRPM</h1><p>${criar ? 'Primeiro acesso: crie sua senha. Você receberá um e-mail para confirmar o endereço.' : 'Entre com seu e-mail e senha.'}</p>
      <form id="vw-f" novalidate><label for="vw-e">E-mail</label><input id="vw-e" type="email" autocomplete="username" required>
      <label for="vw-s">Senha</label><input id="vw-s" type="password" autocomplete="${criar ? 'new-password' : 'current-password'}" required minlength="6">
      ${criar ? '<label for="vw-s2">Repita a senha</label><input id="vw-s2" type="password" autocomplete="new-password" required>' : ''}
      <button class="pri" type="submit">${criar ? 'Criar acesso' : 'Entrar'}</button></form>
      <div class="row">${criar ? '<button class="lnk" data-m="entrar">Já tenho senha</button>' : '<button class="lnk" data-m="reset">Esqueci a senha / criar minha senha</button>'}</div>
      <div class="msg"></div>`);
    document.querySelectorAll('#vw-login [data-m]').forEach(b => b.onclick = async () => {
      if (b.dataset.m === 'reset') { const e = document.getElementById('vw-e').value.trim(); if (!e) return msg('Digite seu e-mail acima e clique de novo em "Esqueci a senha".'); try { await auth.sendPasswordResetEmail(e); msg('Enviamos um e-mail para redefinir a senha (veja também o spam).', true); } catch (er) { msg(erroPt(er)); } return; }
      telaEntrar(b.dataset.m);
    });
    document.getElementById('vw-f').onsubmit = async (ev) => {
      ev.preventDefault(); const bt = ev.target.querySelector('.pri'); bt.disabled = true;
      const e = document.getElementById('vw-e').value.trim(), s = document.getElementById('vw-s').value;
      try {
        if (criar) { if (s !== document.getElementById('vw-s2').value) { bt.disabled = false; return msg('As senhas não são iguais.'); } const r = await auth.createUserWithEmailAndPassword(e, s); await r.user.sendEmailVerification(); }
        else await auth.signInWithEmailAndPassword(e, s);
      } catch (er) { msg(erroPt(er)); bt.disabled = false; }
    };
  }
  function telaVerificar(u) {
    tela(`<h1>Confirme seu e-mail</h1><p>Enviamos um link de confirmação para <b>${u.email}</b>. Abra o e-mail (veja também o spam), clique no link e depois volte aqui.</p>
      <button class="pri" id="vw-ok">Já confirmei</button><div class="row"><button class="lnk" id="vw-re">Reenviar e-mail</button><button class="lnk" id="vw-out">Sair</button></div><div class="msg"></div>`);
    document.getElementById('vw-ok').onclick = async () => { await u.reload(); await u.getIdToken(true); if (auth.currentUser.emailVerified) iniciar(auth.currentUser); else msg('Ainda não confirmado. Clique no link do e-mail e tente de novo.'); };
    document.getElementById('vw-re').onclick = async () => { try { await u.sendEmailVerification(); msg('E-mail reenviado.', true); } catch (er) { msg(erroPt(er)); } };
    document.getElementById('vw-out').onclick = () => auth.signOut().then(() => location.reload());
  }
  function telaSemAcesso(u) {
    tela(`<h1>Acesso não liberado</h1><p>O e-mail <b>${u.email}</b> ainda não tem acesso ao Controle VRPM. Peça para a administradora incluir você em <b>Usuários</b> e depois clique em "Tentar de novo".</p>
      <button class="pri" id="vw-ok">Tentar de novo</button><div class="row"><button class="lnk" id="vw-out">Sair</button></div>`);
    document.getElementById('vw-ok').onclick = () => location.reload();
    document.getElementById('vw-out').onclick = () => auth.signOut().then(() => location.reload());
  }

  let iniciado = false;
  async function iniciar(u) {
    if (iniciado) return;
    const email = (u.email || '').toLowerCase(); const dono = !!DONO && email === DONO;
    // acesso: o dono sempre; os demais precisam estar na lista acesso/lista (as regras do Firestore conferem o mesmo)
    try { await db.doc('imoveis/__teste_acesso__').get(); }
    catch (e) { if (e.code === 'permission-denied') return telaSemAcesso(u); }
    iniciado = true; fecharTela();
    window.VRPM_WEB = { email, dono, sair: () => auth.signOut().then(() => location.reload()), usuarios: () => gerenciarUsuarios() };
    const downloads = { save: async ({ filename, data }) => { const blob = data instanceof Blob ? data : new Blob([data]); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); return { status: 'saved' }; } };
    const user = { id: async () => u.uid, email, can: async () => true, isOwner: () => dono };
    resolveCaps({ db, user, downloads, assets: null });
  }

  async function gerenciarUsuarios() {
    const ref = db.doc('acesso/lista');
    const pintar = async () => {
      const snap = await ref.get(); const lista = (snap.exists ? snap.data().emails : null) || [];
      let el = document.getElementById('vw-users'); if (!el) { el = document.createElement('div'); el.id = 'vw-users'; document.body.appendChild(el); }
      el.innerHTML = `<div class="box"><h2 style="margin:0 0 4px">Usuários com acesso</h2><p style="margin:0;color:#6B7280;font-size:.88rem">Quem está na lista pode ver e lançar. Para cada pessoa nova: 1) inclua o e-mail aqui; 2) no Firebase, em Authentication › Usuários › Adicionar usuário, cadastre o mesmo e-mail com uma senha provisória; 3) a pessoa entra no site e, se quiser, troca a senha em "Esqueci a senha / criar minha senha".</p>
        <ul><li><span><b>${DONO}</b> (administradora)</span></li>${lista.map(e => `<li><span>${e}</span><button data-rm="${e}">Remover</button></li>`).join('')}</ul>
        <form id="vw-add" style="display:flex;gap:8px"><input type="email" id="vw-ne" placeholder="e-mail da pessoa" required><button class="pri" type="submit">Incluir</button></form>
        <div style="text-align:right;margin-top:14px"><button id="vw-close">Fechar</button></div></div>`;
      el.querySelector('#vw-close').onclick = () => el.remove();
      el.querySelectorAll('[data-rm]').forEach(b => b.onclick = async () => { if (!confirm('Remover o acesso de ' + b.dataset.rm + '?')) return; await ref.set({ emails: lista.filter(x => x !== b.dataset.rm), atualizado_em: new Date().toISOString() }); pintar(); });
      el.querySelector('#vw-add').onsubmit = async (ev) => { ev.preventDefault(); const e = el.querySelector('#vw-ne').value.trim().toLowerCase(); if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) return; if (!lista.includes(e)) await ref.set({ emails: [...lista, e], atualizado_em: new Date().toISOString() }); pintar(); };
    };
    try { await pintar(); } catch (e) { alert('Só a administradora pode gerenciar usuários.'); }
  }

  document.addEventListener('DOMContentLoaded', () => {
    tela('<h1>Controle VRPM</h1><p>Carregando…</p>');
    auth.onAuthStateChanged(u => {
      if (!u) return telaEntrar();
      iniciar(u);
    });
  });
})();
</script>
<title>Controle VRPM</title>
<meta name="theme-color" content="#F3F4F6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: escritório de gestão patrimonial — menu lateral claro e recolhível, cabeçalho fixo com trilha de navegação,
   área de trabalho em grafite frio; azul-tinta como cor de ação, latão só para marcar a página atual e avisos de ouro. */
:root{
  --bg:#F2F3F5; --surface:#FFFFFF; --surface-2:#F7F8FA; --ink:#121A2B; --ink-2:#38445A; --mute:#68738A; --line:#E2E5EB; --line-2:#EDEFF3;
  --accent:#1F3B63; --accent-2:#2A4D7E; --accent-ink:#FFFFFF; --accent-soft:#EAEFF7;
  --side:#FBFBFC; --side-ink:#38445A; --side-act:#EAEFF7;
  --navy:#14223A; --navy-2:#1B2D4B; --navy-ink:#C9D3E6; --gold:#A8843F; --gold-soft:#F6EFE1;
  --pos:#18794E; --pos-soft:#E3F2EA; --neg:#B3372A; --neg-soft:#FAE8E5; --warn:#94600A; --warn-soft:#FBF1DD;
  --shadow-sm:0 1px 2px rgba(18,26,43,.05);
  --shadow:0 1px 2px rgba(18,26,43,.05),0 8px 24px rgba(18,26,43,.07);
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-cond:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-disp:"Fraunces",Georgia,"Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px; --r-sm:9px; --side-w:248px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1018; --surface:#131926; --surface-2:#182030; --ink:#E7EBF2; --ink-2:#C3CBD9; --mute:#8F9AB0; --line:#252F42; --line-2:#1D2636;
  --accent:#8EAEE0; --accent-2:#A9C2EA; --accent-ink:#0C1018; --accent-soft:#1C2A44;
  --side:#10151F; --side-ink:#C3CBD9; --side-act:#1C2A44;
  --navy:#080D16; --navy-2:#111A2C; --navy-ink:#AEBBD3; --gold:#CFAE6B; --gold-soft:#2E2617;
  --pos:#5CC48D; --pos-soft:#14301F; --neg:#EF8F80; --neg-soft:#3A1B17; --warn:#E5B55A; --warn-soft:#352812;
  --shadow-sm:0 1px 2px rgba(0,0,0,.35); --shadow:0 2px 8px rgba(0,0,0,.35),0 12px 30px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1018; --surface:#131926; --surface-2:#182030; --ink:#E7EBF2; --ink-2:#C3CBD9; --mute:#8F9AB0; --line:#252F42; --line-2:#1D2636;
  --accent:#8EAEE0; --accent-2:#A9C2EA; --accent-ink:#0C1018; --accent-soft:#1C2A44;
  --side:#10151F; --side-ink:#C3CBD9; --side-act:#1C2A44;
  --navy:#080D16; --navy-2:#111A2C; --navy-ink:#AEBBD3; --gold:#CFAE6B; --gold-soft:#2E2617;
  --pos:#5CC48D; --pos-soft:#14301F; --neg:#EF8F80; --neg-soft:#3A1B17; --warn:#E5B55A; --warn-soft:#352812;
  --shadow-sm:0 1px 2px rgba(0,0,0,.35); --shadow:0 2px 8px rgba(0,0,0,.35),0 12px 30px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14.5px/1.55 var(--f-body);-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.8em;letter-spacing:-.01em}
.mute{color:var(--mute)}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warnc{color:var(--warn)}
h1,h2,h3{font-family:var(--f-cond);margin:0;text-wrap:balance;color:var(--ink)}
h1{font:600 1.75rem/1.15 var(--f-disp);letter-spacing:-.015em;font-variation-settings:"opsz" 72}
h2{font-size:.98rem;font-weight:700;letter-spacing:-.005em}
h3{font-size:.92rem;font-weight:700}
.eyebrow{font:700 .66rem/1.25 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}

/* ---------- shell */
.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100%;transition:grid-template-columns .2s ease}
.app.collapsed{--side-w:76px}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:var(--side);color:var(--side-ink);padding:18px 12px 14px;border-right:1px solid var(--line);overflow:hidden}
.brand{display:flex;gap:11px;align-items:center;padding:0 6px 16px;margin-bottom:6px;border-bottom:1px solid var(--line-2);min-height:54px}
.brand-mark{width:36px;height:36px;border-radius:10px;background:var(--navy);color:#fff;display:grid;place-items:center;font:600 14px var(--f-disp);letter-spacing:.04em;flex:none;box-shadow:inset 0 -2px 0 var(--gold)}
.brand-txt{min-width:0;flex:1}
.brand b{display:block;font:800 .95rem/1.15 var(--f-body);color:var(--ink);letter-spacing:-.01em;white-space:nowrap}
.brand small{color:var(--mute);font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.side-toggle{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--mute);flex:none;transition:transform .2s,border-color .15s}
.side-toggle:hover{border-color:var(--accent);color:var(--accent)}
.side-toggle svg{width:15px;height:15px}
.app.collapsed .side-toggle{transform:rotate(180deg)}
.side-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding-top:4px;scrollbar-width:thin;margin-inline:-4px;padding-inline:4px}
.side-group{margin-bottom:8px}
.side-label{font:700 .62rem var(--f-body);letter-spacing:.11em;text-transform:uppercase;color:var(--mute);padding:10px 10px 4px;white-space:nowrap}
.nav-btn{display:flex;align-items:center;gap:11px;width:100%;padding:7px 10px;border:0;background:none;border-radius:8px;text-align:left;color:var(--side-ink);font-weight:600;font-size:.86rem;position:relative;transition:background .12s,color .12s;min-height:36px;white-space:nowrap}
.nav-btn svg{width:18px;height:18px;flex:none;opacity:.8}
.nav-btn:hover{background:var(--surface-2);color:var(--ink)}
.nav-btn[aria-current="page"]{background:var(--side-act);color:var(--accent)}
.nav-btn[aria-current="page"] svg{opacity:1}
.nav-btn[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
.nav-btn .badge{margin-left:auto}
.side-foot{display:flex;align-items:center;gap:9px;font-size:.72rem;color:var(--mute);padding:12px 10px 0;border-top:1px solid var(--line-2);white-space:nowrap}
.dot-ok{width:7px;height:7px;border-radius:50%;background:var(--pos);box-shadow:0 0 0 3px color-mix(in srgb,var(--pos) 20%,transparent);flex:none}
.app.collapsed .brand-txt,.app.collapsed .nav-t,.app.collapsed .side-label{display:none}
.app.collapsed .brand{flex-direction:column;gap:10px;padding-inline:0}
.app.collapsed .nav-btn{justify-content:center;padding:9px 0}
.app.collapsed .nav-btn .badge{position:absolute;top:2px;right:6px;min-width:16px;height:16px;line-height:16px;font-size:.6rem;padding:0 4px}
.app.collapsed .side-group{border-top:1px solid var(--line-2);padding-top:6px}
.app.collapsed .side-group:first-child{border-top:0}
.app.collapsed .side-foot{justify-content:center;padding-inline:0}
main{min-width:0;padding-block:0 56px;padding-inline:clamp(16px,3vw,40px);max-width:1480px;width:100%}
.topbar{display:flex;align-items:flex-end;gap:16px;margin:0 0 22px;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:20px 0 16px;border-bottom:1px solid var(--line)}
.ptitle{flex:1;min-width:0}
.crumb{font:700 .68rem var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.crumb span{color:var(--gold);margin:0 3px}
.ptitle p{margin:5px 0 0;color:var(--mute);font-size:.86rem}

.datebox span{display:block;font:700 .6rem/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.datebox.late{border-color:color-mix(in srgb,var(--neg) 40%,var(--line));background:var(--neg-soft)}
.datebox.late b,.datebox.late span{color:var(--neg)}
/* folha lateral */
.sheet{background:var(--bg)}
.sheet-h h2{font:600 1.2rem/1.2 var(--f-disp)}
.sheet-f{gap:8px}
.toast{background:var(--navy);border-radius:12px}
@media (min-width:901px){.toast{left:calc(50% + var(--side-w) / 2)}}
.money{font:800 1.4rem var(--f-body)!important}
.f label{font-weight:700;font-size:.78rem}
.check{border-radius:10px}
.note{border-radius:10px}
@media (prefers-reduced-motion:reduce){.app,.side-toggle{transition:none}}
@media (max-width:900px){.top-actions .top-new{display:none}}
@media (max-width:640px){.kpis{grid-template-columns:1fr 1fr;gap:10px}.kpi{padding:13px 14px}.kpi-ic{display:none}.kpi.has-ic .eyebrow{padding-right:0;min-height:0}.kpi .s{font-size:.74rem}}
.stepsec{font-family:Manrope,system-ui,sans-serif;font-size:.95rem;font-weight:700;margin:18px 0 8px;color:var(--ink,inherit)}
.stepsec .mute{font-weight:500;font-size:.82rem}
.tot-line{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);margin-top:10px;padding-top:8px;font-variant-numeric:tabular-nums}
sup.rkpos{font-size:.62rem;color:var(--mute,#888);margin-left:2px;font-weight:600}
table.rank td:first-child{font-size:1.05rem;white-space:nowrap}
.btn.is-busy{opacity:.6;pointer-events:none;cursor:progress}
.kpi.kpi-on{outline:2px solid var(--accent);outline-offset:-2px}
</style>

<style>body{margin:0;background:var(--bg)}</style></head><body><div id="app"></div>

<script>
/* Controle VRPM — gerador da planilha (mesmo código no app e no Node).
   buildWorkbook(ExcelJS, data) -> ExcelJS.Workbook
   data = { imoveis:[{...,parcelas:[]}], lancamentos:[], contas:[], recebiveis:[], indices:[],
            origens:[], pendencias:[], historico:[], conferencia:{}, meta:{} } */
(function (root) {
  const C = {
    ink: 'FF14232B', petrol: 'FF1B5A6E', petrolSoft: 'FFE3EEF1', line: 'FFD5DEE2',
    zebra: 'FFF6F9FA', white: 'FFFFFFFF', pos: 'FF2F7A4A', posSoft: 'FFE4F2E8',
    neg: 'FFB3412E', negSoft: 'FFF8E3DF', warn: 'FF9A6510', warnSoft: 'FFFBF0DC', mute: 'FF5E6E75',
  };
  const BRL = '"R$" #,##0.00;[Red]-"R$" #,##0.00;"–"';
  const DATE = 'dd/mm/yyyy';
  const PCT = '0.0%';
  const MAXR = 2000; // linhas preparadas com fórmulas/validação
  const MESES = ['JANEIRO','FEVEREIRO','MARÇO','ABRIL','MAIO','JUNHO','JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];
  const MES3 = ['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];

  function d(iso) { if (!iso) return null; const [y, m, dd] = iso.slice(0, 10).split('-').map(Number); return new Date(Date.UTC(y, m - 1, dd)); }
  function col(n) { let s = ''; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; }
  const font = (o = {}) => Object.assign({ name: 'Calibri', size: 10, color: { argb: C.ink } }, o);
  const fill = (argb) => ({ type: 'pattern', pattern: 'solid', fgColor: { argb } });
  const thin = { style: 'thin', color: { argb: C.line } };

  function headerRow(ws, headers, opts = {}) {
    const row = ws.getRow(opts.row || 1);
    headers.forEach((h, i) => {
      const c = row.getCell(i + 1);
      c.value = h.t;
      c.font = font({ bold: true, color: { argb: C.white }, size: 10 });
      c.fill = fill(h.calc ? C.mute : C.petrol);
      c.alignment = { vertical: 'middle', horizontal: 'center', wrapText: true };
      c.border = { bottom: thin };
      if (h.note) c.note = h.note;
      ws.getColumn(i + 1).width = h.w || 14;
    });
    row.height = 30;
    ws.views = [{ state: 'frozen', xSplit: opts.xSplit || 0, ySplit: opts.row || 1, showGridLines: false }];
    ws.autoFilter = { from: { row: opts.row || 1, column: 1 }, to: { row: opts.row || 1, column: headers.length } };
  }
  function fmtCols(ws, headers, first, last) {
    headers.forEach((h, i) => {
      const cl = ws.getColumn(i + 1);
      if (h.fmt) cl.numFmt = h.fmt;
      for (let r = first; r <= last; r++) {
        const c = ws.getRow(r).getCell(i + 1);
        if (h.fmt) c.numFmt = h.fmt;
        c.font = font(h.calc ? { color: { argb: C.mute } } : {});
        c.alignment = { vertical: 'middle', wrapText: !!h.wrap, horizontal: h.align };
        if (r % 2 === 0) c.fill = fill(C.zebra);
      }
    });
  }
  function list(ws, ref, formula, opts = {}) {
    ws.dataValidations.add(ref, {
      type: 'list', allowBlank: true, formulae: [formula], showErrorMessage: !opts.soft,
      errorStyle: opts.soft ? 'warning' : 'stop', errorTitle: 'Valor inválido',
      error: opts.msg || 'Escolha um valor da lista.',
    });
  }
  function numVal(ws, ref, msg) {
    ws.dataValidations.add(ref, { type: 'decimal', operator: 'greaterThanOrEqual', allowBlank: true, formulae: [0],
      showErrorMessage: true, errorTitle: 'Valor inválido', error: msg || 'Informe um número maior ou igual a zero.' });
  }
  function dateVal(ws, ref) {
    ws.dataValidations.add(ref, { type: 'date', operator: 'greaterThan', allowBlank: true, formulae: [new Date(Date.UTC(1990, 0, 1))],
      showErrorMessage: true, errorTitle: 'Data inválida', error: 'Digite uma data válida (dd/mm/aaaa).' });
  }
  function cfExpr(ws, ref, expr, style) { ws.addConditionalFormatting({ ref, rules: [{ type: 'expression', formulae: [expr], style }] }); }
  const st = {
    pos: { font: { color: { argb: C.pos }, bold: true }, fill: fill(C.posSoft) },
    neg: { font: { color: { argb: C.neg }, bold: true }, fill: fill(C.negSoft) },
    warn: { font: { color: { argb: C.warn }, bold: true }, fill: fill(C.warnSoft) },
    mute: { font: { color: { argb: C.mute } } },
  };
  function title(ws, text, sub, width) {
    ws.mergeCells(1, 1, 1, width); ws.mergeCells(2, 1, 2, width);
    const t = ws.getCell(1, 1); t.value = text; t.font = font({ size: 16, bold: true, color: { argb: C.petrol } });
    const s = ws.getCell(2, 1); s.value = sub; s.font = font({ size: 10, color: { argb: C.mute }, italic: true });
    ws.getRow(1).height = 26;
  }

  function buildWorkbook(ExcelJS, data, opts = {}) {
    const wb = new ExcelJS.Workbook();
    wb.creator = 'Controle VRPM'; wb.created = new Date();
    wb.calcProperties = { fullCalcOnLoad: true };
    const today = opts.today || new Date().toISOString().slice(0, 10);
    const anoAtual = Number(today.slice(0, 4));
    const anos = Array.from(new Set([2025, 2026, anoAtual, anoAtual + 1, ...data.lancamentos.map(l => l.ano)])).sort();
    const imoveis = data.imoveis.filter(i => !i.excluido);
    const nomeIm = Object.fromEntries(imoveis.map(i => [i.id, i.nome]));

    const sPainel = wb.addWorksheet('PAINEL', { properties: { tabColor: { argb: C.petrol } } });
    const sIm = wb.addWorksheet('IMÓVEIS', { properties: { tabColor: { argb: C.petrol } } });
    const sPar = wb.addWorksheet('PARCELAS', { properties: { tabColor: { argb: C.petrol } } });
    const sLan = wb.addWorksheet('LANÇAMENTOS', { properties: { tabColor: { argb: C.petrol } } });
    const sBal = wb.addWorksheet('BALANÇO', { properties: { tabColor: { argb: C.pos } } });
    const sRec = wb.addWorksheet('RECEBÍVEIS', { properties: { tabColor: { argb: C.pos } } });
    const sCon = wb.addWorksheet('CONTAS FIXAS', { properties: { tabColor: { argb: C.petrol } } });
    const sRm = wb.addWorksheet('RECEBÍVEIS MANUAIS');
    const sInd = wb.addWorksheet('ÍNDICES INCC');
    const sOri = wb.addWorksheet('ORIGENS');
    const sPen = wb.addWorksheet('PENDÊNCIAS', { properties: { tabColor: { argb: C.warn } } });
    const sConf = wb.addWorksheet('CONFERÊNCIA', { properties: { tabColor: { argb: C.warn } } });
    const sHist = wb.addWorksheet('HISTÓRICO');
    const sEmp = wb.addWorksheet('EMPRESA', { properties: { tabColor: { argb: C.petrol } } });
    const sMan = wb.addWorksheet('COMO USAR', { properties: { tabColor: { argb: C.mute } } });
    const sL = wb.addWorksheet('LISTAS', { state: 'hidden' });

    // ------------------------------------------------------------ LISTAS
    const L = {
      A: ['RECEITA', 'DESPESA', 'INVESTIMENTO'],
      B: ['REALIZADO', 'PREVISTO'],
      C: ['ENTRADA', 'SINAL', 'MENSAL', 'INTERMEDIARIA', 'COMISSÃO', 'COMPRA', 'CHAVES'],
      D: ['PAGO', 'AGUARDANDO PAGAMENTO', 'PAGAMENTO CONDICIONADO', 'QUITADO', 'LOCADO'],
      E: ['MENSAL', 'TRIMESTRAL', 'ANUAL'],
      F: ['EM CONSTRUÇÃO', 'EM VISTORIA', 'ENTREGUE'],
      G: ['Imóveis residenciais', 'Hotelaria Intercity (condo-hotel)'],
      H: ['NÃO', 'SIM'],
      I: ['ABERTA', 'RESOLVIDA'],
      L: ['HIS-2', 'NR'],
      M: ['OPERANDO CURTA TEMPORADA', 'LOCAÇÃO MENSAL', 'OPERANDO CONDO-HOTEL', 'EM MONTAGEM', 'AGUARDANDO ENTREGA'],
      J: anos,
      K: MESES,
    };
    Object.entries(L).forEach(([c, arr]) => { sL.getCell(`${c}1`).value = c; arr.forEach((v, i) => { sL.getCell(`${c}${i + 2}`).value = v; }); });
    const LR = (c) => `LISTAS!$${c}$2:$${c}$${L[c].length + 1}`;

    // ------------------------------------------------------------ IMÓVEIS
    const hIm = [
      { t: 'ID', w: 10 }, { t: 'Nome', w: 34, wrap: true }, { t: 'Grupo', w: 20 }, { t: 'Proprietário', w: 13 },
      { t: 'Unidade', w: 22, wrap: true }, { t: 'Endereço', w: 30, wrap: true }, { t: 'Metragem', w: 10 },
      { t: 'Matrícula', w: 11 }, { t: 'Data da compra', w: 12, fmt: DATE }, { t: 'Situação da obra', w: 15 },
      { t: 'Previsão de entrega', w: 12, fmt: DATE }, { t: 'Valor do contrato', w: 15, fmt: BRL },
      { t: 'Valor de entrada', w: 14, fmt: BRL }, { t: 'Nº de parcelas (contrato)', w: 11 }, { t: 'Reajuste', w: 16, wrap: true },
      { t: 'Base intermediária', w: 15, fmt: BRL }, { t: 'Origem nos lançamentos', w: 15 },
      { t: 'Total pago', w: 15, fmt: BRL, calc: 1 }, { t: 'Saldo em aberto', w: 14, fmt: BRL, calc: 1 },
      { t: 'Parcelas pagas', w: 9, calc: 1, align: 'center' }, { t: 'Parcelas em aberto', w: 9, calc: 1, align: 'center' },
      { t: '% parcelas pagas', w: 10, fmt: PCT, calc: 1 }, { t: 'Próximo vencimento', w: 12, fmt: DATE, calc: 1 },
      { t: 'Status do pagamento', w: 14, calc: 1 }, { t: 'Arquivado', w: 9 }, { t: 'Observações', w: 40, wrap: true },
      { t: 'Aba original', w: 22 }, { t: 'Categoria', w: 9, align: 'center' }, { t: 'Situação de uso', w: 22 },
      { t: 'Administração da locação', w: 18 }, { t: 'Valor da locação (mês)', w: 14, fmt: BRL }, { t: 'Início do contrato', w: 12, fmt: DATE },
    ];
    headerRow(sIm, hIm, { xSplit: 2 });
    const nIm = Math.max(imoveis.length + 50, 100);
    imoveis.forEach((im, k) => {
      const r = k + 2;
      const obs = [im.observacoes, im.data_compra_texto && `Data da compra no original: "${im.data_compra_texto}"`,
        im.valor_entrada_texto && `Entrada: ${im.valor_entrada_texto}`].filter(Boolean).join(' | ');
      sIm.getRow(r).values = [im.id, im.nome, im.grupo, im.proprietario || null, im.unidade || null, im.endereco || null,
        im.metragem || null, im.matricula || null, d(im.data_compra), im.situacao_obra || null, d(im.previsao_entrega),
        im.valor_contrato ?? null, im.valor_entrada ?? null, im.n_parcelas ?? null, im.reajuste || null,
        im.base_intermediaria ?? null, im.origem_lancamentos || null];
      sIm.getCell(r, 25).value = im.arquivado ? 'SIM' : 'NÃO';
      sIm.getCell(r, 26).value = obs || null;
      sIm.getCell(r, 27).value = im.aba_origem || null;
      sIm.getCell(r, 28).value = im.categoria || null; sIm.getCell(r, 29).value = im.situacao_uso || null;
      sIm.getCell(r, 30).value = im.adm_locacao || null; sIm.getCell(r, 31).value = im.valor_locacao ?? null; sIm.getCell(r, 32).value = d(im.inicio_contrato);
    });
    for (let r = 2; r <= nIm; r++) {
      const A = `$A${r}`;
      sIm.getCell(`R${r}`).value = { formula: `IF(${A}="","",SUMIFS(PARCELAS!$K:$K,PARCELAS!$B:$B,${A}))` };
      sIm.getCell(`S${r}`).value = { formula: `IF(${A}="","",SUMIFS(PARCELAS!$H:$H,PARCELAS!$B:$B,${A},PARCELAS!$L:$L,"<>PAGA"))` };
      sIm.getCell(`T${r}`).value = { formula: `IF(${A}="","",COUNTIFS(PARCELAS!$B:$B,${A},PARCELAS!$L:$L,"PAGA"))` };
      sIm.getCell(`U${r}`).value = { formula: `IF(${A}="","",COUNTIFS(PARCELAS!$B:$B,${A},PARCELAS!$L:$L,"<>PAGA"))` };
      sIm.getCell(`V${r}`).value = { formula: `IF(${A}="","",IF(T${r}+U${r}=0,"",T${r}/(T${r}+U${r})))` };
      sIm.getCell(`W${r}`).value = { formula: `IF(${A}="","",IF(U${r}=0,"",IF(_xlfn.MINIFS(PARCELAS!$G:$G,PARCELAS!$B:$B,${A},PARCELAS!$L:$L,"<>PAGA")=0,"sem data",_xlfn.MINIFS(PARCELAS!$G:$G,PARCELAS!$B:$B,${A},PARCELAS!$L:$L,"<>PAGA"))))` };
      sIm.getCell(`X${r}`).value = { formula: `IF(${A}="","",IF(U${r}=0,"QUITADO","EM PAGAMENTO"))` };
    }
    fmtCols(sIm, hIm, 2, nIm);
    list(sIm, `C2:C${nIm}`, LR('G'));
    list(sIm, `J2:J${nIm}`, LR('F'));
    list(sIm, `Y2:Y${nIm}`, LR('H'));
    list(sIm, `AB2:AB${nIm}`, LR('L')); list(sIm, `AC2:AC${nIm}`, LR('M'));
    numVal(sIm, `AE2:AE${nIm}`); dateVal(sIm, `AF2:AF${nIm}`);
    cfExpr(sIm, `AC2:AC${nIm}`, 'AC2="OPERANDO CURTA TEMPORADA"', st.pos);
    cfExpr(sIm, `AC2:AC${nIm}`, 'AC2="EM MONTAGEM"', st.warn);
    cfExpr(sIm, `AE2:AF${nIm}`, 'AND($AC2="LOCAÇÃO MENSAL",AE2="")', st.warn);
    dateVal(sIm, `I2:I${nIm}`); dateVal(sIm, `K2:K${nIm}`);
    numVal(sIm, `L2:M${nIm}`); numVal(sIm, `P2:P${nIm}`);
    cfExpr(sIm, `X2:X${nIm}`, 'X2="QUITADO"', st.pos);
    cfExpr(sIm, `X2:X${nIm}`, 'X2="EM PAGAMENTO"', st.warn);
    cfExpr(sIm, `K2:K${nIm}`, 'AND(J2<>"ENTREGUE",K2<>"",K2<TODAY())', st.neg);
    cfExpr(sIm, `A2:A${nIm}`, 'AND(B2="",COUNTA(C2:Q2)>0)', st.neg);
    cfExpr(sIm, `B2:B${nIm}`, 'AND(A2<>"",B2="")', st.neg);
    sIm.addConditionalFormatting({ ref: `V2:V${nIm}`, rules: [{ type: 'dataBar', minLength: 0, maxLength: 100, cfvo: [{ type: 'num', value: 0 }, { type: 'num', value: 1 }], color: { argb: 'FF7FB0BF' } }] });

    // ------------------------------------------------------------ PARCELAS
    const hPar = [
      { t: 'ID', w: 10 }, { t: 'Imóvel (ID)', w: 10, note: 'Escolha o ID do imóvel; o nome aparece ao lado.' },
      { t: 'Imóvel', w: 30, calc: 1 }, { t: 'Ano', w: 7, align: 'center' }, { t: 'Mês de referência', w: 13 },
      { t: 'Tipo', w: 13 }, { t: 'Vencimento', w: 12, fmt: DATE }, { t: 'Valor da parcela', w: 14, fmt: BRL },
      { t: 'Encargos', w: 10, fmt: BRL }, { t: 'Desconto', w: 10, fmt: BRL }, { t: 'Valor pago', w: 14, fmt: BRL },
      { t: 'Status', w: 14, calc: 1, align: 'center' }, { t: 'Dias para vencer', w: 9, calc: 1, align: 'center' },
      { t: 'Data do pagamento', w: 12, fmt: DATE }, { t: 'Vencimento (texto original)', w: 13 },
      { t: 'Linha original', w: 22 }, { t: 'Observações', w: 30, wrap: true },
    ];
    headerRow(sPar, hPar, { xSplit: 3 });
    const parcelas = [];
    imoveis.forEach(im => (im.parcelas || []).filter(p => !p.excluido).forEach(p => parcelas.push({ im, p })));
    const nPar = Math.max(parcelas.length + 300, 600);
    parcelas.forEach(({ im, p }, k) => {
      const r = k + 2;
      const row = sPar.getRow(r);
      row.getCell(1).value = p.id; row.getCell(2).value = im.id;
      row.getCell(4).value = p.ano ?? null; row.getCell(5).value = p.mes_ref || null; row.getCell(6).value = p.tipo || null;
      row.getCell(7).value = d(p.vencimento); row.getCell(8).value = p.valor_parcela ?? null;
      row.getCell(9).value = p.encargos ?? null; row.getCell(10).value = p.desconto ?? null;
      row.getCell(11).value = p.valor_pago ?? null; row.getCell(14).value = d(p.data_pagamento);
      row.getCell(15).value = p.vencimento_texto || null; row.getCell(16).value = p.linha_origem || null;
      const obs = [p.observacoes, p.formulas && Object.keys(p.formulas).length ? 'Fórmula original: ' + Object.entries(p.formulas).map(([k, v]) => `${k} ${v}`).join('; ') : null].filter(Boolean).join(' | ');
      row.getCell(17).value = obs || null;
    });
    for (let r = 2; r <= nPar; r++) {
      sPar.getCell(`C${r}`).value = { formula: `IF($B${r}="","",IFERROR(INDEX('IMÓVEIS'!$B:$B,MATCH($B${r},'IMÓVEIS'!$A:$A,0)),"ID não cadastrado"))` };
      sPar.getCell(`L${r}`).value = { formula: `IF($A${r}="","",IF($K${r}<>"","PAGA",IF($G${r}="","EM ABERTO",IF($G${r}<TODAY(),"VENCIDA","A VENCER"))))` };
      sPar.getCell(`M${r}`).value = { formula: `IF(OR($L${r}="PAGA",$L${r}="",$G${r}=""),"",$G${r}-TODAY())` };
    }
    fmtCols(sPar, hPar, 2, nPar);
    list(sPar, `B2:B${nPar}`, `'IMÓVEIS'!$A$2:$A$${nIm}`, { msg: 'Escolha um ID existente na aba IMÓVEIS.' });
    list(sPar, `F2:F${nPar}`, LR('C'), { soft: true });
    dateVal(sPar, `G2:G${nPar}`); dateVal(sPar, `N2:N${nPar}`); numVal(sPar, `H2:K${nPar}`);
    cfExpr(sPar, `L2:L${nPar}`, 'L2="PAGA"', st.pos);
    cfExpr(sPar, `L2:L${nPar}`, 'L2="VENCIDA"', st.neg);
    cfExpr(sPar, `L2:L${nPar}`, 'OR(L2="A VENCER",L2="EM ABERTO")', st.warn);
    cfExpr(sPar, `C2:C${nPar}`, 'C2="ID não cadastrado"', st.neg);
    cfExpr(sPar, `N2:N${nPar}`, 'AND(K2<>"",N2="")', st.warn);

    // ------------------------------------------------------------ LANÇAMENTOS
    const hLan = [
      { t: 'ID', w: 10 }, { t: 'Ano', w: 7, align: 'center' }, { t: 'Mês (1-12)', w: 7, align: 'center' },
      { t: 'Competência', w: 11, fmt: 'mmm/yyyy', calc: 1 }, { t: 'Tipo', w: 13 }, { t: 'Origem', w: 17 },
      { t: 'Descrição', w: 30, wrap: true }, { t: 'Valor', w: 14, fmt: BRL }, { t: 'Status', w: 11 },
      { t: 'Data', w: 11, fmt: DATE }, { t: 'Imóvel(is) vinculado(s)', w: 26, calc: 1, wrap: true },
      { t: 'Linha original', w: 22 }, { t: 'Observações', w: 30, wrap: true },
    ];
    headerRow(sLan, hLan, { xSplit: 1 });
    const lancs = data.lancamentos.filter(l => !l.excluido).slice().sort((a, b) => a.ano - b.ano || a.mes - b.mes || a.id.localeCompare(b.id));
    const nLan = Math.max(lancs.length + 500, 1000);
    lancs.forEach((l, k) => {
      const row = sLan.getRow(k + 2);
      row.getCell(1).value = l.id; row.getCell(2).value = l.ano; row.getCell(3).value = l.mes;
      row.getCell(5).value = l.tipo; row.getCell(6).value = l.origem; row.getCell(7).value = l.descricao || null;
      row.getCell(8).value = l.valor; row.getCell(9).value = l.status || 'REALIZADO'; row.getCell(10).value = d(l.data);
      row.getCell(12).value = l.linha_origem || null;
      row.getCell(13).value = [l.observacoes, l.obs_importacao].filter(Boolean).join(' | ') || null;
    });
    for (let r = 2; r <= nLan; r++) {
      sLan.getCell(`D${r}`).value = { formula: `IF(OR($B${r}="",$C${r}=""),"",DATE($B${r},$C${r},1))` };
      sLan.getCell(`K${r}`).value = { formula: `IF($F${r}="","",IFERROR(INDEX(ORIGENS!$D:$D,MATCH($F${r},ORIGENS!$B:$B,0)),"origem não cadastrada"))` };
    }
    fmtCols(sLan, hLan, 2, nLan);
    list(sLan, `E2:E${nLan}`, LR('A'));
    list(sLan, `I2:I${nLan}`, LR('B'));
    list(sLan, `F2:F${nLan}`, `ORIGENS!$B$2:$B$200`, { msg: 'Escolha uma origem cadastrada na aba ORIGENS (ou cadastre-a lá primeiro).' });
    sLan.dataValidations.add(`C2:C${nLan}`, { type: 'whole', operator: 'between', allowBlank: true, formulae: [1, 12], showErrorMessage: true, error: 'Mês deve ser de 1 a 12.' });
    sLan.dataValidations.add(`B2:B${nLan}`, { type: 'whole', operator: 'between', allowBlank: true, formulae: [2000, 2100], showErrorMessage: true, error: 'Ano inválido.' });
    numVal(sLan, `H2:H${nLan}`); dateVal(sLan, `J2:J${nLan}`);
    cfExpr(sLan, `E2:E${nLan}`, 'E2="RECEITA"', { font: { color: { argb: C.pos }, bold: true } });
    cfExpr(sLan, `E2:E${nLan}`, 'E2="DESPESA"', { font: { color: { argb: C.neg }, bold: true } });
    cfExpr(sLan, `E2:E${nLan}`, 'E2="INVESTIMENTO"', { font: { color: { argb: C.petrol }, bold: true } });
    cfExpr(sLan, `I2:I${nLan}`, 'I2="PREVISTO"', st.warn);
    cfExpr(sLan, `K2:K${nLan}`, 'K2="origem não cadastrada"', st.neg);
    cfExpr(sLan, `H2:H${nLan}`, 'AND(A2<>"",H2="")', st.neg);

    // helpers de soma
    const SUM = (tipo, anoRef, mesRef, origemRef) =>
      `SUMIFS(LANÇAMENTOS!$H:$H,LANÇAMENTOS!$B:$B,${anoRef}${mesRef ? `,LANÇAMENTOS!$C:$C,${mesRef}` : ''},LANÇAMENTOS!$E:$E,"${tipo}",LANÇAMENTOS!$I:$I,"REALIZADO"${origemRef ? `,LANÇAMENTOS!$F:$F,${origemRef}` : ''})`;

    // ------------------------------------------------------------ BALANÇO
    title(sBal, 'Balanço VRPM', 'Calculado a partir da aba LANÇAMENTOS (somente status REALIZADO). Troque o ano na célula C3.', 8);
    sBal.getCell('B3').value = 'Ano'; sBal.getCell('B3').font = font({ bold: true });
    sBal.getCell('C3').value = anoAtual; sBal.getCell('C3').font = font({ bold: true, size: 12, color: { argb: C.petrol } });
    sBal.getCell('C3').fill = fill(C.petrolSoft); sBal.getCell('C3').border = { top: thin, bottom: thin, left: thin, right: thin };
    list(sBal, 'C3', LR('J'));
    const balHead = ['Mês', 'Receitas', 'Despesas', 'Investimentos', 'Resultado (R − D)', 'Saldo (R − D − I)', 'Saldo acumulado'];
    balHead.forEach((t, i) => { const c = sBal.getCell(5, i + 1); c.value = t; c.font = font({ bold: true, color: { argb: C.white } }); c.fill = fill(C.petrol); c.alignment = { horizontal: 'center', wrapText: true }; });
    sBal.getRow(5).height = 28;
    [14, 15, 15, 15, 16, 16, 16, 12].forEach((w, i) => sBal.getColumn(i + 1).width = w);
    for (let m = 1; m <= 12; m++) {
      const r = 5 + m;
      sBal.getCell(`A${r}`).value = MESES[m - 1];
      sBal.getCell(`B${r}`).value = { formula: SUM('RECEITA', '$C$3', m) };
      sBal.getCell(`C${r}`).value = { formula: SUM('DESPESA', '$C$3', m) };
      sBal.getCell(`D${r}`).value = { formula: SUM('INVESTIMENTO', '$C$3', m) };
      sBal.getCell(`E${r}`).value = { formula: `B${r}-C${r}` };
      sBal.getCell(`F${r}`).value = { formula: `B${r}-C${r}-D${r}` };
      sBal.getCell(`G${r}`).value = { formula: m === 1 ? `F${r}` : `G${r - 1}+F${r}` };
      for (let c = 2; c <= 7; c++) { sBal.getCell(r, c).numFmt = BRL; if (m % 2 === 0) sBal.getCell(r, c).fill = fill(C.zebra); }
      sBal.getCell(`A${r}`).font = font({ bold: true });
    }
    sBal.getCell('A18').value = 'TOTAL DO ANO';
    ['B', 'C', 'D', 'E', 'F'].forEach(c => { sBal.getCell(`${c}18`).value = { formula: `SUM(${c}6:${c}17)` }; });
    sBal.getCell('G18').value = { formula: 'G17' };
    sBal.getCell('A19').value = 'MÉDIA (meses com movimento)';
    sBal.getCell('F19').value = { formula: 'IFERROR(AVERAGEIF(F6:F17,"<>0"),0)' };
    for (const r of [18, 19]) for (let c = 1; c <= 7; c++) { const cell = sBal.getCell(r, c); cell.font = font({ bold: true }); cell.fill = fill(C.petrolSoft); if (c > 1) cell.numFmt = BRL; }
    cfExpr(sBal, 'E6:G18', 'E6<0', { font: { color: { argb: C.neg } } });
    cfExpr(sBal, 'E6:G18', 'E6>0', { font: { color: { argb: C.pos } } });

    // por origem
    const r0 = 22;
    sBal.getCell(`A${r0 - 1}`).value = 'POR ORIGEM NO ANO'; sBal.getCell(`A${r0 - 1}`).font = font({ bold: true, size: 12, color: { argb: C.petrol } });
    ['Origem', 'Receitas', 'Despesas', 'Investimentos', 'Resultado (R − D)', 'Saldo (R − D − I)', 'Natureza'].forEach((t, i) => { const c = sBal.getCell(r0, i + 1); c.value = t; c.font = font({ bold: true, color: { argb: C.white } }); c.fill = fill(C.petrol); c.alignment = { horizontal: 'center', wrapText: true }; });
    const NORI = 40;
    for (let k = 1; k <= NORI; k++) {
      const r = r0 + k;
      sBal.getCell(`A${r}`).value = { formula: `IFERROR(IF(INDEX(ORIGENS!$B:$B,${k + 1})="","",INDEX(ORIGENS!$B:$B,${k + 1})),"")` };
      sBal.getCell(`B${r}`).value = { formula: `IF($A${r}="","",${SUM('RECEITA', '$C$3', null, `$A${r}`)})` };
      sBal.getCell(`C${r}`).value = { formula: `IF($A${r}="","",${SUM('DESPESA', '$C$3', null, `$A${r}`)})` };
      sBal.getCell(`D${r}`).value = { formula: `IF($A${r}="","",${SUM('INVESTIMENTO', '$C$3', null, `$A${r}`)})` };
      sBal.getCell(`E${r}`).value = { formula: `IF($A${r}="","",B${r}-C${r})` };
      sBal.getCell(`F${r}`).value = { formula: `IF($A${r}="","",B${r}-C${r}-D${r})` };
      sBal.getCell(`G${r}`).value = { formula: `IF($A${r}="","",IFERROR(INDEX(ORIGENS!$C:$C,${k + 1}),""))` };
      for (let c = 2; c <= 6; c++) sBal.getCell(r, c).numFmt = BRL;
    }
    const rT = r0 + NORI + 1;
    sBal.getCell(`A${rT}`).value = 'TOTAL';
    ['B', 'C', 'D', 'E', 'F'].forEach(c => { sBal.getCell(`${c}${rT}`).value = { formula: `SUM(${c}${r0 + 1}:${c}${rT - 1})` }; sBal.getCell(`${c}${rT}`).numFmt = BRL; });
    for (let c = 1; c <= 7; c++) { sBal.getCell(rT, c).font = font({ bold: true }); sBal.getCell(rT, c).fill = fill(C.petrolSoft); }
    sBal.getCell(`A${rT + 1}`).value = 'Conferência: total por origem = total do ano';
    sBal.getCell(`F${rT + 1}`).value = { formula: `IF(ROUND(F${rT}-F18,2)=0,"OK","DIVERGENTE: verifique lançamentos sem origem cadastrada")` };
    cfExpr(sBal, `F${rT + 1}`, `F${rT + 1}="OK"`, st.pos);
    cfExpr(sBal, `F${rT + 1}`, `F${rT + 1}<>"OK"`, st.neg);
    sBal.views = [{ state: 'frozen', ySplit: 5, showGridLines: false }];

    // ------------------------------------------------------------ RECEBÍVEIS
    title(sRec, 'Recebíveis por origem', 'Receita líquida mensal por origem (Receitas − Despesas; investimentos ficam de fora), mais os valores informados manualmente. Substitui a aba CONTROLE DE RECEBÍVEIS.', 15);
    sRec.getCell('B3').value = 'Ano'; sRec.getCell('B3').font = font({ bold: true });
    sRec.getCell('C3').value = anoAtual; sRec.getCell('C3').font = font({ bold: true, size: 12, color: { argb: C.petrol } }); sRec.getCell('C3').fill = fill(C.petrolSoft);
    list(sRec, 'C3', LR('J'));
    const recHead = ['Origem / item', ...MES3, 'Média', 'Total'];
    recHead.forEach((t, i) => { const c = sRec.getCell(5, i + 1); c.value = t; c.font = font({ bold: true, color: { argb: C.white } }); c.fill = fill(C.petrol); c.alignment = { horizontal: 'center' }; });
    sRec.getColumn(1).width = 30; for (let i = 2; i <= 15; i++) sRec.getColumn(i).width = 12;
    sRec.getCell('A6').value = 'A partir dos LANÇAMENTOS (origens com receita)'; sRec.getCell('A6').font = font({ italic: true, color: { argb: C.mute } });
    const origRec = data.origens.filter(o => !o.arquivado && data.lancamentos.some(l => l.origem === o.nome && l.tipo === 'RECEITA'));
    const recOrigNames = [...origRec.map(o => o.nome)];
    while (recOrigNames.length < 8) recOrigNames.push(null);
    let rr = 7;
    const recFirst = rr;
    recOrigNames.forEach(name => {
      sRec.getCell(`A${rr}`).value = name;
      for (let m = 1; m <= 12; m++) {
        const c = sRec.getCell(rr, m + 1);
        const o = `$A${rr}`;
        c.value = { formula: `IF(${o}="","",${SUM('RECEITA', '$C$3', m, o)}-${SUM('DESPESA', '$C$3', m, o)})` };
        c.numFmt = BRL;
      }
      sRec.getCell(rr, 14).value = { formula: `IF($A${rr}="","",IFERROR(AVERAGEIF(B${rr}:M${rr},"<>0"),0))` };
      sRec.getCell(rr, 15).value = { formula: `IF($A${rr}="","",SUM(B${rr}:M${rr}))` };
      sRec.getCell(rr, 14).numFmt = BRL; sRec.getCell(rr, 15).numFmt = BRL;
      rr++;
    });
    rr++;
    sRec.getCell(`A${rr}`).value = 'Informados manualmente (aba RECEBÍVEIS MANUAIS)'; sRec.getCell(`A${rr}`).font = font({ italic: true, color: { argb: C.mute } });
    rr++;
    const manItems = Array.from(new Set(data.recebiveis.filter(r => !r.excluido && r.conta_deposito !== 'PESSOAL').map(r => r.item)));
    const foraItems = Array.from(new Set(data.recebiveis.filter(r => !r.excluido && r.conta_deposito === 'PESSOAL').map(r => r.item)));
    const manList = [...manItems]; for (let i = 0; i < 6; i++) manList.push(null);
    const manFirst = rr;
    manList.forEach(name => {
      sRec.getCell(`A${rr}`).value = name;
      for (let m = 1; m <= 12; m++) {
        const c = sRec.getCell(rr, m + 1);
        c.value = { formula: `IF($A${rr}="","",SUMIFS('RECEBÍVEIS MANUAIS'!$E:$E,'RECEBÍVEIS MANUAIS'!$B:$B,$C$3,'RECEBÍVEIS MANUAIS'!$C:$C,${m},'RECEBÍVEIS MANUAIS'!$D:$D,$A${rr},'RECEBÍVEIS MANUAIS'!$G:$G,"<>PESSOAL"))` };
        c.numFmt = BRL;
      }
      sRec.getCell(rr, 14).value = { formula: `IF($A${rr}="","",IFERROR(AVERAGEIF(B${rr}:M${rr},"<>0"),0))` };
      sRec.getCell(rr, 15).value = { formula: `IF($A${rr}="","",SUM(B${rr}:M${rr}))` };
      sRec.getCell(rr, 14).numFmt = BRL; sRec.getCell(rr, 15).numFmt = BRL;
      rr++;
    });
    const manLast = rr - 1;
    rr++;
    sRec.getCell(`A${rr}`).value = 'TOTAL DO MÊS';
    for (let m = 1; m <= 14; m++) {
      const cl = col(m + 1);
      sRec.getCell(rr, m + 1).value = { formula: m === 13 ? `IFERROR(AVERAGEIF(B${rr}:M${rr},"<>0"),0)` : `SUM(${cl}${recFirst}:${cl}${manLast})` };
      sRec.getCell(rr, m + 1).numFmt = BRL;
    }
    sRec.getCell(rr, 15).value = { formula: `SUM(B${rr}:M${rr})` };
    for (let c = 1; c <= 15; c++) { sRec.getCell(rr, c).font = font({ bold: true }); sRec.getCell(rr, c).fill = fill(C.petrolSoft); }
    const totRow = rr;
    if (foraItems.length) {
      rr += 2;
      sRec.getCell(`A${rr}`).value = 'Depositados em conta pessoal — fora do total da VRPM (contam só no painel de locação)'; sRec.getCell(`A${rr}`).font = font({ italic: true, color: { argb: C.mute } });
      rr++;
      foraItems.forEach(name => {
        sRec.getCell(`A${rr}`).value = name; sRec.getCell(`A${rr}`).font = font({ color: { argb: C.mute } });
        for (let m = 1; m <= 12; m++) { const c = sRec.getCell(rr, m + 1); c.value = { formula: `SUMIFS('RECEBÍVEIS MANUAIS'!$E:$E,'RECEBÍVEIS MANUAIS'!$B:$B,$C$3,'RECEBÍVEIS MANUAIS'!$C:$C,${m},'RECEBÍVEIS MANUAIS'!$D:$D,$A${rr},'RECEBÍVEIS MANUAIS'!$G:$G,"PESSOAL")` }; c.numFmt = BRL; c.font = font({ color: { argb: C.mute } }); }
        sRec.getCell(rr, 15).value = { formula: `SUM(B${rr}:M${rr})` }; sRec.getCell(rr, 15).numFmt = BRL;
        rr++;
      });
    }
    cfExpr(sRec, `B${recFirst}:O${totRow}`, `B${recFirst}<0`, { font: { color: { argb: C.neg } } });
    sRec.views = [{ state: 'frozen', xSplit: 1, ySplit: 5, showGridLines: false }];

    // ------------------------------------------------------------ CONTAS FIXAS
    const hCon = [
      { t: 'ID', w: 8 }, { t: 'Grupo', w: 18 }, { t: 'Conta', w: 30, wrap: true }, { t: 'Proprietário', w: 11 },
      { t: 'Solicitar em', w: 12 }, { t: 'Link', w: 22 }, { t: 'Observação', w: 22, wrap: true }, { t: 'Periodicidade', w: 12 },
      { t: 'Valor', w: 12, fmt: BRL }, { t: 'Meio de pagamento', w: 12 }, { t: 'Dia do vencimento', w: 9, align: 'center' },
      { t: 'Situação', w: 20 }, { t: 'Vencimento neste mês', w: 12, fmt: DATE, calc: 1 }, { t: 'Alerta', w: 22, calc: 1 },
      { t: 'Arquivado', w: 9 }, { t: 'Linha original', w: 26 },
    ];
    headerRow(sCon, hCon, { xSplit: 3 });
    const contas = data.contas.filter(c => !c.excluido);
    const nCon = Math.max(contas.length + 40, 60);
    contas.forEach((c, k) => {
      sCon.getRow(k + 2).values = [c.id, c.grupo, c.conta, c.proprietario || null, c.solicitar_em || null, c.link || null,
        c.observacao || null, c.periodicidade || null, c.valor ?? null, c.meio_pagamento || null, c.dia_vencimento ?? null,
        c.situacao || null];
      sCon.getCell(k + 2, 15).value = c.arquivado ? 'SIM' : 'NÃO';
      sCon.getCell(k + 2, 16).value = c.linha_origem || null;
    });
    for (let r = 2; r <= nCon; r++) {
      sCon.getCell(`M${r}`).value = { formula: `IF(OR($A${r}="",$K${r}=""),"",DATE(YEAR(TODAY()),MONTH(TODAY()),$K${r}))` };
      sCon.getCell(`N${r}`).value = { formula: `IF($A${r}="","",IF($L${r}<>"AGUARDANDO PAGAMENTO",IF($I${r}="","SEM VALOR",""),IF($M${r}="","SEM DIA DE VENCIMENTO",IF($M${r}<TODAY(),"ATRASADA",IF($M${r}-TODAY()<=5,"VENCE EM "&($M${r}-TODAY())&" DIA(S)","")))))` };
    }
    fmtCols(sCon, hCon, 2, nCon);
    list(sCon, `L2:L${nCon}`, LR('D'));
    list(sCon, `H2:H${nCon}`, LR('E'));
    list(sCon, `O2:O${nCon}`, LR('H'));
    sCon.dataValidations.add(`K2:K${nCon}`, { type: 'whole', operator: 'between', allowBlank: true, formulae: [1, 31], showErrorMessage: true, error: 'Dia de 1 a 31.' });
    numVal(sCon, `I2:I${nCon}`);
    cfExpr(sCon, `L2:L${nCon}`, 'OR(L2="PAGO",L2="QUITADO")', st.pos);
    cfExpr(sCon, `L2:L${nCon}`, 'L2="AGUARDANDO PAGAMENTO"', st.warn);
    cfExpr(sCon, `L2:L${nCon}`, 'L2="PAGAMENTO CONDICIONADO"', { font: { color: { argb: C.petrol }, bold: true }, fill: fill(C.petrolSoft) });
    cfExpr(sCon, `L2:L${nCon}`, 'L2="LOCADO"', st.mute);
    cfExpr(sCon, `N2:N${nCon}`, 'N2="ATRASADA"', st.neg);
    cfExpr(sCon, `N2:N${nCon}`, 'AND(N2<>"",N2<>"ATRASADA")', st.warn);

    // ------------------------------------------------------------ RECEBÍVEIS MANUAIS
    const hRm = [{ t: 'ID', w: 9 }, { t: 'Ano', w: 7 }, { t: 'Mês (1-12)', w: 8 }, { t: 'Item', w: 30 }, { t: 'Valor', w: 13, fmt: BRL }, { t: 'Fonte', w: 46, wrap: true }, { t: 'Conta do depósito (VRPM / PESSOAL)', w: 16 }];
    headerRow(sRm, hRm);
    const recs = data.recebiveis.filter(r => !r.excluido);
    recs.forEach((r, k) => { sRm.getRow(k + 2).values = [r.id, r.ano, r.mes, r.item, r.valor, [r.fonte, r.linha_origem].filter(Boolean).join(' — '), r.conta_deposito || 'VRPM']; });
    const nRm = recs.length + 200;
    fmtCols(sRm, hRm, 2, nRm);
    numVal(sRm, `E2:E${nRm}`);
    sRm.dataValidations.add(`G2:G${nRm}`, { type: 'list', allowBlank: true, formulae: ['"VRPM,PESSOAL"'], showErrorMessage: true, error: 'Use VRPM ou PESSOAL. PESSOAL fica fora do total da VRPM.' });
    sRm.dataValidations.add(`C2:C${nRm}`, { type: 'whole', operator: 'between', allowBlank: true, formulae: [1, 12], showErrorMessage: true, error: 'Mês de 1 a 12.' });

    // ------------------------------------------------------------ ÍNDICES
    const hInd = [{ t: 'Ano', w: 8 }, { t: 'Mês do índice', w: 14 }, { t: 'INCC-DI (%)', w: 12, fmt: '0.00%' }, { t: 'Atualiza a parcela de', w: 18 }];
    headerRow(sInd, hInd);
    (data.indices || []).forEach((x, k) => { sInd.getRow(k + 2).values = [x.ano, x.mes, x.percentual ?? null, x.atualiza_parcela_de || null]; });
    fmtCols(sInd, hInd, 2, (data.indices || []).length + 60);
    list(sInd, `B2:B${(data.indices || []).length + 60}`, LR('K'));
    sInd.getCell('F1').value = 'Regra (do original): o INCC-DI de um mês reajusta a parcela de dois meses depois. Ex.: INCC de janeiro → parcela de março = parcela de fevereiro × (1 + INCC jan).';
    sInd.getCell('F1').font = font({ italic: true, color: { argb: C.mute } }); sInd.getColumn(6).width = 60; sInd.getCell('F1').alignment = { wrapText: true };

    // ------------------------------------------------------------ ORIGENS
    const hOri = [{ t: 'ID', w: 9 }, { t: 'Nome (como aparece nos lançamentos)', w: 26 }, { t: 'Natureza', w: 26 }, { t: 'Imóveis vinculados', w: 60, wrap: true }, { t: 'Arquivado', w: 10 }];
    headerRow(sOri, hOri);
    data.origens.forEach((o, k) => {
      sOri.getRow(k + 2).values = [o.id, o.nome, o.natureza || null, (o.imoveis || []).map(id => nomeIm[id] || id).join('; ') || null, o.arquivado ? 'SIM' : 'NÃO'];
    });
    fmtCols(sOri, hOri, 2, data.origens.length + 40);
    list(sOri, `E2:E${data.origens.length + 40}`, LR('H'));
    cfExpr(sOri, `C2:C${data.origens.length + 40}`, 'C2="A definir"', st.warn);

    // ------------------------------------------------------------ PENDÊNCIAS
    const hPen = [{ t: 'ID', w: 9 }, { t: 'Tipo', w: 13 }, { t: 'O que conferir', w: 44, wrap: true }, { t: 'Detalhe', w: 70, wrap: true }, { t: 'Onde (planilha original)', w: 28, wrap: true }, { t: 'Status', w: 11 }, { t: 'Resolução', w: 40, wrap: true }];
    headerRow(sPen, hPen);
    (data.pendencias || []).forEach((p, k) => { sPen.getRow(k + 2).values = [p.id, p.tipo, p.titulo, p.detalhe, p.ref, p.status, p.resolucao || null]; });
    const nPen = (data.pendencias || []).length + 40;
    fmtCols(sPen, hPen, 2, nPen);
    list(sPen, `F2:F${nPen}`, LR('I'));
    cfExpr(sPen, `F2:F${nPen}`, 'F2="ABERTA"', st.warn);
    cfExpr(sPen, `F2:F${nPen}`, 'F2="RESOLVIDA"', st.pos);
    cfExpr(sPen, `B2:B${nPen}`, 'B2="CORRIGIDO"', st.pos);

    // ------------------------------------------------------------ HISTÓRICO
    const hHist = [{ t: 'Data/hora', w: 18 }, { t: 'Ação', w: 16 }, { t: 'Registro', w: 12 }, { t: 'Resumo', w: 80, wrap: true }];
    headerRow(sHist, hHist);
    (data.historico || []).slice().sort((a, b) => (b.ts || '').localeCompare(a.ts || '')).forEach((h, k) => {
      sHist.getRow(k + 2).values = [(h.ts || '').replace('T', ' ').slice(0, 19), h.acao, h.ref || null, h.resumo || null];
    });
    fmtCols(sHist, hHist, 2, (data.historico || []).length + 1);

    // ------------------------------------------------------------ CONFERÊNCIA
    title(sConf, 'Conferência da migração', opts.confStatic ? 'Resultado registrado na importação da planilha original (antes × depois). Lançamentos feitos depois disso não alteram esta aba.' : 'Dados antes da transformação × depois. Valores "Depois" são calculados ao vivo a partir das abas novas.', 5);
    const cf = data.conferencia || {};
    const orig = cf.original || {};
    ['Item', 'Antes (planilha original)', 'Depois (planilha nova)', 'Situação', 'Observação'].forEach((t, i) => { const c = sConf.getCell(4, i + 1); c.value = t; c.font = font({ bold: true, color: { argb: C.white } }); c.fill = fill(C.petrol); });
    [40, 24, 24, 14, 60].forEach((w, i) => sConf.getColumn(i + 1).width = w);
    const confRows = orig.itens || [];
    confRows.forEach((it, k) => {
      const r = 5 + k;

      sConf.getCell(`B${r}`).value = it.antes;

      if (it.fmt) { sConf.getCell(`B${r}`).numFmt = it.fmt; sConf.getCell(`C${r}`).numFmt = it.fmt; }
      sConf.getCell(`D${r}`).value = live ? { formula: `IF(ROUND(C${r}-B${r},2)=0,"OK","DIFERENÇA")` } : (opts.confStatic ? (it.ok_import ? 'OK' : 'CORRIGIDO') : (it.ok ? 'OK' : 'VER OBS.'));
      sConf.getCell(`E${r}`).value = it.obs || null;

    const lastConf = 4 + confRows.length;

    // ------------------------------------------------------------ PAINEL
    title(sPainel, 'Controle VRPM — Painel', `Atualiza sozinho a partir das abas de dados. Gerado em ${today.split('-').reverse().join('/')}.`, 9);
    [30, 18, 4, 30, 18, 4, 16, 16, 16].forEach((w, i) => sPainel.getColumn(i + 1).width = w);
    sPainel.getCell('A3').value = 'Ano de referência'; sPainel.getCell('A3').font = font({ bold: true });
    sPainel.getCell('B3').value = anoAtual; list(sPainel, 'B3', LR('J'));
    sPainel.getCell('B3').font = font({ bold: true, size: 12, color: { argb: C.petrol } }); sPainel.getCell('B3').fill = fill(C.petrolSoft);
    const kpi = (cell, label, formula, fmt, big) => {
      const [c, r] = [cell.replace(/\d+/, ''), Number(cell.replace(/\D+/, ''))];

    kpi('A9', 'Resultado (R − D)', 'B6-B7', BRL, true);
    kpi('A10', 'Saldo (R − D − I)', 'B6-B7-B8', BRL, true);
    kpi('A11', 'Recebíveis manuais (conta da VRPM)', `SUMIFS('RECEBÍVEIS MANUAIS'!$E:$E,'RECEBÍVEIS MANUAIS'!$B:$B,${Y},'RECEBÍVEIS MANUAIS'!$G:$G,"<>PESSOAL")`, BRL);

    kpi('G6', 'Curta temporada', nu('OPERANDO CURTA TEMPORADA'));
    kpi('G7', 'Locação mensal', nu('LOCAÇÃO MENSAL'));
    kpi('G8', 'Em montagem', nu('EM MONTAGEM'));
    kpi('G9', 'Aguardando entrega', nu('AGUARDANDO ENTREGA'));
    kpi('G10', 'Aluguel mensal contratado', `SUMIFS('IMÓVEIS'!$AE:$AE,'IMÓVEIS'!$AC:$AC,"LOCAÇÃO MENSAL",'IMÓVEIS'!$Y:$Y,"<>SIM")`, BRL);
    kpi('G12', 'Condo-hotel', nu('OPERANDO CONDO-HOTEL'));
    kpi('G11', 'Sem classificação', `COUNTIFS('IMÓVEIS'!$A:$A,"IMV-*",'IMÓVEIS'!$AC:$AC,"",'IMÓVEIS'!$Y:$Y,"<>SIM")`);
    sPainel.getColumn(7).width = 26;
    sPainel.getCell('A13').value = 'ALERTAS'; sPainel.getCell('A13').font = font({ bold: true, color: { argb: C.petrol } });
    const alerts = [
      `IF(COUNTIF(PARCELAS!$L:$L,"VENCIDA")>0,COUNTIF(PARCELAS!$L:$L,"VENCIDA")&" parcela(s) vencida(s) sem pagamento","Nenhuma parcela vencida")`,
      `IF(COUNTIFS(PARCELAS!$L:$L,"A VENCER",PARCELAS!$M:$M,"<=30")>0,COUNTIFS(PARCELAS!$L:$L,"A VENCER",PARCELAS!$M:$M,"<=30")&" parcela(s) vencem nos próximos 30 dias","Nenhuma parcela nos próximos 30 dias")`,
      `IF(COUNTIF('CONTAS FIXAS'!$N:$N,"ATRASADA")>0,COUNTIF('CONTAS FIXAS'!$N:$N,"ATRASADA")&" conta(s) fixa(s) atrasada(s)","Nenhuma conta fixa atrasada")`,
      `IF(COUNTIF('CONTAS FIXAS'!$L:$L,"AGUARDANDO PAGAMENTO")>0,COUNTIF('CONTAS FIXAS'!$L:$L,"AGUARDANDO PAGAMENTO")&" conta(s) aguardando pagamento","Todas as contas fixas pagas")`,
      `IF(COUNTIFS('IMÓVEIS'!$J:$J,"<>ENTREGUE",'IMÓVEIS'!$K:$K,"<"&TODAY(),'IMÓVEIS'!$A:$A,"IMV-*")>0,COUNTIFS('IMÓVEIS'!$J:$J,"<>ENTREGUE",'IMÓVEIS'!$K:$K,"<"&TODAY(),'IMÓVEIS'!$A:$A,"IMV-*")&" imóvel(is) com previsão de entrega já passada: atualize a situação da obra","Previsões de entrega em dia")`,
      `IF(COUNTIF(PENDÊNCIAS!$F:$F,"ABERTA")>0,COUNTIF(PENDÊNCIAS!$F:$F,"ABERTA")&" pendência(s) de dados para conferir (aba PENDÊNCIAS)","Nenhuma pendência de dados")`,
      `IF(COUNTIF(LANÇAMENTOS!$K:$K,"origem não cadastrada")>0,COUNTIF(LANÇAMENTOS!$K:$K,"origem não cadastrada")&" lançamento(s) com origem não cadastrada","Todas as origens cadastradas")`,
    ];
    alerts.forEach((f, i) => {

    cfExpr(sPainel, 'A14:A20', 'OR(ISNUMBER(SEARCH("vencida",A14)),ISNUMBER(SEARCH("atrasada",A14)),ISNUMBER(SEARCH("passada",A14)),ISNUMBER(SEARCH("não cadastrada",A14)))*NOT(ISNUMBER(SEARCH("Nenhuma",A14)))*NOT(ISNUMBER(SEARCH("Todas",A14)))', st.neg);
    cfExpr(sPainel, 'A14:A20', 'OR(ISNUMBER(SEARCH("Nenhuma",A14)),ISNUMBER(SEARCH("Todas",A14)),ISNUMBER(SEARCH("em dia",A14)))', st.pos);
    cfExpr(sPainel, 'A14:A20', 'AND(NOT(ISNUMBER(SEARCH("Nenhuma",A14))),NOT(ISNUMBER(SEARCH("Todas",A14))),NOT(ISNUMBER(SEARCH("em dia",A14))))', st.warn);

    // evolução mensal
    const e0 = 23;

    ['Mês', 'Receitas', '', 'Gráfico do saldo (R − D − I)', 'Saldo', '', 'Despesas', 'Investimentos'].forEach((t, i) => { if (!t) return; const c = sPainel.getCell(e0, i + 1); c.value = t; c.font = font({ bold: true, color: { argb: C.white } }); c.fill = fill(C.petrol); });
    for (let m = 1; m <= 12; m++) {
      const r = e0 + m;
      sPainel.getCell(`A${r}`).value = MESES[m - 1];
      sPainel.getCell(`B${r}`).value = { formula: SUM('RECEITA', Y, m) }; sPainel.getCell(`B${r}`).numFmt = BRL;
      sPainel.getCell(`G${r}`).value = { formula: SUM('DESPESA', Y, m) }; sPainel.getCell(`G${r}`).numFmt = BRL;
      sPainel.getCell(`H${r}`).value = { formula: SUM('INVESTIMENTO', Y, m) }; sPainel.getCell(`H${r}`).numFmt = BRL;
      sPainel.getCell(`E${r}`).value = { formula: `B${r}-G${r}-H${r}` }; sPainel.getCell(`E${r}`).numFmt = BRL;
      sPainel.getCell(`D${r}`).value = { formula: `IF(E${r}=0,"",IF(E${r}>0,"+ ","− ")&REPT("█",MAX(1,ROUND(ABS(E${r})/MAX(1,MAX(ABS(MAX($E$${e0 + 1}:$E$${e0 + 12})),ABS(MIN($E$${e0 + 1}:$E$${e0 + 12}))))*24,0))))` };
      sPainel.getCell(`D${r}`).font = font({ color: { argb: C.petrol } });
    }
    cfExpr(sPainel, `D${e0 + 1}:E${e0 + 12}`, `$E${e0 + 1}<0`, { font: { color: { argb: C.neg } } });
    cfExpr(sPainel, `D${e0 + 1}:E${e0 + 12}`, `$E${e0 + 1}>0`, { font: { color: { argb: C.pos } } });
    sPainel.addConditionalFormatting({ ref: `B${e0 + 1}:B${e0 + 12}`, rules: [{ type: 'dataBar', minLength: 0, maxLength: 100, cfvo: [{ type: 'num', value: 0 }, { type: 'max' }], color: { argb: 'FF8FC4A0' } }] });
    sPainel.addConditionalFormatting({ ref: `G${e0 + 1}:G${e0 + 12}`, rules: [{ type: 'dataBar', minLength: 0, maxLength: 100, cfvo: [{ type: 'num', value: 0 }, { type: 'max' }], color: { argb: 'FFE0A296' } }] });

    // imóveis em pagamento (dinâmico)
    const p0 = e0 + 15;
    sPainel.getCell(`A${p0 - 1}`).value = 'IMÓVEIS EM PAGAMENTO'; sPainel.getCell(`A${p0 - 1}`).font = font({ bold: true, color: { argb: C.petrol } });
    ['Imóvel', 'Saldo em aberto', '', 'Próximo vencimento', 'Parcelas em aberto'].forEach((t, i) => { if (!t) return; const c = sPainel.getCell(p0, i + 1); c.value = t; c.font = font({ bold: true, color: { argb: C.white } }); c.fill = fill(C.petrol); });
    for (let k = 1; k <= 10; k++) {
      const r = p0 + k;
      const rowExpr = `_xlfn.AGGREGATE(15,6,ROW('IMÓVEIS'!$A$2:$A$${nIm})/(('IMÓVEIS'!$X$2:$X$${nIm}="EM PAGAMENTO")*('IMÓVEIS'!$Y$2:$Y$${nIm}<>"SIM")),${k})`;
      sPainel.getCell(`A${r}`).value = { formula: `IFERROR(INDEX('IMÓVEIS'!$B:$B,${rowExpr}),"")` };
      sPainel.getCell(`B${r}`).value = { formula: `IFERROR(INDEX('IMÓVEIS'!$S:$S,${rowExpr}),"")` }; sPainel.getCell(`B${r}`).numFmt = BRL;
      sPainel.getCell(`D${r}`).value = { formula: `IFERROR(INDEX('IMÓVEIS'!$W:$W,${rowExpr}),"")` }; sPainel.getCell(`D${r}`).numFmt = DATE;
      sPainel.getCell(`E${r}`).value = { formula: `IFERROR(INDEX('IMÓVEIS'!$U:$U,${rowExpr}),"")` };
      sPainel.getCell(`D${r}`).alignment = { horizontal: 'left' };
    }
    sPainel.views = [{ showGridLines: false }];

    // ------------------------------------------------------------ EMPRESA
    title(sEmp, 'Dados da VRPM', 'Cadastro da empresa (editado no app em Cadastros › Dados da VRPM).', 2);
    sEmp.getColumn(1).width = 28; sEmp.getColumn(2).width = 70;
    const E = data.empresa || {};
    [['Razão social', 'razao_social'], ['Nome fantasia', 'nome_fantasia'], ['CNPJ', 'cnpj'], ['E-mail', 'email'], ['Telefone', 'telefone'],
     ['Inscrição municipal', 'inscricao_municipal'], ['Endereço', 'endereco'], ['Cidade / UF', 'cidade_uf'], ['CEP', 'cep'],
     ['Responsável', 'responsavel'], ['Escritório de contabilidade', 'contabilidade'], ['Banco / agência / conta', 'banco'], ['Observações', 'observacoes']]
      .forEach(([l, k], i) => { const r = 4 + i; const a1 = sEmp.getCell(r, 1), b1 = sEmp.getCell(r, 2);
        a1.value = l; a1.font = font({ bold: true, color: { argb: C.mute } }); b1.value = E[k] || null; b1.font = font({ size: 11 });
        b1.alignment = { wrapText: true }; [a1, b1].forEach(x => { x.border = { bottom: thin }; }); });
    sEmp.views = [{ showGridLines: false }];

    // ------------------------------------------------------------ COMO USAR
    sMan.getColumn(1).width = 110;
    const man = [
      ['COMO USAR A PLANILHA CONTROLE VRPM', 'h'],
      ['Esta planilha é gerada pelo app Controle VRPM (botão "Exportar planilha"). Ela tem os mesmos dados do app e pode ser usada para consulta, filtros e impressão.', ''],
      ['Se você editar aqui, use o botão "Importar planilha" no app para levar as alterações de volta: ele compara pelo ID e mostra o que mudou antes de gravar.', ''],
      ['', ''],
      ['ONDE DIGITAR', 'h'],
      ['• IMÓVEIS: cadastro de cada imóvel. As colunas cinza (Total pago, Saldo, Status…) são calculadas: não digite nelas.', ''],
      ['• PARCELAS: uma linha por parcela. Escolha o ID do imóvel na coluna B. Ao pagar, preencha "Valor pago" e "Data do pagamento": o status muda para PAGA sozinho.', ''],
      ['• LANÇAMENTOS: receitas, despesas e investimentos da VRPM. Ano + mês (1 a 12) + tipo + origem (lista) + valor. O BALANÇO, os RECEBÍVEIS e o PAINEL se atualizam sozinhos.', ''],
      ['• CONTAS FIXAS: contas que se repetem. Mude a "Situação" na lista; a coluna Alerta avisa atraso e vencimento próximo.', ''],
      ['• ORIGENS: as origens válidas para lançamentos (CONDO-HOTEL, APTO RJ…). Cadastre aqui antes de usar uma origem nova.', ''],
      ['• ÍNDICES INCC: percentuais do INCC-DI usados no reajuste das parcelas (JK 206, JK 310, João Cachoeira).', ''],
      ['', ''],
      ['O QUE É AUTOMÁTICO', 'h'],
      ['• Status das parcelas (PAGA / A VENCER / VENCIDA) e dias para vencer.  • Totais e saldos por imóvel.  • Balanço mensal e por origem.  • Recebíveis por origem.  • Alertas do PAINEL.', ''],
      ['• Cores: verde = ok/pago, amarelo = atenção, vermelho = vencido/erro.  • Validações impedem texto em campos de valor, datas inválidas e tipos fora da lista.', ''],
      ['', ''],
      ['SEGURANÇA', 'h'],
      ['• O app guarda uma cópia de segurança automática por dia (últimas 15) e permite restaurar. Nada é apagado de vez: "Excluir" manda para a Lixeira, de onde dá para restaurar.', ''],
      ['• O arquivo original (Controle_VRPM_ORIGINAL_backup.xlsx) foi mantido intacto. A aba CONFERÊNCIA mostra os totais antes × depois.', ''],
    ];
    man.forEach(([t, k], i) => { const c = sMan.getCell(i + 1, 1); c.value = t; c.alignment = { wrapText: true, vertical: 'top' }; c.font = k === 'h' ? font({ bold: true, size: 12, color: { argb: C.petrol } }) : font({ size: 11 }); });

    if (data.temporada && (data.temporada.meses || []).length) addTemporada(ExcelJS, wb, data.temporada, opts);

    if (data.locacao && (data.locacao.imoveis || []).length) addLocacao(ExcelJS, wb, data.locacao, { ...opts, ano: opts.ano || new Date().getFullYear() });
    return wb;
  }

  /* Curta temporada: valores apurados pelo app (mesma regra das planilhas Rentabilidade). */
  function addTemporada(ExcelJS, wb, T, opts = {}) {
    const Calc = root.STCalc || (typeof require !== 'undefined' ? require('./st_calc.js') : null);
    const nome = Object.fromEntries((T.cfg || []).map(c => [c.id, c.nome]));
    const cfgOf = Object.fromEntries((T.cfg || []).map(c => [c.id, c]));
    const meses = (T.meses || []).filter(m => !m.excluido && cfgOf[m.imovel_id]).sort((a, b) => (nome[a.imovel_id] || '').localeCompare(nome[b.imovel_id] || '') || a.ano - b.ano || a.mes - b.mes);
    const PCT3 = '0.000%';
    const ws = wb.addWorksheet('TEMPORADA', { properties: { tabColor: { argb: C.pos } } });
    const h = [
      { t: 'Imóvel', w: 26 }, { t: 'Ano', w: 7 }, { t: 'Mês', w: 6, align: 'center' }, { t: 'Dias no mês', w: 7 }, { t: 'Dias reservados', w: 9 }, { t: 'Dias bloqueados', w: 9 }, { t: 'Dias vagos', w: 8 },
      { t: 'Taxa de ocupação', w: 10, fmt: PCT }, { t: 'Receita bruta', w: 13, fmt: BRL }, { t: 'Taxas plataforma', w: 12, fmt: BRL }, { t: 'Limpeza', w: 11, fmt: BRL }, { t: 'Pricelabs', w: 10, fmt: BRL }, { t: 'Comissão', w: 11, fmt: BRL },
      { t: 'Reservas (a receber)', w: 13, fmt: BRL }, { t: 'Despesas extraordinárias', w: 13, fmt: BRL }, { t: 'Créditos extras', w: 11, fmt: BRL }, { t: 'Valor a depositar', w: 13, fmt: BRL }, { t: 'Recebido', w: 13, fmt: BRL }, { t: 'Saldo pendente', w: 13, fmt: BRL }, { t: 'Situação do repasse', w: 14 },
      { t: 'Bloqueios (R$)', w: 12, fmt: BRL }, { t: 'Despesas ordinárias', w: 12, fmt: BRL }, { t: 'Rendimento líquido', w: 13, fmt: BRL }, { t: 'Média da diária', w: 11, fmt: BRL },
      { t: 'Valor corrigido', w: 14, fmt: BRL }, { t: '% rentabilidade locação', w: 11, fmt: PCT3 }, { t: 'INCC-DI do mês', w: 9, fmt: '0.00%' }, { t: 'Locação + valorização', w: 11, fmt: PCT3 }, { t: 'CDI do mês', w: 9, fmt: '0.00%' }, { t: 'Comparação com CDI', w: 10, fmt: '0.0%' },
      { t: 'No resumo', w: 8 }, { t: 'Conferência', w: 11 }, { t: 'Pendências', w: 60, wrap: true },
    ];
    headerRow(ws, h, { xSplit: 3 });
    meses.forEach((m, k) => {
      const a = Calc.apurar(m, cfgOf[m.imovel_id], T.indices, T.cdi);
      ws.getRow(k + 2).values = [nome[m.imovel_id], m.ano, m.mes, a.dias, a.resv, a.bloq, a.vagos, a.ocup, a.tot.bruto, a.tot.plataforma, a.tot.limpeza, a.tot.pricelabs, a.tot.comissao,
        a.C, a.D, a.CE, a.E, a.recebido, a.saldo, a.statusRep, a.F, a.G, a.I, a.mediaDiaria, a.vc, a.rent, a.inccM, a.locVal, a.cdiM, a.comp,
        m.incluir_no_resumo === false ? 'NÃO' : 'SIM', m.conferencia || '', a.pend.join(' | ') || null];
    });
    fmtCols(ws, h, 2, meses.length + 1);
    cfExpr(ws, `T2:T${meses.length + 1}`, 'T2="RECEBIDO"', st.pos);
    cfExpr(ws, `T2:T${meses.length + 1}`, 'OR(T2="PENDENTE",T2="PARCIAL")', st.warn);
    cfExpr(ws, `W2:W${meses.length + 1}`, 'W2<0', { font: { color: { argb: C.neg } } });
    const wr = wb.addWorksheet('TEMPORADA RESERVAS');
    const hr = [{ t: 'Imóvel', w: 24 }, { t: 'Competência', w: 10 }, { t: 'Código', w: 9 }, { t: 'Hóspede', w: 24 }, { t: 'Canal', w: 11 }, { t: 'Check-in', w: 11, fmt: DATE }, { t: 'Check-out', w: 11, fmt: DATE }, { t: 'Noites', w: 7 },
      { t: 'Bruto', w: 12, fmt: BRL }, { t: 'Plataforma', w: 11, fmt: BRL }, { t: 'Limpeza', w: 10, fmt: BRL }, { t: 'Pricelabs', w: 10, fmt: BRL }, { t: 'Outras taxas', w: 10, fmt: BRL }, { t: 'Comissão', w: 11, fmt: BRL }, { t: 'A receber', w: 12, fmt: BRL }, { t: 'Origem', w: 10 }, { t: 'Ajustado à mão', w: 9 }];
    headerRow(wr, hr, { xSplit: 2 });
    let k = 2;
    meses.forEach(m => (m.reservas || []).filter(r => !r.excluido).forEach(r => {

const writeQ = {};
function queued(path, fn) { const p = (writeQ[path] || Promise.resolve()).then(fn, fn); writeQ[path] = p.catch(() => {}); return p; }
async function mutateDoc(path, fn, { create } = {}) {
  if (!S.db) throw new Error('offline');
  if (S.db.runTransaction) return queued(path, () => S.db.runTransaction(async (tx) => {
    const ref = S.db.doc(path);
    const snap = await tx.get(ref);
    const cur = snap.exists ? clone(snap.data()) : (create ? clone(create) : null);
    if (!cur) throw new Error('Registro não encontrado: ' + path);
    fn(cur);
    if (snap.exists) { const old = snap.data(); for (const k of ['itens', 'parcelas', 'reservas', 'repasses', 'linhas']) if (Array.isArray(old[k]) && !Array.isArray(cur[k])) throw new Error('Gravação bloqueada: a alteração apagaria a lista "' + k + '" de ' + path); }
    cur.atualizado_em = new Date().toISOString();
    tx.set(ref, cur);
    return cur;
  }));
  return queued(path, async () => {
    const ref = S.db.doc(path);
    const snap = await ref.get();
    const cur = snap.exists ? clone(snap.data()) : (create ? clone(create) : null);
    if (!cur) throw new Error('Registro não encontrado: ' + path);
    fn(cur); // a função altera o documento no lugar; o retorno é ignorado (proteção contra sobrescrever o documento inteiro)
    const out = cur;
    if (snap.exists) { const old = snap.data(); for (const k of ['itens', 'parcelas', 'reservas', 'repasses', 'linhas']) if (Array.isArray(old[k]) && !Array.isArray(out[k])) throw new Error('Gravação bloqueada: a alteração removeria a lista "' + k + '" de ' + path); }

}
function dbErr(e) {
  const code = e?.code || '';
