      <button type="button" ${um ? `data-act="inDet:mes:${ano}:${um}"` : 'disabled'} class="kpi has-ic"><span class="kpi-ic">${icon('calendar')}</span><div class="eyebrow">${um ? 'Resultado de ' + competencia(ano, um) + ' (último mês lançado)' : 'Último mês'}</div><div class="v ${sUm && sUm.saldo < 0 ? 'neg' : ''}">${sUm ? brl(sUm.saldo) : '—'}</div><div class="s">${sUm ? (sUm.INVESTIMENTO ? `Inclui investimentos de ${brlS(sUm.INVESTIMENTO)}` : 'Receitas − despesas, sem investimentos') : 'Sem lançamentos no ano'}</div>${um ? '<div class="s kpi-more">Ver lançamentos do mês ›</div>' : ''}</button>
      <button type="button" data-act="inDet:saldo" class="kpi has-ic"><span class="kpi-ic">${icon('coin')}</span><div class="eyebrow">Saldo devedor dos imóveis</div><div class="v">${brl(saldo)}</div><div class="s">${st.filter(([, x]) => x.status === 'EM PAGAMENTO').length} em pagamento · ${st.filter(([, x]) => x.status === 'QUITADO').length} quitados</div><div class="s kpi-more">Ver por imóvel ›</div></button>
      <button type="button" data-act="inDet:pago" class="kpi has-ic"><span class="kpi-ic">${icon('building')}</span><div class="eyebrow">Total pago em imóveis</div><div class="v">${brlS(pago)}</div><div class="s">${ims.length} imóveis na carteira</div><div class="s kpi-more">Ver por imóvel ›</div></button>
    </div>
    <div class="cols">
      <section class="panel"><div class="panel-h"><h2>Atenção</h2><span class="chip ${alerts.some(x => x[0] === 'neg') ? 'neg' : alerts.some(x => x[0] === 'warn') ? 'warn' : 'pos'}">${alerts.filter(x => x[0] !== 'ok').length || 'em dia'}</span></div><div class="grid" style="gap:8px">
        ${alerts.map(([k, t, a]) => `<button class="alert ${k}" ${a ? `data-act="${a}"` : 'disabled'}><span class="dot"></span><span>${t}</span>${a ? `<span class="go">›</span>` : ''}</button>`).join('')}
      </div></section>
      <section class="panel"><div class="panel-h"><h2>Próximos vencimentos</h2><span class="mute" style="font-size:.8rem">45 dias e atrasados</span></div>
      <div class="list">${upc.length ? upc.slice(0, 8).map(u => `<button class="row" data-act="${u.act}"><div class="datebox ${u.st === 'VENCIDA' ? 'late' : ''}"><b>${u.d ? u.d.slice(8, 10) : '—'}</b><span>${u.d ? MES3[Number(u.d.slice(5, 7)) - 1] : ''}</span></div><div class="main"><div class="t">${esc(u.t)}</div><div class="sub">${esc(u.s)}${u.st === 'VENCIDA' ? ' · <span class="neg">atrasado</span>' : ''}</div></div><div class="amt">${u.v != null ? brl(u.v) : '<span class="warnc">sem valor</span>'}</div></button>`).join('') + (upc.length > 8 ? `<p class="mute" style="font-size:.8rem;margin:8px">+ ${upc.length - 8} outro(s) — veja em Imóveis e Contas fixas.</p>` : '') : '<p class="mute">Nada vencendo nos próximos 45 dias.</p>'}</div>
      </section>
    </div>
    <div class="cols cols-wide">
      <section class="panel"><div class="panel-h"><h2>Receitas × despesas ${ano}</h2><button class="btn small" data-go="relatorios">Relatórios ›</button></div>${barChart(Array.from({ length: 12 }, (_, i) => sums(L.filter(l => l.ano === ano && l.mes === i + 1))))}<div class="legend"><span><i style="background:var(--pos)"></i>Receitas</span><span><i style="background:var(--neg)"></i>Despesas</span><span class="mute">Lançamentos realizados, sem investimentos</span></div></section>
      <section class="panel"><div class="panel-h"><h2>Atalhos</h2></div>
        <div class="shortcuts">
          <button class="shortcut" data-act="novoLanc">${icon('plus')}Novo lançamento</button>
          <button class="shortcut" data-act="pagarProx">${icon('coin')}Pagar parcela</button>
          <button class="shortcut" data-go="contas">${icon('bill')}Contas do mês</button>
          <button class="shortcut" data-go="loc">${icon('chart')}Painel de locação</button>
          <button class="shortcut" data-go="porimovel">${icon('list')}Por imóvel</button>
          <button class="shortcut" data-act="exportXlsx">${icon('download')}Exportar planilha</button>
        </div>
      </section>
    </div>
  </div>`;
};

/* detalhe dos cartões do Início */
function inicioDet(kind, a1, a2, a3) {
  const L = lancList();
  if (kind === 'ano') {
    const ano = Number(a1); const la = L.filter(l => l.ano === ano);
    const ms = MESES.map((m, i) => ({ i: i + 1, s: sums(la.filter(l => l.mes === i + 1)), n: la.filter(l => l.mes === i + 1).length })).filter(x => x.n);
    const tot = sums(la);
    const og = {}; la.forEach(l => { if ((l.status || 'REALIZADO') !== 'REALIZADO' || l.tipo === 'INVESTIMENTO') return; const o = og[l.origem] = og[l.origem] || { r: 0, d: 0 }; if (l.tipo === 'RECEITA') o.r += l.valor || 0; else o.d += l.valor || 0; });
    return { title: `Resultado ${ano}`, body: `<p class="mute" style="margin:0 0 10px">Receitas − despesas lançadas e realizadas (investimentos ficam de fora). Clique no mês para ver os lançamentos.</p>
      <div class="tablewrap"><table><thead><tr><th>Mês</th><th>Receitas</th><th>Despesas</th><th>Resultado</th><th>Investimentos</th></tr></thead><tbody>
      ${ms.map(x => `<tr style="cursor:pointer" data-act="inDet:mes:${ano}:${x.i}"><td style="text-align:left">${pfMesNome(MESES[x.i - 1])}</td><td>${brl(x.s.RECEITA)}</td><td>${brl(x.s.DESPESA)}</td><td class="${x.s.res < 0 ? 'neg' : 'pos'}"><b>${brl(x.s.res)}</b></td><td>${x.s.INVESTIMENTO ? brl(x.s.INVESTIMENTO) : '—'}</td></tr>`).join('')}
      <tr class="total"><td style="text-align:left">Total</td><td>${brl(tot.RECEITA)}</td><td>${brl(tot.DESPESA)}</td><td>${brl(tot.res)}</td><td>${brl(tot.INVESTIMENTO)}</td></tr></tbody></table></div>
      <h3 style="font-size:.9rem;margin:18px 0 6px">Por origem</h3>
      <div class="tablewrap"><table><thead><tr><th>Origem</th><th>Receitas</th><th>Despesas</th><th>Resultado</th></tr></thead><tbody>
      ${Object.entries(og).sort((a, b) => (b[1].r - b[1].d) - (a[1].r - a[1].d)).map(([o, v]) => `<tr><td style="text-align:left">${esc(o)}</td><td>${v.r ? brl(v.r) : '—'}</td><td>${v.d ? brl(v.d) : '—'}</td><td class="${v.r - v.d < 0 ? 'neg' : ''}">${brl(v.r - v.d)}</td></tr>`).join('')}</tbody></table></div>`,
      foot: `<button class="btn" data-act="closeSheet">Fechar</button><button class="btn primary" data-act="inLanc:${ano}:0">${icon('list')}Abrir em Lançamentos</button>` };
  }
  if (kind === 'mes') {
    const ano = Number(a1), mes = Number(a2), tipo = a3 || ''; const lm = L.filter(l => l.ano === ano && (!mes || l.mes === mes) && (!tipo || l.tipo === tipo)).sort((x, y) => (x.tipo === y.tipo ? 0 : x.tipo === 'RECEITA' ? -1 : 1) || (x.data || '9').localeCompare(y.data || '9') || (y.valor || 0) - (x.valor || 0));
    const s2 = sums(lm);
    const per = mes ? competencia(ano, mes) : String(ano); const tNome = { RECEITA: 'Receitas', DESPESA: 'Despesas', INVESTIMENTO: 'Investimentos' }[tipo];
    if (tipo) { const tot = lm.filter(l => (l.status || 'REALIZADO') === 'REALIZADO').reduce((t, l) => t + (l.valor || 0), 0); const og = {}; lm.forEach(l => { og[l.origem] = (og[l.origem] || 0) + (l.valor || 0); });
      return { title: `${tNome} · ${per}`, body: `<div class="kpis"><div class="kpi"><div class="eyebrow">Total</div><div class="v ${tipo === 'RECEITA' ? 'pos' : tipo === 'DESPESA' ? 'neg' : ''}">${brl(tot)}</div><div class="s">${lm.length} lançamento(s)</div></div><div class="kpi"><div class="eyebrow">Por origem</div><div class="s" style="margin-top:8px;line-height:1.7">${Object.entries(og).sort((x, y) => y[1] - x[1]).slice(0, 6).map(([o, v]) => `${esc(o)}: <b>${brl(v)}</b>`).join('<br>')}</div></div></div>
        <div class="list" style="margin-top:12px">${lm.sort((x, y) => x.mes - y.mes || (y.valor || 0) - (x.valor || 0)).map(l => `<button class="row" data-act="lanc:${l.id}"><div style="min-width:86px;text-align:left"><div style="font-weight:700">${l.data ? fdate(l.data) : '<span class="warnc" style="font-weight:500">sem data</span>'}</div><div class="sub">${competencia(l.ano, l.mes)}${(l.status || 'REALIZADO') !== 'REALIZADO' ? ' · previsto' : ''}</div></div><div class="main"><div class="t">${esc(l.descricao || l.origem)}</div><div class="sub">${esc(l.origem)} · <span class="mono">${l.id}</span></div></div><div class="amt ${tipo === 'RECEITA' ? 'pos' : tipo === 'DESPESA' ? 'neg' : ''}">${brl(l.valor)}</div></button>`).join('') || '<p class="mute">Nenhum lançamento.</p>'}</div>`,
        foot: `<button class="btn" data-act="closeSheet">Fechar</button><button class="btn primary" data-act="inLanc:${ano}:${mes}">${icon('list')}Abrir em Lançamentos</button>` }; }
    return { title: `Resultado de ${competencia(ano, mes)}`, body: `<div class="kpis"><div class="kpi"><div class="eyebrow">Receitas</div><div class="v pos">${brl(s2.RECEITA)}</div></div><div class="kpi"><div class="eyebrow">Despesas</div><div class="v neg">${brl(s2.DESPESA)}</div></div><div class="kpi"><div class="eyebrow">Resultado</div><div class="v ${s2.res < 0 ? 'neg' : ''}">${brl(s2.res)}</div>${s2.INVESTIMENTO ? `<div class="s">Investimentos à parte: ${brl(s2.INVESTIMENTO)}</div>` : ''}</div></div>
      <div class="list" style="margin-top:12px">${lm.map(l => `<button class="row" data-act="lanc:${l.id}"><div style="min-width:86px;text-align:left"><div style="font-weight:700">${l.data ? fdate(l.data) : '<span class="warnc" style="font-weight:500">sem data</span>'}</div><div class="sub">${esc(l.tipo.toLowerCase())}${(l.status || 'REALIZADO') !== 'REALIZADO' ? ' · previsto' : ''}</div></div><div class="main"><div class="t">${esc(l.descricao || l.origem)}</div><div class="sub">${esc(l.origem)} · <span class="mono">${l.id}</span></div></div><div class="amt ${l.tipo === 'RECEITA' ? 'pos' : l.tipo === 'DESPESA' ? 'neg' : ''}">${brl(l.valor)}</div></button>`).join('') || '<p class="mute">Nenhum lançamento.</p>'}</div>`,
      foot: `<button class="btn" data-act="closeSheet">Fechar</button><button class="btn primary" data-act="inLanc:${ano}:${mes}">${icon('list')}Abrir em Lançamentos</button>` };
  }
  const ims = imList().filter(i => !i.arquivado).map(i => ({ i, s: imStats(i) }));
  if (kind === 'saldo') {
    const xs = ims.filter(x => x.s.saldo > 0.005).sort((a, b) => b.s.saldo - a.s.saldo);
    return { title: 'Saldo devedor dos imóveis', body: `<p class="mute" style="margin:0 0 10px">Soma das parcelas ainda não pagas de cada imóvel. Clique para abrir o imóvel.</p><div class="list">${xs.map(x => `<button class="row" data-act="imovel:${x.i.id}"><div class="main"><div class="t">${esc(shortName(x.i))}</div><div class="sub">${x.s.nAbertas} parcela(s) em aberto${x.s.prox ? ' · próxima ' + fdate(x.s.prox) : ''}${x.s.vencidas ? ` · <span class="neg">${x.s.vencidas} vencida(s)</span>` : ''}</div></div><div class="amt">${brl(x.s.saldo)}</div></button>`).join('') || '<p class="mute">Nenhum saldo em aberto.</p>'}</div>
      <p style="text-align:right;margin-top:10px"><b>Total ${brl(xs.reduce((t, x) => t + x.s.saldo, 0))}</b></p>`, foot: `<button class="btn" data-act="closeSheet">Fechar</button>` };
  }
  if (kind === 'pago') {
    const xs = ims.filter(x => x.s.pago > 0).sort((a, b) => b.s.pago - a.s.pago);
    return { title: 'Total pago em imóveis', body: `<p class="mute" style="margin:0 0 10px">Soma das parcelas pagas (entrada, mensais, intermediárias etc.) de cada imóvel. Clique para abrir o imóvel.</p><div class="list">${xs.map(x => `<button class="row" data-act="imovel:${x.i.id}"><div class="main"><div class="t">${esc(shortName(x.i))}</div><div class="sub">${x.s.nPagas} de ${x.s.total} parcela(s) pagas · ${x.s.status === 'QUITADO' ? 'quitado' : 'em pagamento'}</div></div><div class="amt">${brl(x.s.pago)}</div></button>`).join('')}</div>
      <p style="text-align:right;margin-top:10px"><b>Total ${brl(xs.reduce((t, x) => t + x.s.pago, 0))}</b></p>`, foot: `<button class="btn" data-act="closeSheet">Fechar</button>` };
  }
  return { title: '', body: '' };
}

const baseName = (im) => (im.nome || '').replace(/\s*-?\s*\b(HIS-?\s*2|NR)\b.*$/i, '').replace(/\s*\(.*\)\s*$/, '').replace(/\s*-\s*$/, '').trim();
const shortName = (im) => (im.categoria ? im.categoria + ' · ' : '') + baseName(im);
const CATS = ['HIS-2', 'NR'];
const USOS = ['OPERANDO CURTA TEMPORADA', 'LOCAÇÃO MENSAL', 'OPERANDO CONDO-HOTEL', 'EM MONTAGEM', 'AGUARDANDO ENTREGA'];
/* situações de uso criadas pela usuária: config/usos {itens:[{valor, label}]} — somam-se às fixas */
const usosExtra = () => (S.config.usos?.itens || []).filter(x => x && x.valor && !x.arquivado);
const usosAll = () => [...USOS, ...usosExtra().map(x => x.valor).filter(v => !USOS.includes(v))];
const usoLabel = (u) => ({ 'OPERANDO CURTA TEMPORADA': 'Operando curta temporada', 'LOCAÇÃO MENSAL': 'Locação mensal', 'OPERANDO CONDO-HOTEL': 'Operando condo-hotel (pool)', 'EM MONTAGEM': 'Em montagem', 'AGUARDANDO ENTREGA': 'Aguardando entrega' }[u] || (S.config.usos?.itens || []).find(x => x.valor === u)?.label || (u ? u.charAt(0) + u.slice(1).toLowerCase() : ''));
const usoCls = (u) => ({ 'OPERANDO CURTA TEMPORADA': 'pos', 'LOCAÇÃO MENSAL': 'acc', 'OPERANDO CONDO-HOTEL': 'pos', 'EM MONTAGEM': 'warn', 'AGUARDANDO ENTREGA': '' }[u] || '');
const catChip = (im) => im.categoria ? `<span class="chip ${im.categoria === 'NR' ? 'acc' : ''}" style="margin-right:6px;vertical-align:2px">${esc(im.categoria)}</span>` : '';

/* ====================================================================== IMÓVEIS */
VIEWS.imoveis = () => {
  const q = norm(S.f.imQ); const f = S.f.imF;
  const props = [...new Set(imList().map(i => i.proprietario).filter(Boolean))].sort();
  let list = imList().map(i => [i, imStats(i)]);
  list = list.filter(([i, s]) => {
    if (f === 'vendidos') { if (!i.vendido) return false; } else if (f === 'arquivados') { if (!i.arquivado || i.vendido) return false; } else if (i.arquivado || i.vendido) return false;
    if (f === 'pagamento' && s.status !== 'EM PAGAMENTO') return false;
    if (f === 'quitados' && s.status !== 'QUITADO') return false;
    if (f === 'obra' && i.situacao_obra === 'ENTREGUE') return false;
    if (S.f.imProp && i.proprietario !== S.f.imProp) return false;
    if (S.f.imConf && (i.configuracao || '') !== S.f.imConf) return false;
    if (S.f.imCat && (S.f.imCat === '__sem' ? i.categoria : i.categoria !== S.f.imCat)) return false;
    if (S.f.imUso && (S.f.imUso === '__sem' ? i.situacao_uso : i.situacao_uso !== S.f.imUso)) return false;
    if (q && !norm([i.id, i.nome, i.unidade, i.endereco, i.proprietario, i.matricula, i.grupo, i.categoria, usoLabel(i.situacao_uso), i.adm_locacao, i.configuracao, i.empreendimento, i.numero_unidade, i.curta_temporada].join(' ')).includes(q)) return false;
    return true;
  });
  const ordNome = (a, b) => baseName(a[0]).localeCompare(baseName(b[0]), 'pt-BR', { numeric: true, sensitivity: 'base' });
  const ORD = { nome: ordNome, uso: (a, b) => (usosAll().indexOf(a[0].situacao_uso) + 1 || 99) - (usosAll().indexOf(b[0].situacao_uso) + 1 || 99) || ordNome(a, b), venc: (a, b) => (a[1].prox || '9999').localeCompare(b[1].prox || '9999') || ordNome(a, b), pago: (a, b) => b[1].pago - a[1].pago || ordNome(a, b), saldo: (a, b) => b[1].saldo - a[1].saldo || ordNome(a, b) };
  list.sort(ORD[S.f.imOrd] || ordNome);
  const grupos = {};
  list.forEach(x => (grupos[x[0].grupo || 'Outros'] = grupos[x[0].grupo || 'Outros'] || []).push(x));
  return `
  <div class="filters">
    <input type="search" id="imQ" placeholder="Buscar por nome, matrícula, endereço…" value="${esc(S.f.imQ)}" aria-label="Buscar imóvel">
    <select id="imUso" aria-label="Situação de uso"><option value="">Todas as situações de uso</option>${usosAll().map(u => `<option value="${u}" ${u === S.f.imUso ? 'selected' : ''}>${usoLabel(u)}</option>`).join('')}<option value="__sem" ${S.f.imUso === '__sem' ? 'selected' : ''}>Sem situação de uso</option></select>
    <select id="imCat" aria-label="Classificação"><option value="">Todas as classificações</option>${CATS.map(c => `<option value="${c}" ${c === S.f.imCat ? 'selected' : ''}>${c} (${imList().filter(i => !i.arquivado && !i.vendido && i.categoria === c).length})</option>`).join('')}<option value="__sem" ${S.f.imCat === '__sem' ? 'selected' : ''}>Sem classificação (${imList().filter(i => !i.arquivado && !i.vendido && !i.categoria).length})</option></select>
    <select id="imOrd" aria-label="Ordenar">${[['nome', 'Ordem: nome (A–Z)'], ['uso', 'Ordem: situação de uso'], ['venc', 'Ordem: próximo vencimento'], ['saldo', 'Ordem: maior saldo em aberto'], ['pago', 'Ordem: maior total pago']].map(([k, t]) => `<option value="${k}" ${k === (S.f.imOrd || 'nome') ? 'selected' : ''}>${t}</option>`).join('')}</select>
    <select id="imConf" aria-label="Configuração"><option value="">Todas as configurações</option>${[...new Set(imList(true).map(i => i.configuracao).filter(Boolean))].sort().map(c => `<option ${c === S.f.imConf ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
    <select id="imProp" aria-label="Proprietário"><option value="">Todos os proprietários</option>${props.map(p => `<option ${p === S.f.imProp ? 'selected' : ''}>${esc(p)}</option>`).join('')}</select>
    ${S.readonly ? '' : `<button class="btn primary" data-act="novoImovel">${icon('plus')}Novo imóvel</button>`}
  </div>
  <div class="filters"><div class="seg" role="group" aria-label="Filtro">${[['todos', 'Todos'], ['pagamento', 'Em pagamento'], ['quitados', 'Quitados'], ['obra', 'Em obra'], ['vendidos', 'Vendidos'], ['arquivados', 'Arquivados']].map(([k, t]) => `<button data-imf="${k}" aria-pressed="${f === k}">${t}</button>`).join('')}</div><span class="mute" style="font-size:.85rem">${list.length} imóve${list.length === 1 ? 'l' : 'is'}</span>${(() => { const at = [S.f.imQ && `busca "${esc(S.f.imQ)}"`, S.f.imUso && `situação de uso: ${S.f.imUso === '__sem' ? 'sem situação de uso' : esc(usoLabel(S.f.imUso))}`, S.f.imCat && `classificação: ${S.f.imCat === '__sem' ? 'sem classificação' : esc(S.f.imCat)}`, S.f.imProp && `proprietário: ${esc(S.f.imProp)}`, S.f.imConf && `configuração: ${esc(S.f.imConf)}`].filter(Boolean); return at.length ? `<span class="chip warn">filtrado por ${at.join(' · ')}</span><button class="btn small" data-act="imLimpar">${icon('x')}Limpar filtros</button>` : ''; })()}</div>
  ${usoResumo()}
  ${Object.entries(grupos).map(([g, arr]) => `
    <div class="section"><span class="eyebrow">${esc(g)} · ${arr.length}</span>
    <div class="cards">${arr.map(([i, s]) => `
      <button class="card" data-act="imovel:${i.id}">
        <div class="head"><div class="t">${catChip(i)}${esc(baseName(i))}</div>${i.vendido ? '<span class="chip acc">vendido</span>' : s.status === 'QUITADO' ? '<span class="chip pos">quitado</span>' : '<span class="chip warn">em pagamento</span>'}</div>
        <div class="sub mute" style="font-size:.82rem">${esc(i.unidade || '')}${i.proprietario ? ' · ' + esc(i.proprietario) : ''}${i.situacao_obra !== 'ENTREGUE' ? ` · <span class="${obraAtrasada(i) ? 'neg' : 'warnc'}">${esc((i.situacao_obra || '').toLowerCase())}${i.previsao_entrega ? ' até ' + fdate(i.previsao_entrega) : ''}</span>` : ''}</div>
        ${i.configuracao || i.metragem || i.andar ? `<div class="sub" style="font-size:.85rem;font-weight:600">${[i.configuracao, i.metragem, i.andar].filter(Boolean).map(esc).join(' · ')}</div>` : ''}

};

async function saveImovel(ctx) {
  const v = (id) => $('#' + id).value.trim();
  const errs = [];
  if (!v('i_nome')) errs.push(['i_nome', 'Informe o nome do imóvel.']);
  const usoNovo = v('i_uso') === '__novo' ? v('i_uso_novo').replace(/\s+/g, ' ') : null;
  if (v('i_uso') === '__novo' && !usoNovo) errs.push(['i_uso_novo', 'Digite o nome da nova situação de uso.']);
  const money = {}; for (const k of ['i_contrato', 'i_entrada', 'i_base', 'i_aluguel']) { const m = parseMoney(v(k)); if (Number.isNaN(m)) errs.push([k, 'Valor inválido. Use o formato 1.234,56.']); money[k] = m; }
  if (showErrs(errs)) return;
  const data = { nome: v('i_nome'), unidade: v('i_unidade') || null, proprietario: v('i_prop') || null, grupo: v('i_grupo'), endereco: v('i_end') || null,
    metragem: v('i_met') || null, matricula: v('i_mat') || null, data_compra: v('i_compra') || null, situacao_obra: v('i_obra'),
    previsao_entrega: v('i_prev') || null, n_parcelas: v('i_nparc') ? Number(v('i_nparc')) : null, valor_contrato: money.i_contrato,
    valor_entrada: money.i_entrada, reajuste: v('i_reaj') || null, base_intermediaria: money.i_base, observacoes: v('i_obs'),
    categoria: v('i_cat') || null, situacao_uso: v('i_uso') === '__novo' ? null : v('i_uso') || null,
    empreendimento: v('i_emp') || null, numero_unidade: v('i_num') || null, andar: v('i_andar') || null, configuracao: v('i_conf') || null, cidade: v('i_cid') || null, curta_temporada: v('i_ct') || null, situacao_atual: v('i_sitat') || null, adm_locacao: v('i_adm') || null, valor_locacao: money.i_aluguel, inicio_contrato: v('i_inicio') || null, incc_data_base: v('i_inccdb') || null };
  try {
    if (usoNovo) {
      const valor = usoNovo.toUpperCase();
      if (!usosAll().includes(valor)) { await mutateDoc('config/usos', d => { d.itens = d.itens || []; if (!d.itens.some(x => x.valor === valor)) d.itens.push({ valor, label: usoNovo, criado_em: new Date().toISOString() }); }, { create: { itens: [] } }); await logHist('INCLUSÃO', 'usos', `Nova situação de uso criada: ${usoNovo}`); }
      data.situacao_uso = valor;
    }
    if (ctx.id) {
      const antes = clone(S.imoveis[ctx.id]); delete antes.parcelas;
      if (data.data_compra) data.data_compra_texto = null;
      if ((data.situacao_atual || null) !== (S.imoveis[ctx.id].situacao_atual || null)) data.situacao_atual_em = data.situacao_atual ? todayISO() : null;
      await mutateDoc(`imoveis/${ctx.id}`, d => Object.assign(d, data));
      await logHist('EDIÇÃO', ctx.id, `Imóvel ${data.nome} editado`, { antes, depois: data });
      toast('Imóvel salvo'); openSheet('imovel', ctx.id);
    } else {
      const id = nextId('IMV', Object.keys(S.imoveis), 3);
      const doc = { id, ...data, parcelas: [], arquivado: false, criado_em: new Date().toISOString() };
      await S.db.doc(`imoveis/${id}`).set(doc);

function suggestNext(im) {
  const ps = (im.parcelas || []).filter(p => !p.excluido && p.vencimento);
  const mensais = ps.filter(p => p.tipo === 'MENSAL').sort((a, b) => a.vencimento.localeCompare(b.vencimento));
  const last = mensais[mensais.length - 1] || ps.sort((a, b) => a.vencimento.localeCompare(b.vencimento))[ps.length - 1];
  if (!last) return { venc: '', valor: null, msg: '' };
  const venc = addMonths(last.vencimento, 1);
  const [y, m] = venc.split('-').map(Number);
  let valor = last.valor_parcela, msg = 'Mesmo valor da última parcela mensal.';
  if (im.reajuste) {
    const ref = new Date(Date.UTC(y, m - 1 - 2, 1));
    const ry = ref.getUTCFullYear(), rm = ref.getUTCMonth();
    const ind = indices().find(x => x.ano === ry && norm(x.mes).trim() === norm(MESES[rm]));
    if (ind && ind.percentual != null) { valor = Math.round(last.valor_parcela * (1 + ind.percentual) * 100) / 100; msg = `Reajustada pelo INCC-DI de ${MESES[rm].toLowerCase()}/${ry} (${(ind.percentual * 100).toLocaleString('pt-BR', { maximumFractionDigits: 2 })}%) sobre ${brl(last.valor_parcela)}.`; }
    else msg = `INCC-DI de ${MESES[rm].toLowerCase()}/${ry} ainda não cadastrado: usei o valor anterior. Cadastre em Mais › Índices INCC para reajustar.`;
  }
  return { venc, valor, msg, ano: y, mes_ref: MESES[m - 1] };
}

async function saveParcela(ctx) {
  const v = (id) => ($('#' + id)?.value ?? '').trim();
  const errs = [];
  const valor = parseMoney(v('p_valor')), pago = parseMoney(v('p_pago')), enc = parseMoney(v('p_enc')), desc = parseMoney(v('p_desc'));
  if (valor == null || Number.isNaN(valor)) errs.push(['p_valor', 'Informe o valor da parcela.']);
  if (Number.isNaN(pago)) errs.push(['p_pago', 'Valor inválido.']);
  if (ctx.pagar && pago == null) errs.push(['p_pago', 'Informe o valor pago.']);
  if (pago != null && !v('p_dpg')) errs.push(['p_dpg', 'Informe a data do pagamento.']);
  if (Number.isNaN(enc)) errs.push(['p_enc', 'Valor inválido.']); if (Number.isNaN(desc)) errs.push(['p_desc', 'Valor inválido.']);

  data.status_pagamento = data.valor_pago != null ? 'PAGA' : 'EM ABERTO';

    }

function guessOrigem(c) {
  const n = norm(c.conta);
  const has = (x) => origens().some(o => o.nome === x);
  if (/rj|spu/.test(n) && has('APTO RJ')) return 'APTO RJ';
  if (n.includes('4102') && has('MORUMBI 4102')) return 'MORUMBI 4102';
  if (n.includes('1306') && has('VILA NOVA 1306')) return 'VILA NOVA 1306';
  return has('ENCARGOS') ? 'ENCARGOS' : '';
}

function barChart(months) {
  const W = 640, H = 240, P = { l: 56, r: 8, t: 10, b: 26 };
  const max = Math.max(1, ...months.map(m => Math.max(m.RECEITA, m.DESPESA)));
  const step = niceStep(max / 4); const top = Math.ceil(max / step) * step;
  const cw = (W - P.l - P.r) / 12, bw = Math.min(14, cw / 2 - 3);
  const y = (v) => P.t + (H - P.t - P.b) * (1 - v / top);
  let g = '';
  for (let v = 0; v <= top + 1e-6; v += step) g += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${P.l - 6}" y="${y(v) + 4}" text-anchor="end">${axisFmt(v)}</text>`;
  months.forEach((m, i) => {
    const cx = P.l + cw * i + cw / 2;
    g += `<rect x="${cx - bw - 1}" y="${y(m.RECEITA)}" width="${bw}" height="${Math.max(0, y(0) - y(m.RECEITA))}" rx="2" fill="var(--pos)"><title>Receitas ${MES3[i]}: ${brl(m.RECEITA)}</title></rect>`;
    g += `<rect x="${cx + 1}" y="${y(m.DESPESA)}" width="${bw}" height="${Math.max(0, y(0) - y(m.DESPESA))}" rx="2" fill="var(--neg)"><title>Despesas ${MES3[i]}: ${brl(m.DESPESA)}</title></rect>`;
    g += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${MES3[i]}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Receitas e despesas por mês">${g}</svg>`;
}
function lineChart(vals) {
  const W = 640, H = 240, P = { l: 56, r: 12, t: 12, b: 26 };
  let acc = 0; const a = vals.map(v => (acc += v));
  const last = vals.reduce((k, v, i) => v !== 0 ? i : k, -1);
  const pts = a.slice(0, last + 1);
  const mn = Math.min(0, ...pts), mx = Math.max(1, ...pts);
  const step = niceStep((mx - mn) / 4); const lo = Math.floor(mn / step) * step, hi = Math.ceil(mx / step) * step;
  const x = (i) => P.l + (W - P.l - P.r) * (i / 11); const y = (v) => P.t + (H - P.t - P.b) * (1 - (v - lo) / (hi - lo || 1));
  let g = '';
  for (let v = lo; v <= hi + 1e-6; v += step) g += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${Math.abs(v) < 1e-6 ? 'stroke-width="1.5"' : ''}/><text x="${P.l - 6}" y="${y(v) + 4}" text-anchor="end">${axisFmt(v)}</text>`;
  MES3.forEach((m, i) => { g += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${m}</text>`; });
  if (pts.length) {
    const d = pts.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
    g += `<path d="${d}L${x(pts.length - 1)},${y(Math.max(lo, 0))}L${x(0)},${y(Math.max(lo, 0))}Z" fill="var(--accent)" opacity=".12"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.2"/>`;
    pts.forEach((v, i) => { g += `<circle cx="${x(i)}" cy="${y(v)}" r="${i === pts.length - 1 ? 4.5 : 2.5}" fill="var(--accent)"><title>${MES3[i]}: ${brl(v)}</title></circle>`; });
    const lv = pts[pts.length - 1]; g += `<text x="${Math.min(x(pts.length - 1), W - 70)}" y="${y(lv) - 10}" style="fill:var(--ink);font-weight:600">${brlS(lv)}</text>`;
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Resultado acumulado no ano">${g}</svg>`;
}
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(Math.max(raw, 1)))); const n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
function axisFmt(v) { const a = Math.abs(v); const s = a >= 1e6 ? (a / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mi' : a >= 1e3 ? (a / 1e3).toLocaleString('pt-BR', { maximumFractionDigits: 0 }) + ' mil' : String(Math.round(a)); return (v < 0 ? '−' : '') + s; }

async function gz(str) { const cs = new Blob([str]).stream().pipeThrough(new CompressionStream('gzip')); const buf = await new Response(cs).arrayBuffer(); let bin = ''; const b = new Uint8Array(buf); for (let i = 0; i < b.length; i += 0x8000) bin += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(bin); }
async function ungz(b64) { const bin = atob(b64); const b = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i); const ds = new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip')); return await new Response(ds).text(); }
async function makeBackup(motivo) {
  const snap = snapshot(); snap.historico = [];
  const json = JSON.stringify(snap);
  const id = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
  await S.db.doc(`backups/${id}`).set({ criado_em: new Date().toISOString(), motivo, gz: await gz(json), bytes: json.length,
    resumo: { imoveis: snap.imoveis.length, parcelas: snap.imoveis.reduce((s, i) => s + (i.parcelas || []).length, 0), lancamentos: snap.lancamentos.length, contas: snap.contas.length } });
  // poda: mantém 15 mais recentes
  const all = await S.db.collection('backups').get();
  const ids = all.docs.map(d => d.id).sort();
  for (const old of ids.slice(0, Math.max(0, ids.length - 15))) await S.db.doc(`backups/${old}`).delete();
  return id;
}
async function autoBackup() {
  if (S.readonly || !S.db) return;

/* restaurar */
async function restoreData(data, motivo) {
  await makeBackup('Antes de restaurar (' + motivo + ')');
  const imIds = new Set(data.imoveis.map(i => i.id));
  for (const im of data.imoveis) await S.db.doc(`imoveis/${im.id}`).set(im);
  for (const id of Object.keys(S.imoveis)) if (!imIds.has(id)) await S.db.doc(`imoveis/${id}`).delete();
  const byM = {}; data.lancamentos.forEach(l => { const k = `${l.ano}-${pad(l.mes)}`; (byM[k] = byM[k] || { ano: l.ano, mes: l.mes, itens: [] }).itens.push(l); });
  for (const [k, d] of Object.entries(byM)) await S.db.doc(`lanc/${k}`).set(d);
  for (const k of Object.keys(S.lanc)) if (!byM[k]) await S.db.doc(`lanc/${k}`).delete();
  const cIds = new Set(data.contas.map(c => c.id));
  for (const c of data.contas) await S.db.doc(`contas/${c.id}`).set(c);
  for (const id of Object.keys(S.contas)) if (!cIds.has(id)) await S.db.doc(`contas/${id}`).delete();
  const byA = {}; data.recebiveis.forEach(r => { (byA[r.ano] = byA[r.ano] || { ano: r.ano, itens: [] }).itens.push(r); });
  for (const [a, d] of Object.entries(byA)) await S.db.doc(`receb/${a}`).set(d);
  for (const a of Object.keys(S.receb)) if (!byA[a]) await S.db.doc(`receb/${a}`).delete();
  await S.db.doc('config/indices').set({ itens: data.indices || [] });
  await S.db.doc('config/origens').set({ itens: data.origens || [] });
  await S.db.doc('config/pendencias').set({ itens: data.pendencias || [] });
  if (data.empresa && Object.keys(data.empresa).length) await S.db.doc('config/empresa').set(data.empresa);
  if (data.temporada) {
    const T = data.temporada; const cIds = new Set(T.cfg.map(c => c.id)); const mIds = new Set(T.meses.map(m => m.id));
    for (const c of T.cfg) await S.db.doc(`st_cfg/${c.id}`).set(c);
    for (const id of Object.keys(S.stcfg)) if (!cIds.has(id)) await S.db.doc(`st_cfg/${id}`).delete();
    for (const m of T.meses) { const cur = S.stmes[m.id]; await S.db.doc(`st_mes/${m.id}`).set({ ...m, versoes: cur?.versoes || [] }); }
    for (const id of Object.keys(S.stmes)) if (!mIds.has(id)) await S.db.doc(`st_mes/${id}`).delete();
    await S.db.doc('config/cdi').set({ itens: T.cdi || [] });
  }
  if (Array.isArray(data.vendas)) {
    const vIds = new Set(data.vendas.map(v => v.id));
    for (const v of data.vendas) await S.db.doc(`vendas/${v.id}`).set(v);
    for (const id of Object.keys(S.vendas)) if (!vIds.has(id)) await S.db.doc(`vendas/${id}`).delete();
  }
  if (data.locacao) {
    const L = data.locacao; const cIds = new Set((L.cfg || []).map(c => c.id)); const mIds = new Set((L.meses || []).map(m => m.id));
    for (const c of L.cfg || []) await S.db.doc(`loc_cfg/${c.id}`).set(c);
    for (const id of Object.keys(S.loccfg)) if (!cIds.has(id)) await S.db.doc(`loc_cfg/${id}`).delete();
    for (const m of L.meses || []) await S.db.doc(`loc_mes/${m.id}`).set(m);
    for (const id of Object.keys(S.locmes)) if (!mIds.has(id)) await S.db.doc(`loc_mes/${id}`).delete();
  }

const BANCO_COLS = [['imoveis', 'imoveis'], ['lanc', 'lanc'], ['contas', 'contas'], ['receb', 'receb'], ['config', 'config'], ['hist', 'hist'], ['st_cfg', 'stcfg'], ['st_mes', 'stmes'], ['loc_cfg', 'loccfg'], ['loc_mes', 'locmes'], ['vendas', 'vendas']];
function bancoDocs() { const docs = {}; BANCO_COLS.forEach(([c, k]) => Object.entries(S[k] || {}).forEach(([id, d]) => { docs[`${c}/${id}`] = clone(d); })); return docs; }
function bancoContagem(docs) { const c = {}; Object.entries(docs).forEach(([p, d]) => { const col = p.split('/')[0]; c[col] = c[col] || { docs: 0, itens: 0 }; c[col].docs++; ['itens', 'parcelas', 'reservas'].forEach(k => { if (Array.isArray(d[k])) c[col].itens += d[k].length; }); }); return c; }
async function exportBanco() {

async function importarBanco(d, nome) {

  if (existentes) return toast(`Este banco já tem ${existentes} registro(s). A importação só é feita em banco vazio, para não sobrescrever nada.`, 8000);

    const cmp = []; for (const [c] of BANCO_COLS) { const snap = await S.db.collection(c).get(); const got = {}; snap.docs.forEach(x => { got[`${c}/${x.id}`] = x.data(); }); const a = bancoContagem(Object.fromEntries(paths.filter(p => p.startsWith(c + '/')).map(p => [p, d.docs[p]]))) [c] || { docs: 0, itens: 0 }; const b = bancoContagem(got)[c] || { docs: 0, itens: 0 }; cmp.push([c, a, b]); }
    const ok = cmp.every(([, a, b]) => a.docs === b.docs && a.itens === b.itens);

    await logHist('IMPORTAÇÃO', '—', `Banco completo importado de ${nome}: ${n} registros (${ok ? 'contagens conferidas' : 'ATENÇÃO: contagens diferentes'})`);
    S.sheet = { kind: 'custom', data: { title: ok ? 'Importação conferida' : 'Atenção: confira a importação', body: `<div class="note ${ok ? '' : 'warn'}">${ok ? 'Todos os registros foram gravados e as contagens batem com o arquivo.' : 'Alguma contagem não bate. Não apague o sistema antigo e me avise.'}</div><div class="tablewrap"><table><thead><tr><th>Coleção</th><th>Registros (arquivo → site)</th><th>Itens (arquivo → site)</th></tr></thead><tbody>${cmp.map(([c, a, b]) => `<tr><td>${c}</td><td class="${a.docs === b.docs ? '' : 'neg'}">${a.docs} → ${b.docs}</td><td class="${a.itens === b.itens ? '' : 'neg'}">${a.itens} → ${b.itens}</td></tr>`).join('')}</tbody></table></div>`, foot: '<button class="btn primary" data-act="closeSheet">OK</button>' } }; render();
  } });
}

async function softDelete(k, id, extra) {
  const ts = new Date().toISOString();
  if (k === 'imovel') await mutateDoc(`imoveis/${id}`, d => { d.excluido = true; d.excluido_em = ts; });
  if (k === 'parcela') await mutateDoc(`imoveis/${extra.im}`, d => { const p = d.parcelas.find(x => x.id === id); p.excluido = true; p.excluido_em = ts; });
  if (k === 'lanc') await mutateDoc(`lanc/${extra.doc}`, d => { const p = d.itens.find(x => x.id === id); p.excluido = true; p.excluido_em = ts; });
  if (k === 'conta') await mutateDoc(`contas/${id}`, d => { d.excluido = true; d.excluido_em = ts; });
  if (k === 'receb') await mutateDoc(`receb/${extra.doc}`, d => { const p = d.itens.find(x => x.id === id); p.excluido = true; p.excluido_em = ts; });
  if (k === 'loc') await mutateDoc(`loc_mes/${extra.doc}`, d => { const p = d.itens.find(x => x.id === id); p.excluido = true; p.excluido_em = ts; });
  await logHist('EXCLUSÃO', id, `Movido para a Lixeira: ${extra?.t || id}`);
  toast('Movido para a Lixeira', 6000, { label: 'Desfazer', fn: () => restoreItem(k, id) });
}
async function restoreItem(k, id) {
  const it = trashItems().find(x => x.k === k && x.id === id); if (!it) return;
  const un = (d) => { delete d.excluido; delete d.excluido_em; };
  if (k === 'imovel') await mutateDoc(`imoveis/${id}`, un);
  if (k === 'parcela') await mutateDoc(`imoveis/${it.im}`, d => un(d.parcelas.find(x => x.id === id)));
  if (k === 'lanc') await mutateDoc(`lanc/${it.doc}`, d => un(d.itens.find(x => x.id === id)));
  if (k === 'conta') await mutateDoc(`contas/${id}`, un);
  if (k === 'receb') { await mutateDoc(`receb/${it.doc}`, d => un(d.itens.find(x => x.id === id)));
    const sm = Object.values(S.stmes || {}).find(m => (m.repasses || []).some(r => r.recebivel_id === id && r.excluido));
    if (sm) await mutateDoc(`st_mes/${sm.id}`, d => un(d.repasses.find(r => r.recebivel_id === id))); }
  if (k === 'loc') await mutateDoc(`loc_mes/${it.doc}`, d => un(d.itens.find(x => x.id === id)));

}
async function purgeItem(k, id) {
  const it = trashItems().find(x => x.k === k && x.id === id); if (!it) return;
  if (k === 'imovel') await S.db.doc(`imoveis/${id}`).delete();
  if (k === 'parcela') await mutateDoc(`imoveis/${it.im}`, d => { d.parcelas = d.parcelas.filter(x => x.id !== id); });

  contasList().forEach(c => { if (hit([c.id, c.conta, c.situacao, c.observacao, c.solicitar_em, c.grupo].join(' '), [c.valor])) R.push(['Contas fixas', `conta:${c.id}`, c.conta, `${c.id} · ${(c.situacao || '').toLowerCase()}`, brl(c.valor)]); });
  stMeses().filter(m => S.stcfg[m.imovel_id]).forEach(m => { const nm = stNome(m.imovel_id); if (hit([nm, competencia(m.ano, m.mes), 'temporada'].join(' '), [], [], [m.ano, m.mes])) R.push(['Curta temporada', `stMes:${m.id}`, `${nm} · ${competencia(m.ano, m.mes)}`, 'Mês de temporada', brl(stA(m).E)]); (m.reservas || []).forEach(r => { if (!r.excluido && hit([r.codigo, r.hospede, r.canal].join(' '), [r.bruto, r.liquido_informado], [r.checkin, r.checkout])) R.push(['Curta temporada', `stMes:${m.id}`, `${r.codigo || 'Reserva'} ${r.hospede ? '· ' + r.hospede : ''}`, `${nm} · ${competencia(m.ano, m.mes)}`, brl(r.bruto)]); }); });
  recebList().forEach(r => { if (hit([r.id, r.item, competencia(r.ano, r.mes)].join(' '), [r.valor], [], [r.ano, r.mes])) R.push(['Recebíveis', `receb:${r.id}`, r.item, `${r.id} · ${competencia(r.ano, r.mes)}`, brl(r.valor)]); });
  pendencias().forEach(p => { if (hit([p.id, p.titulo, p.detalhe, p.ref].join(' '))) R.push(['Pendências', 'go:pendencias', p.titulo, `${p.id} · ${p.status.toLowerCase()}`, '']); });
  const groups = {}; R.forEach(r => (groups[r[0]] = groups[r[0]] || []).push(r));
  el.innerHTML = R.length ? Object.entries(groups).map(([g, arr]) => `<div class="group-h"><span>${g}</span><span>${arr.length}</span></div>${arr.slice(0, 40).map(r => `<button class="row" data-act="${r[1]}"><div class="main"><div class="t">${esc(r[2])}</div><div class="sub">${esc(r[3])}</div></div><div class="amt">${r[4]}</div></button>`).join('')}${arr.length > 40 ? `<p class="mute">… mais ${arr.length - 40}</p>` : ''}`).join('') : '<p class="mute">Nada encontrado.</p>';
}

/* ====================================================================== CURTA TEMPORADA
   Coleções: st_cfg/{IMV} (parâmetros), st_mes/{IMV_AAAA-MM} (competência), config/cdi (CDI mensal).
   Cálculos: STCalc (reproduz as planilhas Rentabilidade 2026). Leitura de PDF: STParse + pdf.js. */
const stCfgs = () => Object.values(S.stcfg || {}).filter(c => !c.excluido).sort((a, b) => (a.nome || '').localeCompare(b.nome || ''));
const stMeses = (incl = false) => Object.values(S.stmes || {}).filter(m => incl || !m.excluido);
const cdiList = () => (S.config.cdi?.itens || []);
const stNome = (id) => S.stcfg?.[id]?.nome || shortName(S.imoveis[id] || { nome: id });
const stId = (imv, ano, mes) => `${imv}_${ano}-${pad(mes)}`;
const stA = (m) => STCalc.apurar(m, S.stcfg[m.imovel_id] || {}, indices(), cdiList());
const pctS = (v, d = 2) => v == null || isNaN(v) ? '—' : (v * 100).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d }) + '%';
const stStatusCls = (s) => ({ RECEBIDO: 'pos', PENDENTE: 'warn', PARCIAL: 'warn', 'RECEBIDO A MAIOR': 'acc', 'SEM MOVIMENTO': '' }[s] || '');
const stAnos = () => [...new Set([...stMeses().map(m => m.ano), new Date().getFullYear()])].sort((a, b) => b - a);
S.f.stAno = S.f.stAno || new Date().getFullYear(); S.f.stMes = S.f.stMes || 0; S.f.stIm = S.f.stIm || ''; S.f.stMet = S.f.stMet || 'I'; S.f.stRepF = S.f.stRepF || 'abertos';

function stSubnav(cur) {
  const it = [['st', 'Painel'], ['st_import', 'Importar PDF'], ['st_rep', 'Repasses'], ['st_hist', 'Histórico'], ['st_comp', 'Comparativo'], ['st_cfg', 'Cadastro e CDI']];
  return `<div class="filters" style="margin-bottom:18px"><div class="seg" role="tablist">${it.map(([k, t]) => `<button data-go="${k}" aria-pressed="${cur === k}">${t}</button>`).join('')}</div></div>`;
}
function stFilters(withMes = true, withIm = true) {
  return `<div class="filters">
    <select id="stAno" aria-label="Ano">${stAnos().map(a => `<option ${a === Number(S.f.stAno) ? 'selected' : ''}>${a}</option>`).join('')}</select>
    ${withMes ? `<select id="stMes" aria-label="Mês"><option value="0">Ano inteiro</option>${MESES.map((m, i) => `<option value="${i + 1}" ${i + 1 === Number(S.f.stMes) ? 'selected' : ''}>${m[0] + m.slice(1).toLowerCase()}</option>`).join('')}</select>` : ''}
    ${withIm ? `<select id="stIm" aria-label="Imóvel"><option value="">Todos os imóveis (consolidado)</option>${stCfgs().map(c => `<option value="${c.id}" ${c.id === S.f.stIm ? 'selected' : ''}>${esc(c.nome)}</option>`).join('')}</select>` : ''}
  </div>`;
}
function stSel({ ano = Number(S.f.stAno), mes = Number(S.f.stMes), im = S.f.stIm } = {}) {
  return stMeses().filter(m => m.ano === ano && (!mes || m.mes === mes) && (!im || m.imovel_id === im) && S.stcfg[m.imovel_id])
    .map(m => ({ m, a: stA(m), incluir: m.incluir_no_resumo !== false })).sort((x, y) => x.m.mes - y.m.mes || x.m.imovel_id.localeCompare(y.m.imovel_id));
}

VIEWS.st = () => {
  if (!stCfgs().length) return stSubnav('st') + `<div class="panel"><h2>Nenhum imóvel de temporada cadastrado</h2><p class="mute">Cadastre em "Cadastro e CDI".</p></div>`;
  const sel = stSel(); const inc = sel.filter(x => x.incluir);
  const sum = (f) => inc.reduce((s, x) => s + (f(x) || 0), 0);
  const avg = (f) => { const v = inc.map(f).filter(v => v != null && !isNaN(v)); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
  const bruto = sum(x => x.a.tot.bruto), C = sum(x => x.a.C), E = sum(x => x.a.E), I = sum(x => x.a.I), rec = sum(x => x.a.recebido);
  const devidoAll = sel.reduce((s, x) => s + x.a.E, 0), recAll = sel.reduce((s, x) => s + x.a.recebido, 0);
  const resv = sum(x => x.a.resv), bloq = sum(x => x.a.bloq), vag = sum(x => x.a.vagos), dias = sum(x => x.a.dias);
  const ocup = avg(x => x.a.ocup);
  const umMes = Number(S.f.stMes) > 0;
  const nImR = new Set(inc.map(x => x.m.imovel_id)).size || 1;

  const cdiV = umMes ? (cdiList().find(c => c.ano === Number(S.f.stAno) && c.mes === Number(S.f.stMes))?.valor ?? null) : cdiList().filter(c => c.ano === Number(S.f.stAno) && inc.some(x => x.m.mes === c.mes)).reduce((s, c) => s + c.valor, 0);
  const compM = avg(x => x.a.comp);
  const pend = sel.filter(x => x.incluir && x.a.pend.length);
  const nIm = new Set(inc.map(x => x.m.imovel_id)).size || 1;
  // séries mensais por imóvel
  const ims = S.f.stIm ? [S.f.stIm] : stCfgs().map(c => c.id);
  const all = stSel({ mes: 0 });
  const serie = (fn) => ims.map(id => ({ id, v: Array.from({ length: 12 }, (_, i) => { const x = all.find(y => y.m.imovel_id === id && y.m.mes === i + 1 && y.incluir); return x ? fn(x) : null; }) }));
  const per = stCfgs().filter(c => !S.f.stIm || c.id === S.f.stIm).map(c => { const xs = inc.filter(x => x.m.imovel_id === c.id); return { c, xs, I: xs.reduce((s, x) => s + x.a.I, 0), E: xs.reduce((s, x) => s + x.a.E, 0), saldo: stSel({ im: c.id }).reduce((s, x) => s + x.a.saldo, 0), ocup: xs.length ? xs.filter(x => x.a.ocup != null).reduce((s, x) => s + x.a.ocup, 0) / Math.max(1, xs.filter(x => x.a.ocup != null).length) : null, rent: xs.reduce((s, x) => s + (x.a.rent || 0), 0), comp: (() => { const v = xs.map(x => x.a.comp).filter(v => v != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; })() }; });
  const k = (label, v, s, ic, cls = '') => `<div class="kpi has-ic"><span class="kpi-ic">${icon(ic)}</span><div class="eyebrow">${label}</div><div class="v ${cls}">${v}</div>${s ? `<div class="s">${s}</div>` : ''}</div>`;
  return stSubnav('st') + stFilters() + `
  <div class="kpis">
    ${k('Receita bruta das locações', brl(bruto), `${sum(x => x.a.nReservas)} reserva(s)`, 'coin')}
    ${k('Valor líquido das reservas', brl(C), 'Após taxas, limpeza, Pricelabs e comissão', 'list')}
    ${k('A receber do anfitrião', brl(E), `Recebido ${brl(rec)}`, 'download')}
    ${k('Saldo pendente de repasse', brl(devidoAll - recAll), 'Todos os meses do filtro, inclusive sem resumo', 'alert', devidoAll - recAll > 0.005 ? 'warnc' : 'pos')}
    ${k('Rendimento líquido', brl(I), umMes ? 'Inclui bloqueios e despesas ordinárias' : `Média ${brl(I / Math.max(1, inc.length / nIm))}/mês por imóvel`, 'chart', I < 0 ? 'neg' : '')}
    ${k('Taxa média de ocupação', ocup == null ? '—' : pctS(ocup, 1), `${resv} ocupado(s) · ${vag} vago(s) · ${bloq} bloqueado(s) de ${dias} dias`, 'calendar')}
    ${k('Rentabilidade da locação', pctS(rent), `${S.f.stIm ? '' : 'Média por imóvel · '}+ INCC-DI ${pctS(incc)} = ${pctS(rent + (incc || 0))}`, 'index')}
    ${k('Comparação com o CDI', compM == null ? '—' : pctS(compM, 1), `CDI ${umMes ? 'do mês' : 'somado'}: ${pctS(cdiV)}`, 'shield')}
  </div>
  <p class="mute" style="font-size:.78rem;margin:8px 0 0">Comparação = (rentabilidade da locação + valorização INCC-DI) ÷ CDI, como nas planilhas. É um indicador de desempenho, não garantia de rentabilidade.</p>
  <div class="cols section">
    <section class="panel"><div class="panel-h"><h2>Rendimento líquido por mês</h2><span class="mute" style="font-size:.8rem">${S.f.stAno}</span></div>${stBars(serie(x => x.a.I))}${stLegend(ims)}</section>
    <section class="panel"><div class="panel-h"><h2>Taxa de ocupação por mês</h2></div>${stLines(serie(x => x.a.ocup), true)}${stLegend(ims)}</section>
  </div>
  <section class="panel section"><div class="panel-h"><h2>Desempenho por imóvel</h2><span class="mute" style="font-size:.8rem">${umMes ? competencia(Number(S.f.stAno), Number(S.f.stMes)) : 'acumulado ' + S.f.stAno}</span></div>
    <div class="tablewrap"><table><thead><tr><th>Imóvel</th><th>Meses</th><th>A receber</th><th>Saldo pendente</th><th>Rendimento</th><th>Ocupação média</th><th>Rentab. locação</th><th>× CDI (média)</th></tr></thead><tbody>
    ${per.map(p => `<tr style="cursor:pointer" data-act="stImFiltro:${p.c.id}"><td>${esc(p.c.nome)}</td><td>${p.xs.length}</td><td>${brl(p.E)}</td><td class="${p.saldo > 0.005 ? 'warnc' : ''}">${brl(p.saldo)}</td><td class="${p.I < 0 ? 'neg' : ''}">${brl(p.I)}</td><td>${pctS(p.ocup, 1)}</td><td>${pctS(p.rent)}</td><td>${pctS(p.comp, 1)}</td></tr>`).join('')}

  ${pend.length ? `<section class="panel section"><div class="panel-h"><h2>Pendências de conferência</h2><span class="chip warn">${pend.length} mês(es)</span></div><div class="list">${pend.map(x => `<button class="row" data-act="stMes:${x.m.id}"><div class="main"><div class="t">${esc(stNome(x.m.imovel_id))} · ${competencia(x.m.ano, x.m.mes)}</div><div class="sub">${esc(x.a.pend.slice(0, 3).join(' · '))}${x.a.pend.length > 3 ? ` (+${x.a.pend.length - 3})` : ''}</div></div><span class="mute">›</span></button>`).join('')}</div></section>` : ''}
  ${S.readonly ? '' : `<div class="btns section"><button class="btn primary" data-go="st_import">${icon('upload')}Importar relatório PDF</button><button class="btn" data-act="stNovoMes">${icon('plus')}Lançar mês sem PDF</button><button class="btn" data-act="stExport">${icon('download')}Exportar Excel da temporada</button></div>`}`;
};
const ST_COLORS = ['var(--accent)', '#C2A15B', '#2F8F6B', '#9B5DB8', '#C0563F'];
function stLegend(ids) { return `<div class="legend">${ids.map((id, i) => `<span><i style="background:${ST_COLORS[i % 5]}"></i>${esc(stNome(id))}</span>`).join('')}</div>`; }
function stBars(series) {
  const W = 640, H = 230, P = { l: 56, r: 8, t: 10, b: 24 };
  const vals = series.flatMap(s => s.v).filter(v => v != null);
  const mx = Math.max(1, ...vals), mn = Math.min(0, ...vals);
  const step = niceStep((mx - mn) / 4); const hi = Math.ceil(mx / step) * step, lo = Math.floor(mn / step) * step;
  const y = (v) => P.t + (H - P.t - P.b) * (1 - (v - lo) / (hi - lo || 1));
  const cw = (W - P.l - P.r) / 12; const n = series.length; const bw = Math.min(12, (cw - 6) / n);
  let g = '';
  for (let v = lo; v <= hi + 1e-6; v += step) g += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${Math.abs(v) < 1e-6 ? 'stroke-width="1.4"' : ''}/><text x="${P.l - 6}" y="${y(v) + 4}" text-anchor="end">${axisFmt(v)}</text>`;
  for (let i = 0; i < 12; i++) {
    const x0 = P.l + cw * i + (cw - bw * n) / 2;
    series.forEach((s, k) => { const v = s.v[i]; if (v == null) return; const yy = y(Math.max(v, 0)), hh = Math.abs(y(v) - y(0)); g += `<rect x="${x0 + k * bw}" y="${yy}" width="${bw - 1}" height="${Math.max(1, hh)}" rx="2" fill="${v < 0 ? 'var(--neg)' : ST_COLORS[k % 5]}"><title>${esc(stNome(s.id))} ${MES3[i]}: ${brl(v)}</title></rect>`; });
    g += `<text x="${P.l + cw * i + cw / 2}" y="${H - 6}" text-anchor="middle">${MES3[i]}</text>`;
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Rendimento por mês">${g}</svg>`;
}
function stLines(series, isPct) {
  const W = 640, H = 230, P = { l: 48, r: 10, t: 10, b: 24 };
  const y = (v) => P.t + (H - P.t - P.b) * (1 - v);
  const x = (i) => P.l + (W - P.l - P.r) * (i / 11);
  let g = '';
  for (let v = 0; v <= 1.0001; v += 0.25) g += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${P.l - 6}" y="${y(v) + 4}" text-anchor="end">${Math.round(v * 100)}%</text>`;
  MES3.forEach((m, i) => { g += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${m}</text>`; });
  series.forEach((s, k) => {
    const pts = s.v.map((v, i) => v == null ? null : [x(i), y(Math.min(1, Math.max(0, v)))]);
    let d = ''; pts.forEach((p, i) => { if (!p) return; d += (d && pts[i - 1] ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1); });
    if (d) g += `<path d="${d}" fill="none" stroke="${ST_COLORS[k % 5]}" stroke-width="2.2"/>`;
    pts.forEach((p, i) => { if (p) g += `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${ST_COLORS[k % 5]}"><title>${esc(stNome(s.id))} ${MES3[i]}: ${pctS(s.v[i], 1)}</title></circle>`; });
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ocupação por mês">${g}</svg>`;
}

/* ------------------------------------------------------------ COMPARATIVO */
const ST_MET = [['I', 'Rendimento líquido', 'brl'], ['E', 'A receber do anfitrião', 'brl'], ['C', 'Valor líquido das reservas', 'brl'], ['bruto', 'Receita bruta', 'brl'], ['ocup', 'Taxa de ocupação', 'pct1'], ['mediaDiaria', 'Média da diária', 'brl'], ['rent', '% rentabilidade da locação', 'pct3'], ['locVal', 'Locação + valorização INCC', 'pct3'], ['comp', 'Comparação com o CDI', 'pct1']];
VIEWS.st_comp = () => {
  const met = ST_MET.find(x => x[0] === S.f.stMet) || ST_MET[0];
  const get = (a) => met[0] === 'bruto' ? a.tot.bruto : a[met[0]];
  const fmt = (v) => v == null ? '—' : met[2] === 'brl' ? brl(v) : met[2] === 'pct1' ? pctS(v, 1) : pctS(v, 3);
  const all = stSel({ mes: 0, im: '' });
  const cfgs = stCfgs();
  const cell = (id, m) => { const x = all.find(y => y.m.imovel_id === id && y.m.mes === m); return x && x.incluir ? get(x.a) : null; };
  const totals = cfgs.map(c => { const v = MESES.map((_, i) => cell(c.id, i + 1)).filter(v => v != null); return { c, n: v.length, s: v.reduce((a, b) => a + b, 0), avg: v.length ? v.reduce((a, b) => a + b, 0) / v.length : null }; });
  const best = (i) => { const vs = cfgs.map(c => cell(c.id, i + 1)).filter(v => v != null); return vs.length > 1 ? Math.max(...vs) : null; };
  return stSubnav('st_comp') + `<div class="filters"><select id="stAno">${stAnos().map(a => `<option ${a === Number(S.f.stAno) ? 'selected' : ''}>${a}</option>`).join('')}</select>
    <select id="stMet">${ST_MET.map(([k, t]) => `<option value="${k}" ${k === met[0] ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
  <div class="tablewrap"><table><thead><tr><th>Mês</th>${cfgs.map(c => `<th>${esc(c.nome)}</th>`).join('')}</tr></thead><tbody>
  ${MESES.map((m, i) => `<tr><td>${m[0] + m.slice(1).toLowerCase()}</td>${cfgs.map(c => { const v = cell(c.id, i + 1); const b = best(i); return `<td class="${v != null && v < 0 ? 'neg' : ''} ${v != null ? 'clk' : ''}" ${v != null ? `data-act="stExpl:${c.id}:${i + 1}" title="Ver de onde vem este valor"` : ''} style="${v != null && b != null && v === b ? 'font-weight:700;color:var(--pos)' : ''}">${fmt(v)}</td>`; }).join('')}</tr>`).join('')}
  <tr class="total"><td>${met[2] === 'brl' && met[0] !== 'mediaDiaria' ? 'Total' : 'Soma'}</td>${totals.map(t => `<td ${t.n ? `class="clk" data-act="stExpl:${t.c.id}:0" title="Ver a composição do ano"` : ''}>${t.n ? fmt(t.s) : '—'}</td>`).join('')}</tr>
  <tr class="total"><td>Média</td>${totals.map(t => `<td>${fmt(t.avg)}</td>`).join('')}</tr></tbody></table></div>
  <p class="mute" style="font-size:.78rem;margin-top:10px">Em verde, o melhor imóvel de cada mês. Clique em qualquer valor para ver de onde ele vem (reservas, descontos, bloqueios e despesas). Só entram meses do resumo de rentabilidade.</p>
  <section class="panel section"><div class="panel-h"><h2>${esc(met[1])} — evolução</h2></div>${met[2] === 'brl' ? stBars(cfgs.map(c => ({ id: c.id, v: MESES.map((_, i) => cell(c.id, i + 1)) }))) : stLines(cfgs.map(c => ({ id: c.id, v: MESES.map((_, i) => cell(c.id, i + 1)) })), true)}${stLegend(cfgs.map(c => c.id))}</section>`;
};

VIEWS.st_rep = () => {
  const f = S.f.stRepF;

    .filter(x => x.a.statusRep !== 'SEM MOVIMENTO' && (f === 'todos' || (f === 'abertos' ? x.a.statusRep === 'PENDENTE' || x.a.statusRep === 'PARCIAL' : x.a.statusRep === 'RECEBIDO' || x.a.statusRep === 'RECEBIDO A MAIOR')))
    .sort((a, b) => b.m.ano - a.m.ano || b.m.mes - a.m.mes || a.m.imovel_id.localeCompare(b.m.imovel_id));
  const tot = xs.reduce((s, x) => ({ d: s.d + x.a.E, r: s.r + x.a.recebido, p: s.p + Math.max(0, x.a.saldo) }), { d: 0, r: 0, p: 0 });

  <div class="kpis"><div class="kpi"><div class="eyebrow">Apurado para depósito</div><div class="v">${brl(tot.d)}</div></div><div class="kpi"><div class="eyebrow">Recebido</div><div class="v pos">${brl(tot.r)}</div></div><div class="kpi"><div class="eyebrow">Pendente</div><div class="v ${tot.p > 0.005 ? 'warnc' : ''}">${brl(tot.p)}</div></div></div>
  <div class="panel section" style="padding:4px 14px"><div class="list">${xs.map(x => { const inf = (x.m.informados_anfitriao || []).filter(i => !i.confirmado_em && !i.descartado); return `
    <div class="row"><button class="main" style="border:0;background:none;text-align:left;padding:0" data-act="stMes:${x.m.id}"><div class="t">${esc(stNome(x.m.imovel_id))} · ${competencia(x.m.ano, x.m.mes)}</div>
      <div class="sub">Apurado ${brl(x.a.E)} · recebido ${brl(x.a.recebido)}${inf.length ? ` · <span class="acc" style="color:var(--accent)">anfitrião informa depósito de ${brl(inf[0].valor)} em ${fdate(inf[0].data)}</span>` : ''}</div></button>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px"><div class="amt ${x.a.saldo > 0.005 ? 'warnc' : ''}">${brl(x.a.saldo)}</div><span class="chip ${stStatusCls(x.a.statusRep)}">${x.a.statusRep.toLowerCase()}</span></div>
      ${S.readonly || x.a.statusRep === 'RECEBIDO' ? '' : `<button class="btn small" data-act="stRepNovo:${x.m.id}">${icon('check')}Registrar</button>`}</div>`; }).join('') || '<p class="mute">Nada aqui.</p>'}</div></div>
  <p class="mute" style="font-size:.78rem;margin-top:10px">Um repasse só conta como recebido depois que você confirma. O depósito informado no relatório do anfitrião aparece como sugestão.</p>`;
};

      <div class="f"><label for="sc_item_recebiveis">Nome em Recebíveis manuais</label><input type="text" id="sc_item_recebiveis" value="${esc(c.item_recebiveis || '')}"></div></div>

async function stCfgSave(ctx) {
  const v = (k) => ($('#sc_' + k)?.value || '').trim();
  const m = (k) => parseMoney(v(k));
  const errs = [];
  if (!v('nome')) errs.push(['sc_nome', 'Informe o nome.']);
  const inv = m('valor_investido'), bl = m('valor_bloqueio_dia'), incc = m('incc_acumulado'), com = m('comissao_pct');
  if (inv == null || Number.isNaN(inv)) errs.push(['sc_valor_investido', 'Informe o valor investido.']);
  if (bl == null || Number.isNaN(bl)) errs.push(['sc_valor_bloqueio_dia', 'Informe o valor por dia bloqueado.']);
  [['incc_acumulado', incc], ['comissao_pct', com]].forEach(([k, x]) => { if (Number.isNaN(x)) errs.push(['sc_' + k, 'Número inválido.']); });
  if (showErrs(errs)) return;
  const data = { nome: v('nome'), anfitriao: v('anfitriao') || null, codigo_anfitriao: v('codigo_anfitriao').toUpperCase() || null, valor_investido: inv, incc_acumulado: incc == null ? null : incc / 100,
    incc_acumulado_ref: v('incc_acumulado_ref') || null, valor_bloqueio_dia: bl, comissao_pct: com == null ? null : com / 100, item_recebiveis: v('item_recebiveis') || null, observacoes: v('observacoes') || null };
  try {
    const antes = ctx.novo ? null : clone(S.stcfg[ctx.id]);
    await mutateDoc(`st_cfg/${ctx.id}`, d => Object.assign(d, data, { id: ctx.id, imovel_id: ctx.id, ativo: true }), { create: { criado_em: new Date().toISOString() } });
    await logHist(ctx.novo ? 'INCLUSÃO' : 'EDIÇÃO', ctx.id, `Curta temporada: parâmetros de ${data.nome} ${ctx.novo ? 'cadastrados' : 'atualizados'}`, { antes, depois: data });
    toast('Parâmetros salvos'); closeSheet();
  } catch (e) { toast(dbErr(e)); }
}
function stCdiForm(ano, mes) {

    <div class="f2"><div class="f"><label for="cd_mes">Mês</label><select id="cd_mes">${MESES.map((m, i) => `<option value="${i + 1}" ${i + 1 === ms ? 'selected' : ''}>${m[0] + m.slice(1).toLowerCase()}</option>`).join('')}</select></div>
      <div class="f"><label for="cd_ano">Ano</label><input type="number" id="cd_ano" value="${a}"></div></div>
    <div class="f req"><label for="cd_valor">CDI do mês (%)</label><input class="money" type="text" id="cd_valor" inputmode="decimal" placeholder="1,16" value="${c.valor != null ? (c.valor * 100).toLocaleString('pt-BR', { maximumFractionDigits: 4 }) : ''}"><span class="hint">Em porcentagem: 1,16 para 1,16% no mês.</span></div>
    <div class="f"><label for="cd_fonte">Fonte</label><input type="text" id="cd_fonte" value="${esc(c.fonte || 'Informado manualmente')}" placeholder="ex.: B3 / Banco Central"></div>
  </form>`, foot: `<button class="btn" data-act="closeSheet">Cancelar</button><button class="btn primary" data-act="stCdiSave">${icon('check')}Salvar</button>` };

async function stCdiSave() {
  const mes = Number($('#cd_mes').value), ano = Number($('#cd_ano').value), v = parseMoney($('#cd_valor').value), fonte = $('#cd_fonte').value.trim();
  if (showErrs(v == null || Number.isNaN(v) ? [['cd_valor', 'Informe o CDI do mês.']] : [])) return;
  try {
    await mutateDoc('config/cdi', d => { d.itens = d.itens || []; const i = d.itens.findIndex(x => x.ano === ano && x.mes === mes); const it = { ano, mes, valor: v / 100, fonte: fonte || 'Informado manualmente', atualizado_em: new Date().toISOString() }; if (i >= 0) d.itens[i] = it; else d.itens.push(it); }, { create: { itens: [] } });
    await logHist('ÍNDICE', `CDI ${mes}/${ano}`, `CDI de ${competencia(ano, mes)} = ${v.toLocaleString('pt-BR')}%`);
    toast('CDI salvo'); closeSheet();
  } catch (e) { toast(dbErr(e)); }
}

async function stMesSave(ctx) {

  const errs = [];
  const ms = {}; ['sm_int', 'sm_ene', 'sm_con', 'sm_seg'].forEach(k => { ms[k] = mo(k); if (Number.isNaN(ms[k])) errs.push([k, 'Valor inválido.']); });
  let id = ctx.id, ano, mes, imv;
  if (ctx.novo) { imv = v('sm_im'); ano = Number(v('sm_ano')); mes = Number(v('sm_mes')); id = stId(imv, ano, mes); if (S.stmes[id]) errs.push(['sm_mes', 'Este mês já existe para este imóvel. Abra-o pelo Histórico.']); }
  else { ({ ano, mes, imovel_id: imv } = S.stmes[id]); }
  const dias = STCalc.diasNoMes(ano, mes);
  const resv = nInt('sm_resv'), bloq = nInt('sm_bloq');
  if (resv != null && (resv < 0 || !Number.isInteger(resv))) errs.push(['sm_resv', 'Número inteiro de dias.']);
  if (bloq != null && (bloq < 0 || !Number.isInteger(bloq))) errs.push(['sm_bloq', 'Número inteiro de dias.']);
  if ((resv || 0) + (bloq || 0) > dias) errs.push(['sm_bloq', `Reservados + bloqueados passam de ${dias} dias.`]);
  if (showErrs(errs)) return;
  const data = { dias_reservados: resv, dias_bloqueados: bloq, dias_reservados_origem: resv == null ? null : 'informado', despesas_ordinarias: { internet: ms.sm_int, energia: ms.sm_ene, condominio: ms.sm_con, seguro: ms.sm_seg },
    considerar_despesas_ordinarias: $('#sm_cons').checked, incluir_no_resumo: $('#sm_incl').checked, nao_operando: $('#sm_naoop').checked, obs: v('sm_obs') || null };
  try {
    const antes = ctx.novo ? null : { dias_reservados: S.stmes[id].dias_reservados, dias_bloqueados: S.stmes[id].dias_bloqueados, despesas_ordinarias: S.stmes[id].despesas_ordinarias };
    await mutateDoc(`st_mes/${id}`, d => Object.assign(d, data), { create: stNovoDoc(imv, ano, mes, 'manual') });
    await logHist(ctx.novo ? 'INCLUSÃO' : 'EDIÇÃO', id, `Curta temporada ${stNome(imv)} ${competencia(ano, mes)}: ocupação/despesas ${ctx.novo ? 'lançadas' : 'atualizadas'}`, { antes, depois: data });
    toast('Mês salvo'); openSheet('stMes', id);
  } catch (e) { toast(dbErr(e)); }
}

async function stResSave(ctx, del) {
  const v = (k) => ($('#sr_' + k)?.value || '').trim();
  const M = ['bruto', 'taxa_plataforma', 'taxa_limpeza', 'pricelabs', 'outras_taxas', 'comissao'];
  const data = {}; const errs = [];
  if (!del) {
    M.forEach(k => { const x = parseMoney(v(k)); if (Number.isNaN(x)) errs.push(['sr_' + k, 'Valor inválido.']); data[k] = x; });
    if (data.bruto == null) errs.push(['sr_bruto', 'Informe o total cobrado.']);
    ['codigo', 'hospede', 'canal', 'checkin', 'checkout'].forEach(k => { data[k] = v(k) || null; });
    data.hospedes = v('hospedes') ? Number(v('hospedes')) : null;
    if (data.checkin && data.checkout) data.noites = Math.round((Date.parse(data.checkout) - Date.parse(data.checkin)) / 864e5);
    if (showErrs(errs)) return;
  }
  try {
    let antes = null;
    await mutateDoc(`st_mes/${ctx.mid}`, d => {
      d.reservas = d.reservas || [];
      const i = ctx.rid ? d.reservas.findIndex(x => x.id === ctx.rid) : -1;
      if (del) { d.reservas[i].excluido = true; d.reservas[i].excluido_em = new Date().toISOString(); return; }
      if (i >= 0) {
        antes = clone(d.reservas[i]);
        const aj = d.reservas[i].ajustes || [];
        M.forEach(k => { if ((antes[k] ?? null) !== (data[k] ?? null)) aj.push({ campo: k, de: antes[k] ?? null, para: data[k] ?? null, em: new Date().toISOString() }); });
        d.reservas[i] = { ...d.reservas[i], ...data, ajustes: aj };
      } else d.reservas.push({ id: `${ctx.mid}-M${Date.now().toString(36)}`, origem: 'manual', ...data });
    });
    await logHist(del ? 'EXCLUSÃO' : ctx.rid ? 'EDIÇÃO' : 'INCLUSÃO', ctx.mid, `Curta temporada: reserva ${data.codigo || ctx.rid || ''} ${del ? 'excluída' : ctx.rid ? 'ajustada' : 'incluída'}`, { antes, depois: data });
    toast(del ? 'Reserva excluída (fica no histórico)' : 'Reserva salva'); openSheet('stMes', ctx.mid);
  } catch (e) { toast(dbErr(e)); }
}

let pdfjsLoading = null;
function loadPdfjs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  const load = (src) => new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => no(new Error(src)); document.head.appendChild(s); });
  return pdfjsLoading || (pdfjsLoading = (async () => {
    await load('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js');
    await load('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    return window.pdfjsLib;
  })().catch(e => { pdfjsLoading = null; throw e; }));
}

async function stLerPdf() {

  try {
    const pdfjs = await loadPdfjs();
    const lidos = []; const semTexto = []; const repetidos = [];
    for (const f of fs) {

    const r = stJuntar(lidos);

/* junta vários relatórios (ex.: um por reserva) numa só conferência, sem repetir reservas, depósitos ou débitos */
function stJuntar(lidos) {
  if (lidos.length === 1) { const r = lidos[0].r; r.reservas.forEach(x => { x.arquivo = lidos[0].file.name; }); r.codigos = r.codigo_propriedade ? [r.codigo_propriedade] : []; return r; }
  const out = { formato: lidos[0].r.formato, proprietario: lidos.map(l => l.r.proprietario).find(Boolean) || null, codigo_propriedade: null, codigos: [], periodo: null, reservas: [], creditos_extras: [], debitos: [], totais: { reservas: 0, soma_liquidos: 0 }, avisos: [] };
  const vistos = new Set(); const chave = (d) => `${d.data}|${Math.round(Math.abs(d.valor) * 100)}|${norm(d.descricao || '')}`;
  lidos.forEach(({ file, r }) => {
    if (r.codigo_propriedade && !out.codigos.includes(r.codigo_propriedade)) out.codigos.push(r.codigo_propriedade);
    if (r.periodo?.de) out.periodo = { de: !out.periodo || r.periodo.de < out.periodo.de ? r.periodo.de : out.periodo.de, ate: !out.periodo || r.periodo.ate > out.periodo.ate ? r.periodo.ate : out.periodo.ate };
    r.avisos.forEach(a => out.avisos.push(`${file.name}: ${a}`));
    r.reservas.forEach(x => {
      const k = x.codigo || `${x.checkin}|${x.bruto}`;
      if (vistos.has('R' + k)) { out.avisos.push(`${file.name}: reserva ${x.codigo || ''} repetida em outro PDF — considerada uma vez só.`); return; }
      vistos.add('R' + k); x.arquivo = file.name; out.reservas.push(x); out.totais.soma_liquidos += x.liquido || 0;
    });
    if (r.totais?.reservas != null) out.totais.reservas += r.totais.reservas;
    r.debitos.forEach(d => { const k = 'D' + chave(d); if (!vistos.has(k)) { vistos.add(k); out.debitos.push({ ...d, arquivo: file.name }); } });
    r.creditos_extras.forEach(d => { const k = 'C' + chave(d); if (!vistos.has(k)) { vistos.add(k); out.creditos_extras.push({ ...d, arquivo: file.name }); } });
  });

  if (out.codigos.length > 1) out.avisos.unshift(`Os PDFs têm códigos de propriedade diferentes (${out.codigos.join(', ')}). Confira se todos são do mesmo apartamento.`);

function stComparar() {

/* Todos os itens de um imóvel no período (mes = 0 → ano inteiro), com a fonte e se entram na conta. */

      [['RECEITA', 'Reservas (valor líquido)', a.C, `${a.nReservas ?? (m.reservas || []).filter(r => !r.excluido).length} reserva(s), após taxas e comissão`],

function locResumo(id, ano, mes = 0) {
