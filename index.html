const locAnos = () => [...new Set([...stMeses().map(m => m.ano), ...locMesesDocs().map(m => m.ano), ...lancList().map(l => l.ano), ...recebList().map(r => r.ano), new Date().getFullYear()])].map(Number).sort((a, b) => b - a);
const LOC_COLORS = { CURTA: '#C2A15B', MENSAL: 'var(--accent)', POOL: '#2F8F6B' };
const LOC_PAL = ['var(--accent)', '#C2A15B', '#2F8F6B', '#9B5DB8', '#C0563F', '#3B8EA5', '#7A6A3A', '#5B6B8C'];

function locBars(series) { // series: [{nome, cor, v:[12]}]
  const W = 640, H = 230, P = { l: 56, r: 8, t: 10, b: 24 };
  const vals = series.flatMap(s => s.v).filter(v => v != null);
  const mx = Math.max(1, ...vals), mn = Math.min(0, ...vals);
  const step = niceStep((mx - mn) / 4); const hi = Math.ceil(mx / step) * step, lo = Math.floor(mn / step) * step;
  const y = (v) => P.t + (H - P.t - P.b) * (1 - (v - lo) / (hi - lo || 1));
  const cw = (W - P.l - P.r) / 12; const n = series.length || 1; const bw = Math.min(16, (cw - 6) / n);
  let g = '';
  for (let v = lo; v <= hi + 1e-6; v += step) g += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${Math.abs(v) < 1e-6 ? 'stroke-width="1.4"' : ''}/><text x="${P.l - 6}" y="${y(v) + 4}" text-anchor="end">${axisFmt(v)}</text>`;
  for (let i = 0; i < 12; i++) {
    const x0 = P.l + cw * i + (cw - bw * n) / 2;
    series.forEach((s, k) => { const v = s.v[i]; if (v == null) return; const yy = y(Math.max(v, 0)), hh = Math.abs(y(v) - y(0)); g += `<rect x="${x0 + k * bw}" y="${yy}" width="${bw - 1}" height="${Math.max(1, hh)}" rx="2" fill="${v < 0 ? 'var(--neg)' : s.cor}"><title>${esc(s.nome)} ${MES3[i]}: ${brl(v)}</title></rect>`; });
    g += `<text x="${P.l + cw * i + cw / 2}" y="${H - 6}" text-anchor="middle">${MES3[i]}</text>`;
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Rendimento líquido por mês">${g}</svg>
  <div class="legend">${series.map(s => `<span><i style="background:${s.cor}"></i>${esc(s.nome)}</span>`).join('')}</div>`;
}
function locFilters(withIm = true) {
  const ims = locImoveis().filter(im => !S.f.locMod || locModOf(im) === S.f.locMod);
  return `<div class="filters">
    <select id="locAno" aria-label="Ano">${locAnos().map(a => `<option ${a === Number(S.f.locAno) ? 'selected' : ''}>${a}</option>`).join('')}</select>
    <select id="locMes" aria-label="Mês"><option value="0">Ano inteiro</option>${MESES.map((m, i) => `<option value="${i + 1}" ${i + 1 === Number(S.f.locMes) ? 'selected' : ''}>${m[0] + m.slice(1).toLowerCase()}</option>`).join('')}</select>
    <div class="seg" role="group" aria-label="Modalidade">${[['', 'Todas'], ['CURTA', 'Curta temporada'], ['MENSAL', 'Locação mensal'], ['POOL', 'Condo-hotel']].map(([k, t]) => `<button data-act="locModF:${k}" aria-pressed="${S.f.locMod === k}">${t}</button>`).join('')}</div>
    ${withIm ? `<select id="locImF" aria-label="Imóvel"><option value="">Todos os imóveis</option>${ims.map(im => `<option value="${im.id}" ${im.id === S.f.locImF ? 'selected' : ''}>${esc(shortName(im))}</option>`).join('')}</select>` : ''}
  </div>`;
}

/* ------------------------------------------------------------ PAINEL */
VIEWS.loc = () => {
  const ano = Number(S.f.locAno), mes = Number(S.f.locMes);
  const all = locImoveis();
  if (!all.length) return `<div class="panel"><h2>Nenhum imóvel em locação</h2><p class="mute">Marque a situação de uso do imóvel como "Operando curta temporada" ou "Locação mensal" na ficha do imóvel.</p></div>`;
  const ims = all.filter(im => (!S.f.locMod || locModOf(im) === S.f.locMod) && (!S.f.locImF || im.id === S.f.locImF));
  const rows = ims.map(im => ({ im, mod: locModOf(im), R: locResumo(im.id, ano, mes), Ra: locResumo(im.id, ano, 0), al: locAlertas(im, ano) }));
  const sum = (f) => rows.reduce((s, r) => s + f(r), 0);
  const rec = sum(r => r.R.rec), desp = sum(r => r.R.desp), liq = rec - desp;
  const rents = rows.map(r => mes ? r.R.rent : r.R.rentMedia).filter(v => v != null);
  const rentM = rents.length ? rents.reduce((a, b) => a + b, 0) / rents.length : null;
  const prevRec = sum(r => r.R.prevRec);
  const nC = rows.filter(r => r.mod === 'CURTA').length, nM = rows.filter(r => r.mod === 'MENSAL').length, nP = rows.filter(r => r.mod === 'POOL').length;
  const nAl = rows.reduce((s, r) => s + r.al.length, 0);
  const per = mes ? competencia(ano, mes) : 'acumulado ' + ano;
  const k = (label, v, s, ic, cls = '', act = '') => `<${act ? `button type="button" data-act="${act}"` : 'div'} class="kpi has-ic"><span class="kpi-ic">${icon(ic)}</span><div class="eyebrow">${label}</div><div class="v ${cls}">${v}</div>${s ? `<div class="s">${s}</div>` : ''}${act ? '<div class="s" style="color:var(--accent);font-weight:600">Ver lista ›</div>' : ''}</${act ? 'button' : 'div'}>`;
  const byMod = ['CURTA', 'MENSAL', 'POOL'].map(md => { const rs = rows.filter(r => r.mod === md); return { md, rs, v: Array.from({ length: 12 }, (_, i) => { const vs = rs.map(r => r.Ra.porMes[i]).filter(v => v != null); return vs.length ? vs.reduce((a, b) => a + b, 0) : null; }) }; }).filter(x => x.rs.length);
  const serie = S.f.locImF || rows.length <= 1 ? rows.map((r, i) => ({ nome: shortName(r.im), cor: LOC_PAL[i % LOC_PAL.length], v: r.Ra.porMes })) : byMod.map(x => ({ nome: locModLabel(x.md), cor: LOC_COLORS[x.md], v: x.v }));
  const heatMax = Math.max(1, ...rows.flatMap(r => r.Ra.porMes.filter(v => v != null).map(Math.abs)));
  const heat = (v) => v == null ? '' : `background:color-mix(in srgb,${v < 0 ? 'var(--neg)' : 'var(--pos)'} ${Math.round(8 + 30 * Math.min(1, Math.abs(v) / heatMax))}%,transparent)`;
  return locFilters() + `
  <div class="kpis">
    ${k('Receitas', brl(rec), `${per}${prevRec ? ' · previsto ' + brl(prevRec) : ''}`, 'download', '', `locLista:ALL:${ano}:${mes}:RECEITA`)}
    ${k('Despesas', brl(desp), 'Lançadas e apuradas no período', 'bill', '', `locLista:ALL:${ano}:${mes}:DESPESA`)}
    ${k('Rendimento líquido', brl(liq), rec ? `Margem ${pctS(liq / rec, 1)} da receita` : 'Receitas − despesas', 'chart', liq < 0 ? 'neg' : liq > 0 ? 'pos' : '', `locLista:ALL:${ano}:${mes}:TODOS`)}
    ${k(mes ? 'Rentabilidade no mês' : 'Rentabilidade média ao mês', pctS(rentM), rents.length ? `Média de ${rents.length} imóvel(is) com valor de referência` : 'Informe o valor de referência dos imóveis', 'index')}
    ${k('Imóveis em locação', String(rows.length), `${nC} curta temporada · ${nM} locação mensal${nP ? ` · ${nP} condo-hotel` : ''}`, 'building')}
    ${k('Pontos de atenção', String(nAl), nAl ? 'Veja a coluna "Atenção" abaixo' : 'Nada pendente', 'alert', nAl ? 'warnc' : 'pos')}
  </div>
  <p class="mute" style="font-size:.78rem;margin:8px 0 0">Rendimento líquido = receitas − despesas que já aconteceram. Valores previstos aparecem à parte e só contam depois de confirmados. Na curta temporada, os números vêm da apuração mensal (mesmas regras das planilhas Rentabilidade).</p>
  <div class="cols section">
    <section class="panel"><div class="panel-h"><h2>Rendimento líquido por mês</h2><span class="mute" style="font-size:.8rem">${ano}</span></div>${locBars(serie)}</section>
    <section class="panel"><div class="panel-h"><h2>Receita × despesa</h2><span class="mute" style="font-size:.8rem">${per}</span></div>
      <div class="list">${rows.map(r => { const mx = Math.max(1, ...rows.map(x => Math.max(x.R.rec, x.R.desp))); return `<button class="row" data-act="locIm:${r.im.id}" style="display:block;text-align:left">
        <div style="display:flex;justify-content:space-between;gap:8px"><span class="t" style="font-weight:600">${esc(shortName(r.im))}</span><span class="${r.R.liq < 0 ? 'neg' : ''}" style="font-weight:700;font-variant-numeric:tabular-nums">${brl(r.R.liq)}</span></div>
        <div class="locbar"><i style="width:${(r.R.rec / mx * 100).toFixed(1)}%;background:var(--pos)"></i></div><div class="locbar"><i style="width:${(r.R.desp / mx * 100).toFixed(1)}%;background:var(--neg)"></i></div>
        <div class="sub" style="font-size:.76rem">receita ${brl(r.R.rec)} · despesa ${brl(r.R.desp)}</div></button>`; }).join('')}</div></section>
  </div>
  <section class="panel section"><div class="panel-h"><h2>Desempenho por imóvel</h2><span class="mute" style="font-size:.8rem">${per}</span></div>
    <div class="tablewrap"><table><thead><tr><th>Imóvel</th><th>Modalidade</th><th>Administração</th><th>Depósito cai em</th><th>Receitas</th><th>Despesas</th><th>Rendimento líquido</th><th>Margem</th><th>${mes ? 'Rentab. no mês' : 'Rentab. média a.m.'}</th><th>Meses</th><th>Atenção</th></tr></thead><tbody>
    ${rows.map(r => `<tr style="cursor:pointer" data-act="locIm:${r.im.id}"><td style="text-align:left">${esc(shortName(r.im))}</td><td><span class="chip ${locModCls(r.mod)}">${locModLabel(r.mod)}</span></td><td>${esc(r.im.adm_locacao || S.stcfg[r.im.id]?.anfitriao || '—')}</td><td>${locDepChip(r.im.id)}</td>
      <td>${brl(r.R.rec)}</td><td>${brl(r.R.desp)}</td><td class="${r.R.liq < 0 ? 'neg' : ''}"><b>${brl(r.R.liq)}</b></td><td>${pctS(r.R.margem, 1)}</td><td>${pctS(mes ? r.R.rent : r.R.rentMedia)}</td><td>${r.R.meses.length}</td>
      <td>${r.al.length ? `<span class="chip warn" title="${esc(r.al.map(a => a.t).join(' · '))}">${r.al.length}</span>` : '<span class="chip pos">ok</span>'}</td></tr>`).join('')}
    <tr class="total"><td style="text-align:left">Total</td><td></td><td></td><td></td><td>${brl(rec)}</td><td>${brl(desp)}</td><td>${brl(liq)}</td><td>${pctS(rec ? liq / rec : null, 1)}</td><td>${pctS(rentM)}</td><td></td><td></td></tr>
    </tbody></table></div></section>
  ${(() => { const gs = [['VRPM', 'Na conta da VRPM', 'entra também nas receitas da VRPM'], ['PESSOAL', 'Na conta pessoal', 'só aparece neste painel; não entra nas receitas nem nos recebíveis da VRPM'], ['', 'Conta não informada', 'informe em "Vínculos e valor de referência" do imóvel']].map(([c, t, s]) => ({ c, t, s, rs: rows.filter(r => (locDep(r.im.id)?.conta || '') === c) })).filter(g => g.rs.length);
    return `<section class="panel section"><div class="panel-h"><h2>Onde caem os depósitos</h2><span class="mute" style="font-size:.8rem">receitas de ${per}</span></div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px">${gs.map(g => `<div class="panel" style="padding:12px 14px;box-shadow:none"><div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline"><b>${g.t}</b><b class="num">${brl(g.rs.reduce((a, r) => a + r.R.rec, 0))}</b></div><div class="mute" style="font-size:.78rem;margin:2px 0 8px">${g.s}</div>
      ${g.rs.map(r => `<button class="row" data-act="locIm:${r.im.id}" style="padding:6px 0"><div class="main"><div class="t">${esc(shortName(r.im))}</div><div class="sub">${esc(locDepTxt(r.im.id) || 'a informar')}${r.im.adm_locacao || S.stcfg[r.im.id]?.anfitriao ? ' · via ' + esc(r.im.adm_locacao || S.stcfg[r.im.id]?.anfitriao) : ''}</div></div><div class="amt">${brl(r.R.rec)}</div></button>`).join('')}</div>`).join('')}</div></section>`; })()}
  <section class="panel section"><div class="panel-h"><h2>Mês a mês — rendimento líquido</h2><span class="mute" style="font-size:.8rem">${ano} · clique para ver os lançamentos</span></div>
    <div class="tablewrap"><table class="locheat"><thead><tr><th>Imóvel</th>${MES3.map(m => `<th>${m}</th>`).join('')}<th>Ano</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td style="text-align:left">${esc(shortName(r.im))}</td>${r.Ra.porMes.map((v, i) => `<td style="cursor:pointer;${heat(v)}" data-act="locMesSh:${r.im.id}:${ano}:${i + 1}" class="${v != null && v < 0 ? 'neg' : ''}">${v == null ? '<span class="mute">—</span>' : brlS(v)}</td>`).join('')}<td><b class="${r.Ra.liq < 0 ? 'neg' : ''}">${brlS(r.Ra.liq)}</b></td></tr>`).join('')}
    </tbody></table></div></section>
  ${nAl ? `<section class="panel section"><div class="panel-h"><h2>Pontos de atenção</h2><span class="chip warn">${nAl}</span></div><div class="list">${rows.flatMap(r => r.al.map(a => `<button class="row" data-act="${a.act}"><div class="main"><div class="t">${esc(shortName(r.im))}</div><div class="sub">${esc(a.t)}</div></div><span class="mute">›</span></button>`)).join('')}</div></section>` : ''}
  ${S.readonly ? '' : `<div class="btns section"><button class="btn primary" data-act="locNovo">${icon('plus')}Lançar receita ou despesa</button><button class="btn" data-act="locExport">${icon('download')}Exportar Excel do painel</button></div>`}`;
};

/* ------------------------------------------------------------ DETALHE DO IMÓVEL */
VIEWS.loc_im = () => {
  const im = locEnt(S.f.locIm); if (!im) { S.view = 'loc'; return VIEWS.loc(); }
  const id = im.id, ano = Number(S.f.locAno); const mod = locModOf(im);
  const Ra = locResumo(id, ano, 0); const c = locCfg(id); const og = locOrigens(id); const ri = locRecebItem(id); const al = locAlertas(im, ano);
  const meses = Array.from({ length: 12 }, (_, i) => ({ m: i + 1, R: locResumo(id, ano, i + 1) }));
  const k = (label, v, s, cls = '', act = '') => `<${act ? `button type="button" data-act="${act}"` : 'div'} class="kpi"><div class="eyebrow">${label}</div><div class="v ${cls}">${v}</div>${s ? `<div class="s">${s}</div>` : ''}${act ? '<div class="s" style="color:var(--accent);font-weight:600">Ver lista com datas ›</div>' : ''}</${act ? 'button' : 'div'}>`;
  const fonteChip = (on, t) => `<span class="chip ${on ? 'pos' : ''}">${t}</span>`;
  return `<div class="filters"><button class="btn" data-go="loc">${icon('back')}Painel de locação</button>
    <select id="locAno" aria-label="Ano">${locAnos().map(a => `<option ${a === ano ? 'selected' : ''}>${a}</option>`).join('')}</select>
    <select id="locImSel" aria-label="Imóvel">${locImoveis().map(x => `<option value="${x.id}" ${x.id === id ? 'selected' : ''}>${esc(shortName(x))}</option>`).join('')}</select></div>
  <div class="panel" style="margin-bottom:14px"><div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between">
    <div><h2 style="margin:0">${esc(shortName(im))}</h2><div class="mute" style="font-size:.85rem;margin-top:4px">${locModLabel(mod)}${im.isPool ? ` · pool de ${im.imoveis.length} unidades (${esc(im.unidades.join(', '))}) · origem ${esc(im.origem)}` : ''}${im.adm_locacao ? ' · ' + esc(im.adm_locacao) : ''}${mod === 'MENSAL' && im.valor_locacao ? ' · aluguel ' + brl(im.valor_locacao) : ''}${im.inicio_contrato ? ' · contrato desde ' + fdate(im.inicio_contrato) : ''}</div>
      <div style="margin-top:6px;font-size:.85rem">Depósito cai em: ${locDepChip(id)}${locDep(id)?.conta === 'PESSOAL' ? ' <span class="mute">· não entra nas receitas da VRPM</span>' : ''}</div></div>
    ${S.readonly ? '' : `<div class="btns"><button class="btn" data-act="locCfg:${id}">${icon('tag')}Vínculos e valor de referência</button>${mod === 'MENSAL' && im.valor_locacao ? `<button class="btn" data-act="locAluguel:${id}">${icon('plus')}Lançar aluguel</button>` : ''}<button class="btn primary" data-act="locNovo:${id}">${icon('plus')}Receita ou despesa</button></div>`}</div>
    <div class="btns" style="margin-top:10px;font-size:.8rem">Fontes: ${locIsST(id) ? fonteChip(true, 'Curta temporada (apuração mensal)') : ''}${og.usadas.length ? fonteChip(c.usar_lanc !== false, 'Lançamentos: ' + esc(og.usadas.join(', '))) : ''}${ri ? fonteChip(c.usar_receb !== false, 'Recebíveis: ' + esc(ri)) : ''}${fonteChip(true, 'Lançamentos do painel')}</div></div>
  <div class="kpis">
    ${k('Receitas ' + ano, brl(Ra.rec), Ra.prevRec ? 'Previsto ' + brl(Ra.prevRec) : '', '', `locLista:${id}:${ano}:0:RECEITA`)}
    ${k('Despesas ' + ano, brl(Ra.desp), Ra.prevDesp ? 'Previsto ' + brl(Ra.prevDesp) : '', '', `locLista:${id}:${ano}:0:DESPESA`)}
    ${k('Rendimento líquido', brl(Ra.liq), Ra.meses.length ? `Média ${brl(Ra.liq / Ra.meses.length)} por mês com movimento` : 'Sem movimento no ano', Ra.liq < 0 ? 'neg' : Ra.liq > 0 ? 'pos' : '', `locLista:${id}:${ano}:0:TODOS`)}
    ${k('Rentabilidade', pctS(Ra.rentMedia), Ra.ref.v ? `média a.m. · ${pctS(Ra.rent)} no ano sobre ${brl(Ra.ref.v)}` : 'Informe o valor de referência', Ra.ref.v ? '' : 'warnc')}
  </div>
  ${al.length ? `<div class="grid section" style="gap:8px">${al.map(a => `<div class="alert ${a.cls === 'warn' ? 'warn' : 'info'}"><span class="dot"></span><div style="flex:1">${esc(a.t)}</div>${a.act.startsWith('locCfg') && !S.readonly ? `<button class="btn small" data-act="${a.act}">Resolver</button>` : ''}</div>`).join('')}</div>` : ''}
  <section class="panel section"><div class="panel-h"><h2>Rendimento líquido por mês</h2></div>${locBars([{ nome: shortName(im), cor: LOC_COLORS[mod], v: Ra.porMes }])}</section>
  <section class="panel section"><div class="panel-h"><h2>Mês a mês</h2><span class="mute" style="font-size:.8rem">clique no mês para ver e ajustar os lançamentos</span></div>
    <div class="tablewrap"><table><thead><tr><th>Mês</th><th>Receitas</th><th>Despesas</th><th>Rendimento líquido</th><th>Margem</th><th>Rentab.</th><th>Previsto</th><th>Itens</th></tr></thead><tbody>
    ${meses.map(({ m, R }) => `<tr style="cursor:pointer" data-act="locMesSh:${id}:${ano}:${m}"><td style="text-align:left">${MESES[m - 1][0] + MESES[m - 1].slice(1).toLowerCase()}</td><td>${R.rec ? brl(R.rec) : '—'}</td><td>${R.desp ? brl(R.desp) : '—'}</td><td class="${R.liq < 0 ? 'neg' : ''}">${R.cnt.length ? '<b>' + brl(R.liq) + '</b>' : '—'}</td><td>${pctS(R.margem, 1)}</td><td>${pctS(R.rent)}</td><td>${R.prevRec || R.prevDesp ? brl(R.prevRec - R.prevDesp) : '—'}</td><td>${R.it.length || ''}</td></tr>`).join('')}
    <tr class="total"><td style="text-align:left">Total</td><td>${brl(Ra.rec)}</td><td>${brl(Ra.desp)}</td><td>${brl(Ra.liq)}</td><td>${pctS(Ra.margem, 1)}</td><td>${pctS(Ra.rent)}</td><td>${Ra.prevRec || Ra.prevDesp ? brl(Ra.prevRec - Ra.prevDesp) : '—'}</td><td>${Ra.it.length}</td></tr>
    </tbody></table></div>
    <p class="mute" style="font-size:.78rem;margin-top:10px">Rentabilidade = rendimento líquido ÷ valor de referência (${Ra.ref.v ? esc(Ra.ref.fonte) + ': ' + brl(Ra.ref.v) : 'não informado'}). A média a.m. divide pelo número de meses com movimento.</p></section>`;
};

/* ------------------------------------------------------------ SHEETS */
function locMesSheet(id, ano, mes) {
  ano = Number(ano); mes = Number(mes);
  const im = locEnt(id); const R = locResumo(id, ano, mes);
  const grp = ['ST', 'LANC', 'RECEB', 'PAINEL'].map(f => [f, R.it.filter(x => x.fonte === f)]).filter(([, xs]) => xs.length);
  const row = (x) => `<div class="row" style="${x.conta ? '' : 'opacity:.62'}"><div class="main"><div class="t">${x.tipo === 'RECEITA' ? '<span class="pos">+</span>' : '<span class="neg">−</span>'} ${esc(x.categoria)}${x.status === 'PREVISTO' ? ' <span class="chip warn">previsto</span>' : ''}${x.ignorado ? ' <span class="chip">não conta</span>' : ''}</div>
      <div class="sub">${esc(x.descricao || '')}${x.motivo && !x.ignorado && x.status !== 'PREVISTO' ? ` · <span class="warnc">${esc(x.motivo)}</span>` : ''}${x.fonte === 'LANC' || x.fonte === 'RECEB' ? ` · <span class="mono">${x.ref}</span>` : ''}${x.data ? ' · ' + fdate(x.data) : ''}</div></div>

/* ------------------------------------------------------------ RANKING DE RENDIMENTO
   Curta temporada + locação mensal (condo-hotel fica de fora). Ordena pelo rendimento líquido em R$
   (receitas − despesas) do mês ou do ano. Só lê os números do painel (locResumo); nada é gravado. */
S.f.rkMod = S.f.rkMod || '';
function locRanking(ano, mes) {
  const ims = locImoveis().filter(im => !im.isPool && locModOf(im) !== 'POOL' && (!S.f.rkMod || locModOf(im) === S.f.rkMod));
  const rows = ims.map(im => {
    const Ra = locResumo(im.id, ano, 0);
    const meses = Array.from({ length: 12 }, (_, i) => { const R = locResumo(im.id, ano, i + 1); return R.cnt.length ? { liq: R.liq, rec: R.rec, desp: R.desp } : null; });
    const P = mes ? meses[mes - 1] : (Ra.cnt.length ? { liq: Ra.liq, rec: Ra.rec, desp: Ra.desp } : null);
    return { im, mod: locModOf(im), meses, P, nMeses: Ra.meses.length, media: Ra.meses.length ? Ra.liq / Ra.meses.length : null };
  });
  rows.sort((a, b) => (a.P == null) - (b.P == null) || (b.P?.liq ?? 0) - (a.P?.liq ?? 0) || shortName(a.im).localeCompare(shortName(b.im), 'pt-BR'));
  let pos = 0; rows.forEach(r => { r.pos = r.P != null ? ++pos : null; });
  const posMes = Array.from({ length: 12 }, (_, i) => { const xs = rows.filter(r => r.meses[i]).sort((a, b) => b.meses[i].liq - a.meses[i].liq); const m = {}; xs.forEach((r, k) => { m[r.im.id] = k + 1; }); return m; });
  return { rows, posMes };
}
VIEWS.loc_rank = () => {
  const ano = Number(S.f.locAno), mes = Number(S.f.locMes);
  const { rows, posMes } = locRanking(ano, mes);
  const per = mes ? competencia(ano, mes) : 'ano de ' + ano;
  const vals = rows.flatMap(r => r.meses.filter(Boolean).map(m => m.liq));
  const mx = Math.max(1e-9, ...vals.map(Math.abs));
  const heat = (v) => v == null ? '' : `background:color-mix(in srgb,${v < 0 ? 'var(--neg)' : 'var(--pos)'} ${Math.round(6 + 32 * Math.min(1, Math.abs(v) / mx))}%,transparent)`;

    ${rows.map(r => `<tr style="cursor:pointer" data-act="${mes ? `locMesSh:${r.im.id}:${ano}:${mes}` : `locIm:${r.im.id}`}"><td><b>${medal(r.pos)}</b></td><td style="text-align:left">${esc(shortName(r.im))}</td><td><span class="chip ${locModCls(r.mod)}">${locModLabel(r.mod)}</span></td>

function pfParcDate(imv, pid, campo, sugestoes, rotuloCampo) {
  return () => { const p = pfFindParc(imv, pid);
    const opts = sugestoes.filter(s => s.d !== p?.[campo]).map((s, i) => ({ k: 's' + i, t: `${rotuloCampo} ${fdate(s.d)}`, s: s.why, apply: async () => { await pfSetParc(imv, pid, { [campo]: s.d }, `${rotuloCampo.toLowerCase()} da parcela ${p.mes_ref}/${p.ano} corrigido para ${fdate(s.d)}`); return { resumo: `${rotuloCampo} corrigido para ${fdate(s.d)}`, ok: true }; } }));
    opts.push({ k: 'outra', t: 'Outra data', html: pfDate('pf_outra'), apply: async () => { const d = $('#pf_outra').value; if (!d) throw { campo: 'pf_outra', msg: 'Informe a data.' }; await pfSetParc(imv, pid, { [campo]: d }, `${rotuloCampo.toLowerCase()} da parcela ${p.mes_ref}/${p.ano} corrigido para ${fdate(d)}`); return { resumo: `${rotuloCampo} corrigido para ${fdate(d)}`, ok: true }; } });
    if (p?.[campo]) opts.push(pfManter(`Está certo: manter ${fdate(p[campo])}`));
    return { atual: pfParcTxt(imv, p), opts };
  };
}

/* --- INCC (tabela única) --- */
function pfIncc(lista) { return () => { const now = new Date(); const lim = now.getFullYear() * 12 + now.getMonth(); // até o mês anterior
  const falt = lista.filter(([m, a]) => a * 12 + MESES.indexOf(m) + 1 <= lim && !indices().some(x => x.ano === a && x.mes.trim() === m && x.percentual != null));
  return { atual: `O app usa uma tabela única de INCC-DI (Mais › Índices) para todos os imóveis. ${falt.length ? `Faltam nela: ${falt.map(([m, a]) => pfMesNome(m).slice(0, 3) + '/' + a).join(', ')}.` : 'Todos os meses já publicados desta lista estão na tabela única.'}`, opts: [
    pfCiente('Ciente — usar a tabela única'),
    ...(falt.length ? [{ k: 'incc', t: 'Informar os INCC-DI que faltam na tabela única (em %)', html: `<div class="grid" style="gap:6px;margin-top:8px">${falt.map(([m, a], i) => `<div style="display:flex;gap:10px;align-items:center"><span style="flex:1;font-size:.84rem">${pfMesNome(m)}/${a}</span><input type="text" class="money" id="pf_i${i}" inputmode="decimal" placeholder="0,61" style="max-width:120px"></div>`).join('')}</div>`,
      apply: async () => { let n = 0; const vals = falt.map(([m, a], i) => [m, a, $('#pf_i' + i).value.trim() ? parseMoney($('#pf_i' + i).value) : null]); if (vals.some(v => v[2] != null && Number.isNaN(v[2]))) throw { campo: 'pf_i0', msg: 'Valor inválido.' };
        await mutateDoc('config/indices', d => { vals.forEach(([m, a, p]) => { if (p == null) return; const i = d.itens.findIndex(x => x.ano === a && x.mes.trim() === m); const it = { ano: a, mes: m, percentual: Math.round(p * 1e6) / 1e8, atualiza_parcela_de: MESES[(MESES.indexOf(m) + 2) % 12] }; if (i >= 0) d.itens[i] = { ...d.itens[i], ...it }; else d.itens.push(it); n++; }); });
        if (!n) throw { campo: 'pf_i0', msg: 'Informe ao menos um mês.' }; await logHist('ÍNDICE', 'INCC', `INCC-DI informado na pendência: ${vals.filter(v => v[2] != null).map(v => `${v[0].toLowerCase()}/${v[1]} ${v[2].toLocaleString('pt-BR')}%`).join(', ')}`); return { resumo: `${n} mês(es) de INCC-DI informado(s) na tabela única`, ok: true }; } }] : [])] }; }; }
const pfMeses = (de, ate) => { const out = []; for (let k = de[1] * 12 + de[0] - 1; k <= ate[1] * 12 + ate[0] - 1; k++) out.push([MESES[k % 12], Math.floor(k / 12)]); return out; };

/* ====================================================================== VENDAS DE IMÓVEIS
   Coleção vendas/{VND-xxx}: dados da escritura (imóvel, comprador, valor, data) e, quando houver, o saldo
   financiado pelo comprador com correção (ex.: 100% do CDI) — mesma conta da planilha:
   saldo do mês = saldo corrigido do mês anterior − pagamento do mês anterior; corrigido = saldo × (1 + taxa). */
const vendasList = () => Object.values(S.vendas || {}).filter(v => !v.excluido).sort((a, b) => (b.data_venda || '').localeCompare(a.data_venda || ''));
const r2v = (v) => Math.round((v + Number.EPSILON) * 100) / 100;
function vndFin(v) {
  const f = v.financiamento; if (!f) return null;
  const ls = (f.linhas || []).slice().sort((a, b) => a.ano * 12 + a.mes - (b.ano * 12 + b.mes));
  const pago = ls.reduce((s, l) => s + (l.pagamento || 0), 0);
  const juros = ls.reduce((s, l) => s + ((l.corrigido ?? l.saldo) - l.saldo), 0);
  const last = ls[ls.length - 1];
  const saldo = last ? (last.corrigido ?? last.saldo) - (last.pagamento || 0) : f.saldo_inicial;
  let prox = null; if (last) { const k = last.ano * 12 + last.mes; prox = { ano: Math.floor(k / 12), mes: k % 12 + 1 }; }
  const proxData = prox && f.dia_pagamento ? `${prox.ano}-${pad(prox.mes)}-${pad(Math.min(f.dia_pagamento, new Date(prox.ano, prox.mes, 0).getDate()))}` : null;
  // parcelas vencidas sem lançamento: do mês seguinte ao último registrado até hoje, vencidas após o dia de pagamento
  const atrasadas = []; const hoje = todayISO();
  if (prox && f.dia_pagamento && saldo > 0.005) { let y = prox.ano, m = prox.mes; for (let k = 0; k < 36; k++) { const dd = `${y}-${pad(m)}-${pad(Math.min(f.dia_pagamento, new Date(y, m, 0).getDate()))}`; if (dd >= hoje) break; atrasadas.push({ ano: y, mes: m, venc: dd }); m++; if (m > 12) { m = 1; y++; } } }
  return { ls, pago, juros, saldo: Math.max(0, saldo), last, prox, proxData, quitado: saldo <= 0.005, atrasadas };
}

/* ====================================================================== EVOLUÇÃO DO INVESTIMENTO E PREÇO MÍNIMO DE VENDA
   Fonte dos pagamentos: as parcelas já cadastradas no imóvel (imoveis/{id}.parcelas) com valor pago.
   Os registros originais não são alterados: a correção é calculada na tela, a cada abertura.
   CDI: série SGS 12 do Banco Central (CDI diário, % ao dia), guardada em cache na coleção cdi_diario/{ano}

const INV_DEF = { pct_cdi: 100, corretagem: 6, cessao: 3 };

const isoBR = (iso) => iso.split('-').reverse().join('/');

/* carrega o CDI diário de todos os anos necessários; usa o cache do banco e busca no BCB o que faltar */
async function cdiCarregar(desdeISO, forcar = false) {
  if (S.cdi.carregando) return;
  S.cdi.carregando = true; S.cdi.erro = null; if (S.sheet?.kind === 'imovel') render(); else scheduleRender();
  const hoje = todayISO(); const anoIni = Number(desdeISO.slice(0, 4)); const anoFim = Number(hoje.slice(0, 4));
  const dias = {}; let atualizado = null; const falhas = [];
  for (let a = anoIni; a <= anoFim; a++) {
    let doc = null;
    try { const s = await S.db.doc(`cdi_diario/${a}`).get(); doc = s.exists ? s.data() : null; } catch { }
    const precisa = forcar || !doc || (a === anoFim && (doc.consultado_em || '').slice(0, 10) !== hoje) || (a < anoFim && !doc.ano_completo);
    if (precisa) {
      try {
        const fim = a === anoFim ? isoBR(hoje) : `31/12/${a}`;
        let arr = null, ult = null;
        for (let t = 0; t < 5 && !arr; t++) { // o serviço do BCB às vezes recusa a chamada: tenta até 5 vezes
          try { const r = await fetch(`https://api.bcb.gov.br/dados/serie/bcdata.sgs.12/dados?formato=json&dataInicial=01/01/${a}&dataFinal=${fim}&_=${Date.now()}`, { cache: 'no-store' }); if (!r.ok) throw new Error('HTTP ' + r.status); const j = await r.json(); if (!Array.isArray(j)) throw new Error('resposta inválida'); arr = j; }

        const novo = {}; arr.forEach(x => { const v = parseFloat(String(x.valor).replace(',', '.')); if (x.data && isFinite(v)) novo[x.data.split('/').reverse().join('-')] = v; });
        if (!Object.keys(novo).length && a === anoFim && doc) throw new Error('sem dados novos');
        // nunca apaga taxas já guardadas: só acrescenta as novas
        const merged = { ...(doc?.dias || {}), ...novo };
        doc = { ano: a, dias: merged, fonte: 'Banco Central do Brasil — SGS série 12 (Taxa de juros CDI, % ao dia)', consultado_em: new Date().toISOString(), ano_completo: a < anoFim };
        if (!S.readonly) { try { await S.db.doc(`cdi_diario/${a}`).set(doc); } catch (e) { console.warn('cdi cache', e); } }

function cdiFator(dataISO, pct) {

    <div class="mute" style="font-size:.85rem;line-height:1.55;margin-top:8px">
    <p><b>Pagamentos:</b> parcelas deste imóvel com valor pago, exatamente como estão cadastradas (data e valor efetivamente pagos). Nada é copiado nem alterado; parcelas em aberto não entram. Lançamentos de "Investimento" da VRPM não são somados de novo, porque repetem as mesmas parcelas.</p>
    <p><b>CDI:</b> série oficial nº 12 do Sistema Gerenciador de Séries do Banco Central (Taxa de juros – CDI, % ao dia, dias úteis). As taxas ficam guardadas no banco do sistema e são completadas automaticamente quando o Banco Central publica dias novos; taxas já guardadas nunca são substituídas. Se a consulta falhar, o sistema usa só as taxas já guardadas e mostra a última data disponível — não há estimativa.</p>
    <p><b>Correção (juros compostos):</b> cada pagamento é corrigido separadamente, desde a própria data. O rendimento de cada dia útil incide sobre o valor já corrigido até a véspera: fator = ∏ (1 + p × CDIdia ÷ 100), da data do pagamento (inclusive) até a última taxa publicada (inclusive); p = percentual do CDI escolhido (100% = 1). Isso é o mesmo que aplicar o CDI de cada mês sobre o valor corrigido no mês anterior — clique num pagamento para ver essa evolução mês a mês. Nunca se soma correção simples sobre o valor original. Valor corrigido = valor pago × fator; o total corrigido é a soma dos valores corrigidos de todos os pagamentos.</p>
    <p><b>Preço mínimo:</b> preço = total corrigido ÷ (1 − corretagem − cessão). Com 6% + 3%, preço = total corrigido ÷ 0,91. Assim, depois de pagar os custos da venda, sobra exatamente o capital corrigido.</p>
    <p>Não considera imposto sobre ganho de capital, despesas de manutenção, aluguéis recebidos nem custos de cartório e ITBI que não estejam nas parcelas.</p></div></details>`;

/* ====================================================================== CORREÇÃO ANUAL PELO INCC (cadastro do imóvel)
   Índice: INCC-DI (FGV), série SGS 192 do Banco Central (variação % mensal), guardada em cache em indices/incc_di.
   Uma correção por ano, no aniversário da data-base do imóvel (campo incc_data_base; se vazio, data da compra).
   Em cada aniversário: valor corrigido = (valor corrigido anterior + pagamentos feitos no período) × (1 + INCC dos 12 meses do período).
   Os pagamentos feitos depois do último aniversário entram pelo valor nominal até a correção seguinte.
   Nada é gravado nas parcelas: o cálculo é feito na tela. Nenhum mês sem índice publicado é estimado. */
S.incc = S.incc || { meses: null, carregando: false, erro: null };
async function inccCarregar(forcar = false) {
  if (S.incc.carregando) return;
  S.incc.carregando = true; S.incc.erro = null;
  let doc = null; try { const s = await S.db.doc('indices/incc_di').get(); doc = s.exists ? s.data() : null; } catch { }
  const hoje = todayISO();
  if (forcar || !doc || (doc.consultado_em || '').slice(0, 10) !== hoje) {
    try {
      let arr = null, ult = null;
      for (let t = 0; t < 5 && !arr; t++) {
        try { const r = await fetch(`https://api.bcb.gov.br/dados/serie/bcdata.sgs.192/dados?formato=json&dataInicial=01/01/2010&dataFinal=${isoBR(hoje)}&_=${Date.now()}`, { cache: 'no-store' }); if (!r.ok) throw new Error('HTTP ' + r.status); const j = await r.json(); if (!Array.isArray(j)) throw new Error('resposta inválida'); arr = j; }
        catch (e) { ult = e; await new Promise(res => setTimeout(res, 1200 * (t + 1))); }
      }
      if (!arr) throw ult || new Error('sem resposta');
      const novo = {}; arr.forEach(x => { const v = parseFloat(String(x.valor).replace(',', '.')); if (x.data && isFinite(v)) { const [, m, a] = x.data.split('/'); novo[`${a}-${m}`] = v; } });
      doc = { serie: 192, indice: 'INCC-DI (FGV)', meses: { ...(doc?.meses || {}), ...novo }, fonte: 'Banco Central do Brasil — SGS série 192 (INCC-DI, FGV, variação % mensal)', consultado_em: new Date().toISOString() };
      if (!S.readonly) { try { await S.db.doc('indices/incc_di').set(doc); } catch (e) { console.warn('incc cache', e); } }
    } catch (e) { S.incc.erro = e.message || String(e); }
  }
  const meses = doc?.meses || null; const ks = meses ? Object.keys(meses).sort() : [];
  S.incc = { meses, carregando: false, erro: S.incc.erro, ultimo: ks[ks.length - 1] || null, primeiro: ks[0] || null, consultado: doc?.consultado_em || null };
  if (S.sheet?.kind === 'imovel') render(); else scheduleRender();
}
const mesAdd = (ym, n) => { let [a, m] = ym.split('-').map(Number); m += n; while (m > 12) { m -= 12; a++; } while (m < 1) { m += 12; a--; } return `${a}-${String(m).padStart(2, '0')}`; };
const mesNome = (ym) => { const [a, m] = ym.split('-'); return ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'][Number(m) - 1] + '/' + a; };
const anivISO = (iso, k) => { const [a, m, d] = iso.split('-').map(Number); const ult = new Date(Date.UTC(a + k, m, 0)).getUTCDate(); return `${a + k}-${String(m).padStart(2, '0')}-${String(Math.min(d, ult)).padStart(2, '0')}`; };
function inccCalc(im) {
  const pagas = (im.parcelas || []).filter(p => !p.excluido && p.valor_pago != null && Number(p.valor_pago) > 0);
  const comData = pagas.filter(p => /^\d{4}-\d{2}-\d{2}$/.test(p.data_pagamento || '')).sort((a, b) => a.data_pagamento.localeCompare(b.data_pagamento));
  const semData = pagas.filter(p => !comData.includes(p));
  const pago = pagas.reduce((s, p) => s + Number(p.valor_pago), 0);
  const pagoData = comData.reduce((s, p) => s + Number(p.valor_pago), 0);
  const dataBase = im.incc_data_base || im.data_compra || comData[0]?.data_pagamento || null;
  const R = { dataBase, origemBase: im.incc_data_base ? 'cadastro' : im.data_compra ? 'compra' : comData.length ? 'pagamento' : null, pago, pagoData, semData, anos: [], aguardando: null, proxima: null };
  if (!dataBase) { R.corrigido = null; return R; }
  const hoje = todayISO(); let valor = 0, usados = 0, k = 1;
  while (true) {
    const ant = anivISO(dataBase, k - 1), aniv = anivISO(dataBase, k);
    if (aniv > hoje) { R.proxima = aniv; break; }
    const m0 = ant.slice(0, 7); const meses = Array.from({ length: 12 }, (_, i) => mesAdd(m0, i));
    if (!S.incc.meses) { R.aguardando = { aniv, motivo: 'índice ainda não carregado' }; break; }
    const falta = meses.filter(m => S.incc.meses[m] == null);
    if (falta.length) { R.aguardando = { aniv, motivo: `INCC de ${falta.map(mesNome).join(', ')} ainda não publicado` }; break; }
    const fator = meses.reduce((f, m) => f * (1 + S.incc.meses[m] / 100), 1);
    const doPeriodo = comData.slice(usados).filter(p => p.data_pagamento < aniv); usados += doPeriodo.length;
    const pagosPer = doPeriodo.reduce((s, p) => s + Number(p.valor_pago), 0);
    const base = valor + pagosPer; const correcao = base * (fator - 1); valor = base + correcao;
    R.anos.push({ k, ant, aniv, mIni: meses[0], mFim: meses[11], fator, anterior: base - pagosPer, pagosPer, nPer: doPeriodo.length, base, correcao, valor });
    k++;
  }
  const depois = comData.slice(usados); R.depois = depois.reduce((s, p) => s + Number(p.valor_pago), 0); R.nDepois = depois.length;
  R.corrigido = valor + R.depois; R.correcaoTotal = R.corrigido - pagoData;
  return R;
}

  return `<section class="panel"><div class="panel-h"><h2>Comparação: CDI × INCC</h2><span class="mute" style="font-size:.8rem">mesmos pagamentos, dois índices</span></div>
    <div class="tablewrap"><table><thead><tr><th style="text-align:left"></th><th>${sim.pct_cdi}% do CDI<div class="mute" style="font-weight:400;font-size:.72rem;text-transform:none">diário, desde cada pagamento</div></th><th>INCC-DI (FGV)<div class="mute" style="font-weight:400;font-size:.72rem;text-transform:none">1× por ano, data-base ${R.dataBase ? fdate(R.dataBase) : '—'}</div></th><th>Diferença (CDI − INCC)</th></tr></thead><tbody>
      <tr><td style="text-align:left">Valor efetivamente pago</td><td>${brl(C.orig)}</td><td>${brl(R.pagoData)}</td><td>${brl(C.orig - R.pagoData)}</td></tr>
      <tr><td style="text-align:left">Valor corrigido</td><td><b>${cdiV != null ? brl(cdiV) : '—'}</b></td><td><b>${inV != null ? brl(inV) : '—'}</b></td><td class="${dif < 0 ? 'neg' : ''}">${dif != null ? brl(dif) : '—'}</td></tr>
      <tr><td style="text-align:left">Correção acumulada</td><td>${cdiV != null ? brl(cdiV - C.orig) + ' · ' + pc(cdiV, C.orig) : '—'}</td><td>${inV != null ? brl(inV - R.pagoData) + ' · ' + pc(inV, R.pagoData) : '—'}</td><td></td></tr>
      <tr class="total"><td style="text-align:left">Preço mínimo de venda (÷ ${div.toLocaleString('pt-BR', { maximumFractionDigits: 4 })})</td><td>${cdiV != null && div > 0 ? brl(cdiV / div) : '—'}</td><td>${inV != null && div > 0 ? brl(inV / div) : '—'}</td><td class="${dif < 0 ? 'neg' : ''}">${dif != null && div > 0 ? brl(dif / div) : '—'}</td></tr>
    </tbody></table></div>
    ${ganha ? `<p style="margin:8px 0 0;font-size:.88rem">${ganha}</p>` : ''}

    <p class="mute" style="font-size:.8rem;margin:6px 0 0">O preço mínimo dos quadros acima e do simulador continua pelo CDI. A coluna INCC mostra quanto seria o preço mínimo se o capital fosse corrigido pelo INCC, com os mesmos ${sim.corretagem}% de corretagem e ${sim.cessao}% de cessão.</p>

}

/* ====================================================================== sheets / toasts / confirm */
function openSheet(kind, ...args) { S.sheet = { kind, args }; S.sheetForm = null; render(); }
function closeSheet() { S.sheet = null; S.sheetForm = null; S.dirty = false; render(); }
function sheetData() {
  const { kind, args = [], data } = S.sheet;
  if (kind === 'custom') return data;
  if (kind === 'imovel') return imovelSheet(...args);
  if (kind === 'imovelForm') return imovelForm(...args);
  if (kind === 'parcela') return parcelaForm(args[0], args[1]);
  if (kind === 'novaParcela') return parcelaForm(args[0], null);
  if (kind === 'pagar') return parcelaForm(args[0], args[1], 'pagar');
  if (kind === 'lancForm') return lancForm(...args);
  if (kind === 'conta') return contaSheet(...args);
  if (kind === 'contaForm') return contaForm(...args);
  if (kind === 'recebForm') return recebForm(...args);
  if (kind === 'indiceForm') return indiceForm(...args);
  if (kind === 'origemForm') return origemForm(...args);
  if (kind === 'empresaForm') return empresaForm();
  const stx = stSheetData(kind, args); if (stx) return stx;
  const lcx = locSheetData(kind, args); if (lcx) return lcx;
  if (kind === 'pendFix') return pendFixSheet(...args);
  if (kind === 'inDet') return inicioDet(...args);
  const vnx = vndSheetData(kind, args); if (vnx) return vnx;
  if (kind === 'search') return searchSheet();
  if (kind === 'pickParcela') return pickParcela();
  return { title: '', body: '' };
}
function sheetHTML() {
  const d = sheetData(); if (!d) return '';
  S.sheetCtx = d.ctx || {}; S.sheetForm = d.form || null;
  return `<div class="scrim" data-act="scrim"><div class="sheet${['stRevisao', 'stMes', 'stExpl', 'pendFix', 'locLista', 'inDet'].includes(S.sheet.kind) || (S.sheet.kind === 'imovel' && S.imTab === 'inv') ? ' wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(d.title)}">
    <div class="sheet-h"><h2>${esc(d.title)}</h2><button class="iconbtn" data-act="closeSheet" aria-label="Fechar">${icon('x')}</button></div>
    <div class="sheet-b">${d.body}</div>${d.foot ? `<div class="sheet-f">${d.foot}</div>` : ''}</div></div>`;
}
function pickParcela() {
  const ab = imList().filter(i => !i.arquivado).flatMap(i => (i.parcelas || []).filter(p => !p.excluido && p.valor_pago == null).map(p => ({ i, p }))).sort((a, b) => (a.p.vencimento || '9').localeCompare(b.p.vencimento || '9'));
  return { title: 'Qual parcela?', body: ab.length ? `<div class="list">${ab.map(({ i, p }) => `<button class="row" data-act="pagar:${i.id}:${p.id}"><div class="main"><div class="t">${esc(shortName(i))}</div><div class="sub">${esc(p.tipo || '')} · ${esc((p.mes_ref || '').toLowerCase())} ${p.ano || ''} · vence ${fdate(p.vencimento)}</div></div><div class="amt">${brl(p.valor_parcela)}</div></button>`).join('')}</div>` : '<p class="mute">Nenhuma parcela em aberto.</p>' };
}
let confirmCfg = null;
function confirmSheet(cfg) {
  confirmCfg = cfg;
  S.sheet = { kind: 'custom', data: { title: cfg.title, body: `<p style="margin:0">${cfg.text}</p>${cfg.type ? `<div class="f"><label for="cf_type">Para confirmar, digite ${esc(cfg.type)}</label><input type="text" id="cf_type" autocomplete="off" autocapitalize="characters"></div>` : ''}`, foot: `<button class="btn" data-act="closeSheet">Cancelar</button><button class="btn ${cfg.danger ? 'danger' : 'primary'}" data-act="confirmOk">${esc(cfg.ok)}</button>` } };
  render();
}
let toastT = null;
function toast(msg, ms = 3200, action) {
  let el = $('#toast'); if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
  const err = /^(Não foi|Não consegui|Você não tem|Limite|Muitas|Arquivo de backup inválido|Download indisponível|Aguarde)/.test(msg);
  const busy = ms === 0;
  el.className = 'toast ' + (err ? 'err' : busy ? 'busy' : 'ok');
  el.innerHTML = `<span class="ti">${err ? icon('alert') : busy ? '<i class="spin"></i>' : icon('check')}</span><span>${esc(msg)}</span>${action ? `<button>${esc(action.label)}</button>` : ''}`; el.hidden = false;
  if (action) el.querySelector('button').onclick = () => { el.hidden = true; action.fn(); };
  clearTimeout(toastT); if (ms) toastT = setTimeout(() => { el.hidden = true; }, ms);
}
function showErrs(errs) {
  document.querySelectorAll('.f .err').forEach(e => e.remove());
  errs.forEach(([id, m]) => { const el = $('#' + id); const f = el?.closest('.f'); if (f) f.insertAdjacentHTML('beforeend', `<span class="err">${esc(m)}</span>`); });
  if (errs.length) { $('#' + errs[0][0])?.focus?.(); }
  return errs.length > 0;
}

/* ====================================================================== eventos */
function afterRender() {
  const bind = (id, k, ev = 'change') => { const el = $('#' + id); if (el) el.addEventListener(ev, () => { S.f[k] = el.value; render(); if (ev === 'input') { const e2 = $('#' + id); e2.focus(); e2.setSelectionRange(e2.value.length, e2.value.length); } }); };
  bind('piAno', 'piAno'); bind('piMes', 'piMes'); invWire();
  bind('locAno', 'locAno'); bind('locMes', 'locMes'); bind('locImF', 'locImF'); bind('locImSel', 'locIm');
  bind('stAno', 'stAno'); bind('stMes', 'stMes'); bind('stIm', 'stIm'); bind('stMet', 'stMet');
  if (S.sheet?.kind === 'stRevisao') stRevisaoWire();
  bind('imQ', 'imQ', 'input'); bind('imProp', 'imProp'); bind('imConf', 'imConf'); bind('imOrd', 'imOrd'); bind('imCat', 'imCat'); bind('imUso', 'imUso'); bind('lanAno', 'lanAno'); bind('lanMes', 'lanMes'); bind('lanOrigem', 'lanOrigem'); bind('lanQ', 'lanQ', 'input'); bind('relAno', 'relAno');
  if (S.sheet?.kind === 'search') { const g = $('#gq'); g.focus(); g.addEventListener('input', () => runSearch(g.value)); runSearch(g.value); }
  if (S.sheetForm === 'lanc') lancFormWire();
  if (S.sheetForm === 'vndpag') vndPagWire();
  document.querySelectorAll('.pfopt').forEach(l => l.addEventListener('focusin', (e) => { if (e.target.type !== 'radio') { const r = l.querySelector('input[type=radio]'); if (r && !r.checked) r.checked = true; } }));
  $('#e_cnpj')?.addEventListener('blur', (ev) => { ev.target.value = fmtCNPJ(ev.target.value); });
  $('#i_uso')?.addEventListener('change', () => { $('#i_mensal').hidden = $('#i_uso').value !== 'LOCAÇÃO MENSAL'; $('#i_uso_novo').hidden = $('#i_uso').value !== '__novo'; if ($('#i_uso').value === '__novo') $('#i_uso_novo').focus(); });
  if (S.view === 'backup') loadBackupList();
  $('#impXlsx')?.addEventListener('change', (e) => { const f = e.target.files[0]; if (f) importXlsx(f); });
  $('#impBanco')?.addEventListener('change', async (e) => { const f = e.target.files[0]; if (!f) return; try { const d = JSON.parse(await f.text()); if (d?.formato !== 'vrpm-banco-1' || !d.docs) throw 0; importarBanco(d, f.name); } catch { toast('Arquivo inválido: use o "Exportar banco completo" do sistema antigo.', 6000); } });
  $('#impJson')?.addEventListener('change', async (e) => { const f = e.target.files[0]; if (!f) return; try { const d = JSON.parse(await f.text()); if (!validBackup(d)) throw 0; confirmRestore(d, 'arquivo ' + f.name); } catch { toast('Arquivo de backup inválido.'); } });
}
/* Ações que gravam no banco: um clique de cada vez. Evita lançamentos repetidos quando o botão é apertado várias vezes
   ou a gravação demora. */
const WRITE_ACT = /(save|Save|Salvar|Del$|del$|Gravar|gravar|Aplicar|aplicar|apply|Conf|Link|Pag|Desc$|Ignorar|Confirmar|restaurar|apagar|excluir|pagar|virar|marcar|Toggle|Copiar|Repetir|resolver|Import|Restore|backupAgora|confirmOk|vnd[A-Za-z]*Save|locAluguel)/;
let ACT_BUSY = false;
async function onAppClick(e) {
  const t = e.target.closest('[data-go],[data-act],[data-imf],[data-lantipo],[data-ltipo],[data-uso],[data-stmodo]');
  if (!t) return;
  if (t.dataset.stmodo) { S.stImp.modo = t.dataset.stmodo; S.stImp.cmp = null; return render(); }
  if (t.dataset.uso) { S.f.imUso = S.f.imUso === t.dataset.uso ? '' : t.dataset.uso; return render(); }
  if (t.dataset.go) return go(t.dataset.go);
  if (t.dataset.imf) { S.f.imF = t.dataset.imf; if (t.dataset.imf === 'todos') { S.f.imQ = ''; S.f.imUso = ''; S.f.imCat = ''; S.f.imProp = ''; S.f.imConf = ''; } return render(); }
  if (t.dataset.lantipo !== undefined && t.dataset.lantipo !== null && t.hasAttribute('data-lantipo')) { S.f.lanTipo = t.dataset.lantipo; return render(); }
  if (t.dataset.ltipo) { t.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === t))); return lancFormWire(); }
  const a = t.dataset.act; if (!a) return;
  if (a === 'scrim') { if (e.target === t) closeSheet(); return; }
  const [cmd, ...p] = a.split(':');
  const W = !S.readonly;
  switch (cmd) {
    case 'go': return go(p[0]);
    case 'search': return openSheet('search');
    case 'closeSheet': return closeSheet();
    case 'imTab': S.imTab = p[0]; return render();
    case 'imLimpar': S.f.imQ = ''; S.f.imUso = ''; S.f.imCat = ''; S.f.imProp = ''; S.f.imConf = ''; return render();
    case 'novoLanc': return W && openSheet('lancForm', null);
    case 'lanc': return openSheet('lancForm', p[0]);
    case 'saveLanc': return saveLanc(S.sheetCtx);
    case 'dupLanc': { const l = findLanc(S.sheetCtx.id).item; const now = new Date(); S.sheet = { kind: 'lancForm', args: [null, { ...l, id: undefined, ano: now.getFullYear(), mes: now.getMonth() + 1, linha_origem: undefined, obs_importacao: undefined }] }; return render(); }
    case 'excluirLanc': { const f = findLanc(S.sheetCtx.id); closeSheet(); return softDelete('lanc', f.item.id, { doc: `${f.doc.ano}-${pad(f.doc.mes)}`, t: `${f.item.tipo} ${f.item.origem} ${brl(f.item.valor)}` }).catch(er => toast(dbErr(er))); }
    case 'imovel': return openSheet('imovel', p[0]);
    case 'novoImovel': return openSheet('imovelForm', null);
    case 'editImovel': return openSheet('imovelForm', p[0]);
    case 'saveImovel': return saveImovel(S.sheetCtx);
    case 'arquivarImovel': { const im = S.imoveis[p[0]]; try { await mutateDoc(`imoveis/${p[0]}`, d => { d.arquivado = !d.arquivado; }); await logHist('ARQUIVO', p[0], `${shortName(im)} ${im.arquivado ? 'desarquivado' : 'arquivado'}`); toast(im.arquivado ? 'Desarquivado' : 'Arquivado'); } catch (er) { toast(dbErr(er)); } return; }
    case 'excluirImovel': { const im = S.imoveis[p[0]]; return confirmSheet({ title: 'Mover imóvel para a Lixeira', text: `${esc(shortName(im))} e suas ${(im.parcelas || []).length} parcelas saem das listas e dos totais. Você pode restaurar pela Lixeira. Para só tirar da lista mantendo nos relatórios, use "Arquivar".`, ok: 'Mover para a Lixeira', danger: true, run: async () => { await softDelete('imovel', p[0], { t: shortName(im) }); } }); }
    case 'parcela': return openSheet('parcela', p[0], p[1]);
    case 'novaParcela': return openSheet('novaParcela', p[0]);
    case 'pagar': return W && openSheet('pagar', p[0], p[1]);
    case 'pagarProx': return openSheet('pickParcela');
    case 'saveParcela': return saveParcela(S.sheetCtx);
    case 'excluirParcela': { const { imId, pId } = S.sheetCtx; const pp = S.imoveis[imId].parcelas.find(x => x.id === pId); openSheet('imovel', imId); return softDelete('parcela', pId, { im: imId, t: `${pp.tipo} ${pp.mes_ref}/${pp.ano}` }).catch(er => toast(dbErr(er))); }
    case 'conta': return openSheet('conta', p[0]);
    case 'novaConta': return openSheet('contaForm', null);
    case 'editConta': return openSheet('contaForm', p[0]);
    case 'saveConta': return saveConta(S.sheetCtx);
    case 'pagarConta': return pagarConta(p[0]);
    case 'sit': return openSheet('conta', p[0]);
    case 'setSit': try { await setContaSituacao(p[0], p.slice(1).join(':')); toast('Situação atualizada'); closeSheet(); } catch (er) { toast(dbErr(er)); } return;
    case 'arquivarConta': try { await mutateDoc(`contas/${p[0]}`, d => { d.arquivado = true; }); await logHist('ARQUIVO', p[0], `Conta ${S.contas[p[0]].conta} arquivada`); toast('Conta arquivada'); closeSheet(); } catch (er) { toast(dbErr(er)); } return;
    case 'excluirConta': { const c = S.contas[p[0]]; closeSheet(); return softDelete('conta', p[0], { t: c.conta }).catch(er => toast(dbErr(er))); }
    case 'virarMes': return virarMes();
    case 'receb': return openSheet('recebForm', p[0]);
    case 'novoReceb': return openSheet('recebForm', null);
    case 'saveReceb': return saveReceb(S.sheetCtx);
    case 'excluirReceb': { const r = recebAll().find(x => x.id === S.sheetCtx.id); closeSheet(); return softDelete('receb', r.id, { doc: r._doc, t: r.item }).catch(er => toast(dbErr(er))); }
    case 'indice': return openSheet('indiceForm', p[0], p.slice(1).join(':'));
    case 'novoIndice': return openSheet('indiceForm');
    case 'saveIndice': return saveIndice(S.sheetCtx);
    case 'origem': return openSheet('origemForm', p[0]);
    case 'saveOrigem': return saveOrigem(S.sheetCtx);
    case 'sideToggle': S.collapsed = !S.collapsed; try { localStorage.setItem('vrpm_side', S.collapsed ? '1' : '0'); } catch { } return render();
    case 'inDet': return openSheet('inDet', ...p);
    case 'inLanc': S.f.lanAno = Number(p[0]); S.f.lanMes = Number(p[1]); S.f.lanTipo = ''; S.f.lanOrigem = ''; S.f.lanQ = ''; return go('lancamentos');
    case 'resolverPend': return openSheet('pendFix', p[0]);
    case 'pfAplicar': return pfAplicar(S.sheetCtx);
    case 'pfFill': { const el = $('#' + p[0]); if (el) { el.value = moneyInput(Number(p[1])); el.closest('.pfopt')?.querySelector('input[type=radio]')?.click(); } return; }
    case 'pfRep': { const v = $('#pf_rv' + p[0]), d = $('#pf_rd' + p[0]); if (v) v.value = moneyInput(Number(p[1])); if (d && p[2]) d.value = p[2]; v?.closest('.pfopt')?.querySelector('input[type=radio]')?.click(); return; }
    case 'savePend': { const res = $('#pd_res').value.trim(); try { await mutateDoc('config/pendencias', d => { const x = d.itens.find(i => i.id === p[0]); x.status = 'RESOLVIDA'; x.resolucao = res || 'Resolvida'; x.resolvida_em = new Date().toISOString(); }); await logHist('PENDÊNCIA', p[0], `Pendência resolvida: ${res}`); toast('Pendência resolvida'); closeSheet(); } catch (er) { toast(dbErr(er)); } return; }
    case 'reabrirPend': try { await mutateDoc('config/pendencias', d => { const x = d.itens.find(i => i.id === p[0]); x.status = 'ABERTA'; }); await logHist('PENDÊNCIA', p[0], 'Pendência reaberta'); } catch (er) { toast(dbErr(er)); } return;
    case 'restaurar': try { await restoreItem(p[0], p[1]); } catch (er) { toast(dbErr(er)); } return;
    case 'apagar': { const it = trashItems().find(x => x.k === p[0] && x.id === p[1]); return confirmSheet({ title: 'Apagar de vez', text: `<b>${esc(it.t)}</b> será removido definitivamente e não poderá ser restaurado pela Lixeira (só por uma cópia de segurança).`, ok: 'Apagar de vez', danger: true, type: 'EXCLUIR', run: () => purgeItem(p[0], p[1]) }); }
    case 'confirmOk': { const c = confirmCfg; if (!c) return; if (c.type && ($('#cf_type').value || '').trim().toUpperCase() !== c.type) return showErrs([['cf_type', `Digite ${c.type} para confirmar.`]]); closeSheet(); try { await c.run(); } catch (er) { toast(dbErr(er)); } return; }
    case 'editEmpresa': return openSheet('empresaForm');
    case 'saveEmpresa': return saveEmpresa();
    case 'copy': { const txt = p.join(':'); try { await navigator.clipboard.writeText(txt); toast('Copiado'); } catch { toast('Copie manualmente: ' + txt, 6000); } return; }
    case 'exportXlsx': return exportXlsx();
    case 'exportBanco': return exportBanco();
    case 'webSair': return window.VRPM_WEB?.sair();
    case 'webUsuarios': return window.VRPM_WEB?.usuarios();
    default: if (cmd.startsWith('inv') || cmd.startsWith('incc')) return invAct(cmd, p); if (cmd.startsWith('st')) return stAct(cmd, p); if (cmd.startsWith('loc')) return locAct(cmd, p); if (cmd.startsWith('vnd')) return vndAct(cmd, p); if (cmd.startsWith('pi')) return piAct(cmd, p); return;
    case 'exportJson': return exportJson();
    case 'applyImport': return applyImport();
    case 'backupAgora': try { toast('Fazendo cópia…', 0); await makeBackup('Cópia manual'); toast('Cópia criada'); loadBackupList(); } catch (er) { toast(dbErr(er)); } return;
    case 'bkDown': try { const d = (await S.db.doc(`backups/${p[0]}`).get()).data(); await saveFile(`Controle_VRPM_copia_${p[0].slice(0, 10)}.json`, await ungz(d.gz)); } catch { toast('Não foi possível abrir esta cópia.'); } return;
    case 'bkRestore': try { const d = (await S.db.doc(`backups/${p[0]}`).get()).data(); const data = JSON.parse(await ungz(d.gz)); if (!validBackup(data)) throw 0; confirmRestore(data, 'cópia de ' + fdate(d.criado_em)); } catch { toast('Não foi possível abrir esta cópia.'); } return;
  }
}
document.addEventListener('click', async (e) => {
  const t = e.target.closest('[data-act]');
  const cmd = t?.dataset.act?.split(':')[0] || '';
  if (!t || !WRITE_ACT.test(cmd)) return onAppClick(e);
  if (ACT_BUSY) { e.preventDefault(); return; }
  ACT_BUSY = true; t.classList.add('is-busy'); t.setAttribute('aria-busy', 'true');
  try { await onAppClick(e); } finally { ACT_BUSY = false; t.classList.remove('is-busy'); t.removeAttribute('aria-busy'); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && S.sheet) closeSheet();
  if ((e.key === 'k' && (e.metaKey || e.ctrlKey)) || (e.key === '/' && !/input|textarea|select/i.test(document.activeElement?.tagName))) { e.preventDefault(); openSheet('search'); }
});

/* ====================================================================== inicialização */
let renderQ = false;
function scheduleRender() {
  if (renderQ) return; renderQ = true;
  requestAnimationFrame(() => {
    renderQ = false;
    // não redesenha por baixo de um formulário aberto (o usuário pode estar digitando)
    const formOpen = S.sheet && (S.sheetForm || ['search', 'custom', 'stRevisao'].includes(S.sheet.kind));
    if (formOpen) { S.dirty = true; return; }
    render();
  });
}
async function init() {
  render();
  if (!window.claude?.use) { S.offline = true; return render(); }
  const [db, user, downloads] = await Promise.all([window.claude.use('db'), window.claude.use('user'), window.claude.use('downloads')]);
  S.db = db; S.user = user; S.downloads = downloads;
  if (!db) { S.offline = true; return render(); }
  try { S.uid = user ? await user.id() : null; } catch { }
  try { const w = user ? await user.can('data.write') : null; if (w === false) S.readonly = true; } catch { }
  const sub = (coll, key, fn) => db.collection(coll).onSnapshot(snap => { S[key] = {}; snap.docs.forEach(d => fn(d)); S.loaded[key] = true; scheduleRender(); maybeFirst(); }, err => { console.warn(coll, err); S.loaded[key] = true; scheduleRender(); });
  sub('imoveis', 'imoveis', d => { S.imoveis[d.id] = d.data(); });
  sub('lanc', 'lanc', d => { S.lanc[d.id] = d.data(); });
  sub('contas', 'contas', d => { S.contas[d.id] = d.data(); });
  sub('receb', 'receb', d => { S.receb[d.id] = d.data(); });
  sub('config', 'config', d => { S.config[d.id] = d.data(); });
  sub('hist', 'hist', d => { S.hist[d.id] = d.data(); });
  sub('st_cfg', 'stcfg', d => { S.stcfg[d.id] = d.data(); });
  sub('st_mes', 'stmes', d => { S.stmes[d.id] = d.data(); });
  sub('loc_cfg', 'loccfg', d => { S.loccfg[d.id] = d.data(); });
  sub('loc_mes', 'locmes', d => { S.locmes[d.id] = d.data(); });
  sub('vendas', 'vendas', d => { S.vendas[d.id] = d.data(); });
}
let firstDone = false;
function maybeFirst() { if (firstDone || !ready()) return; firstDone = true; setTimeout(autoBackup, 2500); }
init();
})();

</script>
